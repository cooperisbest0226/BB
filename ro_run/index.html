<!DOCTYPE html>
<!-- 星座塔團隊 · 作者：BB -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f7">
<title>星座塔團隊</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="星座塔團隊">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark">星座塔團隊</span>
        <span class="brand-sub" id="brandSub"></span>
      </div>
      <button class="icon-btn" id="btnMore" title="更多" aria-label="更多">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
    </div>
    <!-- 待分配成員：從畫面底部移上來，緊接在標題列下方；只有「陣容分配」分頁會顯示 -->
    <div class="bench" id="bench" data-drop="bench">
      <div class="bench-top">
        <span class="bench-t" id="benchTitle">待分配</span>
        <div class="sec-line"></div>
        <button class="gbtn" id="btnClearDay">清空本日</button>
      </div>
      <div class="bench-list" id="benchList"></div>
    </div>
  </div>

  <!-- 排班 -->
  <section class="view active" id="view-board">
    <div class="daterail">
      <div class="dates" id="dateRail"></div>
    </div>
    <div class="date-actions">
      <button class="icon-btn sm" id="btnPrevDate" aria-label="前一天">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="icon-btn sm" id="btnNextDate" aria-label="後一天">
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="gbtn" id="btnToday">今天</button>
      <span class="date-actions-gap"></span>
      <button class="gbtn" id="btnAddDate">＋ 新增</button>
      <button class="gbtn" id="btnEditDate">修改</button>
      <button class="gbtn warn" id="btnDelDate">刪除</button>
    </div>
    <div class="sec"><span class="sec-t" id="boardLabel">RUN</span><div class="sec-line"></div>
      <button class="gbtn" id="btnAddPt">＋ 新增 RUN</button>
    </div>
    <div class="ptgrid" id="ptGrid"></div>
  </section>


  <!-- PT 計算 -->
  <section class="view" id="view-calc">
    <div class="sec"><span class="sec-t">屬性配置</span><div class="sec-line"></div></div>
    <div id="attrCards"></div>

    <div class="sec"><span class="sec-t">合計</span><div class="sec-line"></div></div>
    <div class="totalcard">
      <div class="total-k">總 PT 等級</div>
      <div class="total-v num" id="calcTotal">0<small>pt</small></div>
      <div class="total-meter" id="calcMeter"></div>
      <span class="tier" id="calcTier"><span class="tier-dot"></span><span id="calcTierText">50 層挑戰範圍</span></span>
      <div class="presets">
        <button class="gbtn" data-preset="0,0,0,0,0">重置</button>
        <button class="gbtn" data-preset="0,5,5,3,5">825PT</button>
        <button class="gbtn" data-preset="0,5,5,5,5">925PT</button>
        <button class="gbtn" data-preset="3,5,5,5,5">970PT</button>
        <button class="gbtn" data-preset="5,5,5,5,5">1000PT</button>
      </div>
    </div>

    <div class="sec"><span class="sec-t">屬性明細</span><div class="sec-line"></div></div>
    <div class="bd" id="calcBreak"></div>
  </section>

  <!-- 成員 -->
  <section class="view" id="view-members">
    <div class="sec"><span class="sec-t">成員</span><div class="sec-line"></div>
      <button class="gbtn accent" id="btnAddMember">＋ 新增成員</button>
    </div>
    <div class="field"><input id="memberSearch" placeholder="搜尋名字或暱稱⋯"></div>
    <div id="memberList"></div>
  </section>

  <!-- 職業 -->
  <section class="view" id="view-roles">
    <div class="sec"><span class="sec-t">職業</span><div class="sec-line"></div>
      <div id="roleHeaderActions"></div>
    </div>
    <div id="roleList"></div>
  </section>

  <!-- 材料統計 -->
  <section class="view" id="view-stats">
    <div class="sec"><span class="sec-t">材料統計</span><div class="sec-line"></div></div>

    <!-- 篩選條件平常收起來，只留一行摘要，需要調整才展開 -->
    <button class="matfilt" id="matFiltBtn" aria-expanded="false" aria-controls="matFiltBody">
      <span class="matfilt-l">篩選</span>
      <span class="matfilt-v" id="matFiltText">全部日期 · 全部場次</span>
      <svg class="matfilt-c" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="matfilt-body" id="matFiltBody" hidden>
      <div class="field-2 mat-range">
        <div class="field"><label>從</label><input type="date" id="matFrom"></div>
        <div class="field"><label>到</label><input type="date" id="matTo"></div>
      </div>
      <div class="field"><label>場次（選填，只看特定 RUN 名稱）</label><select id="matRun"><option value="">全部</option></select></div>
      <div class="preset-row">
        <button class="gbtn" data-preset="today">今天</button>
        <button class="gbtn" data-preset="week">本週</button>
        <button class="gbtn" data-preset="month">本月</button>
        <button class="gbtn" data-preset="all">全部</button>
      </div>
    </div>

    <div class="statgrid" id="matCards" style="margin-bottom:16px"></div>

    <!-- 三塊內容改成子分頁切換，一次只看一件事 -->
    <div class="subseg" role="tablist" id="matSeg">
      <button role="tab" aria-selected="true"  data-sub="totals">材料總計</button>
      <button role="tab" aria-selected="false" data-sub="sets">組數試算</button>
      <button role="tab" aria-selected="false" data-sub="sales">售出計算</button>
      <button role="tab" aria-selected="false" data-sub="detail">場次明細</button>
    </div>

    <div class="subview active" id="sub-totals">
      <div id="matBars"></div>
    </div>

    <div class="subview" id="sub-sets">
      <div class="setcfg">
        <label for="matPerSet">每種材料</label>
        <input type="number" id="matPerSet" min="1" value="5">
        <label for="matPerSet">個 = 1 組</label>
      </div>
      <div class="statgrid" id="setCards" style="margin-bottom:16px"></div>
      <div id="setDetail"></div>
    </div>

    <div class="subview" id="sub-sales">
      <div class="salebox">
        <div class="field">
          <label>組數
            <button class="minibtn" id="saleLoad" type="button">帶入目前組數</button>
          </label>
          <input type="number" id="saleSets" min="0" step="1" inputmode="numeric">
        </div>
        <div class="field-2">
          <div class="field"><label>台幣（每組）</label>
            <input type="number" id="saleTwd" min="0" step="any" inputmode="decimal"></div>
          <div class="field"><label>遊戲 R 幣值（1 台幣 = ? R）</label>
            <input type="number" id="saleRate" min="0" step="any" inputmode="decimal"></div>
        </div>
        <div class="calcout" id="saleOut"></div>
        <button class="gbtn accent" id="saleAdd" style="width:100%; margin-top:12px">記錄這筆交易</button>
      </div>

      <div class="statgrid" id="saleCards" style="margin:16px 0"></div>
      <div class="sec"><span class="sec-t">交易明細</span><div class="sec-line"></div></div>
      <div id="saleList"></div>
    </div>

    <div class="subview" id="sub-detail">
      <div id="matDetail"></div>
    </div>
  </section>
</div>

<!-- 底部懸浮分頁列：Liquid Glass 風格。圖示 + 短標籤，底部窄空間下辨識度比純文字高 -->
<nav class="tabbar" role="tablist" aria-label="主要分頁">
  <div class="tabbar-glass">
    <button class="tab" role="tab" aria-selected="true" data-view="board">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="9" rx="2"/><path d="M14 17h7"/></svg>
      <span>陣容</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="calc">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8"/><path d="M8 13h3"/><path d="M8 17h3"/><path d="M15 13v4"/><path d="M13 15h4"/></svg>
      <span>PT 計算</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="members">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.6a3.4 3.4 0 0 1 0 6.8"/><path d="M17.5 14.6a5.5 5.5 0 0 1 3 4.4"/></svg>
      <span>成員</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="roles">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3.2v5c0 4.2-2.9 7.6-7 9.8-4.1-2.2-7-5.6-7-9.8v-5Z"/><path d="M9.4 12.2l1.9 1.9 3.5-3.7"/></svg>
      <span>職業</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11"/><path d="M12 20V5"/><path d="M19 20v-6"/></svg>
      <span>材料</span>
    </button>
  </div>
</nav>

<div id="sheetHost"></div>
<div id="exportHost"></div>

/* 取得某職業的整條轉職鏈（一轉 → 該職業） */
function roJobChain(jid){
  const out=[]; let cur=jid;
  while(cur&&RO_JOBS[cur]){ out.unshift(cur); cur=RO_JOBS[cur].p; }
  return out;
}
/* 鏈上有支援技能的職業才列進選單，避免選了卻沒東西可挑 */
function roPickableJobs(){
  return Object.keys(RO_JOBS).filter(jid=>roJobChain(jid).some(c=>RO_JOBS[c].s.length));
}
/* 用職業名稱回頭找 RO 職業 id（App 預設職業就是四轉職業名，所以多半對得上） */
function roJobIdByName(name){
  const n=(name||'').trim();
  return Object.keys(RO_JOBS).find(jid=>RO_JOBS[jid].n===n)||null;
}

// 全新安裝時的預設狀態：不帶任何示範成員／RUN，職業清單直接套用四轉職業
function seed(){
  const roles=FOURTH_JOBS.map((j,i)=>({id:uid(),name:j.name,color:PALETTE[i%PALETTE.length],icon:j.icon,order:i}));
  return {schemaVersion:SCHEMA_VERSION,members:[],roles,schedule:{},sales:[]};
}

function mkPt(name,time,cap){ return {id:uid(),name,time,capacity:cap,slots:[],drops:[]}; }
function todayKey(){ const d=new Date(); return ymd(d); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
const DOW=['日','一','二','三','四','五','六'];
function fmtDate(k){ const d=parseYmd(k); return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function fmtDow(k){ return '週'+DOW[parseYmd(k).getDay()]; }
/* 手動組時間字串，不用 toLocaleString —— zh-TW 這個 locale 在部分瀏覽器上 hour12:false 不會正確生效，
   半夜容易跑出「24:xx」或又跳回 12 小時制帶「上午/下午」的錯誤格式，自己組才會保證是正確的 24 小時制在地時間 */
function fmtNow(){
  const d=new Date();
  const y=d.getFullYear(), mo=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
  const h=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0'), se=String(d.getSeconds()).padStart(2,'0');
  return `${y}/${mo}/${da} ${h}:${mi}:${se}`;
}
function shiftDate(k,n){ const d=parseYmd(k); d.setDate(d.getDate()+n); return ymd(d); }

/* ── 資料結構版本遷移 ─────────────────────────────────────
   以前是靠「某個欄位在不在」反推資料是哪一版，每加一個欄位就要多一段猜測邏輯。
   改成明確的 schemaVersion：舊資料沒有這個欄位就當成第 0 版，
   然後照順序把 0→1、1→2 … 的轉換一步步套上去，之後要再加版本只要往 MIGRATIONS 後面接一段。 */
const MIGRATIONS=[
  /* 0 → 1：舊命名 PT 1 / PT1 改成 RUN 1；補上 drops 陣列；
            技能 BUFF 從「成員」搬到「職業」（同職業的人 BUFF 才會一致）；補上 sales 欄位 */
  p=>{
    Object.values(p.schedule||{}).forEach(pts=>pts.forEach(pt=>{
      const m=/^PT\s*(\d+)$/i.exec((pt.name||'').trim());
      if(m) pt.name='RUN '+m[1];
      if(!Array.isArray(pt.drops)) pt.drops=[];
    }));
    (p.members||[]).forEach(m=>{
      if(m.buff&&m.defaultRoleId){
        const r=(p.roles||[]).find(x=>x.id===m.defaultRoleId);
        if(r&&!r.buff) r.buff=m.buff;
      }
      delete m.buff;
    });
    if(!Array.isArray(p.sales)) p.sales=[];
  },
];
const SCHEMA_VERSION=MIGRATIONS.length;

function migrate(p){
  let from=Number.isInteger(p.schemaVersion)?p.schemaVersion:0;
  /* 資料比程式還新（例如從新版匯出的 JSON 匯進舊版 App）就不硬轉，原樣留著避免弄壞資料 */
  if(from>SCHEMA_VERSION) return p;
  for(let v=from; v<SCHEMA_VERSION; v++) MIGRATIONS[v](p);
  p.schemaVersion=SCHEMA_VERSION;
  return p;
}

let state=load(), curDate=null, picked=null, roleFilter=null, dateRailReady=false;

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){ const p=JSON.parse(r); if(p&&p.members&&p.roles&&p.schedule) return migrate(p); }
  }catch(e){}
  return seed();
}
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ toast('儲存失敗，裝置空間可能已滿'); } }

/* 所有異動都走這裡：改資料 → 存檔 → 重繪。
   （復原／重做已移除，因此不再需要每次異動前後各做一次整包 JSON 快照比對） */
function commit(fn){
  fn();
  persist(); render();
}

const dates=()=>Object.keys(state.schedule).sort();
const ptsOf=k=>state.schedule[k]||[];
const memberById=id=>state.members.find(m=>m.id===id);
const roleById=id=>state.roles.find(r=>r.id===id);
const sortedRoles=()=>[...state.roles].sort((a,b)=>a.order-b.order);
function assignedIds(k){ const s=new Set(); ptsOf(k).forEach(p=>p.slots.forEach(x=>s.add(x.memberId))); return s; }
/* 同一天可以把同一個人加進多個 RUN，所以「成員名單」永遠列出全部啟用中的成員，
   不會因為已經加過就消失 —— 這樣才能重複拖曳/點選加入不同場次。 */
function countRuns(k,memberId){ return ptsOf(k).reduce((n,p)=>n+(p.slots.some(s=>s.memberId===memberId)?1:0),0); }
function benchMembers(k){ return state.members.filter(m=>m.active); }
/* 純粹「今天一場都還沒排到」的人 —— 給統計卡片用 */
function unassignedMembers(k){ const a=assignedIds(k); return state.members.filter(m=>m.active&&!a.has(m.id)); }
function ensureDate(k){ if(!state.schedule[k]) state.schedule[k]=[]; }

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },1900);
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hexA(hex,a){ const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return `rgba(${r},${g},${b},${a})`; }

/* 開啟 App 預設停在「今天」；今天還沒建立排班時，退而求其次選離今天最近的一天（同距離優先選未來） */
function defaultDate(){
  const ks=dates(), tk=todayKey();
  if(!ks.length) return tk;
  if(ks.includes(tk)) return tk;
  const t=parseYmd(tk).getTime();
  return ks.slice().sort((a,b)=>{
    const da=parseYmd(a).getTime()-t, db=parseYmd(b).getTime()-t;
    const ad=Math.abs(da)-Math.abs(db);
    return ad!==0?ad:(db-da);
  })[0];
}
/* 材料統計會掃過「所有日期」的排班歷史，成本隨資料量線性成長。
   在陣容分配裡拖一個人也會觸發 render()，沒必要每次都重算整段歷史 ——
   看不到統計分頁時只標記「資料髒了」，等真的切過去再算。 */

        <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
      <button class="icon-btn" data-act="roleDown" data-id="${r.id}" ${i===rs.length-1?'disabled':''} aria-label="下移">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`}
    </div>`;
  }).join('')+`</div>`;

  const start=document.getElementById('roleSelStart');
  if(start) start.onclick=()=>{ roleSelectMode=true; roleSelected=new Set(); renderRoles(); };
  const cancel=document.getElementById('roleSelCancel');
  if(cancel) cancel.onclick=()=>{ roleSelectMode=false; roleSelected=new Set(); renderRoles(); };
  const del=document.getElementById('roleSelDelete');
  if(del) del.onclick=()=>{
    if(!roleSelected.size) return;
    const ids=[...roleSelected], names=ids.map(id=>roleById(id)?.name).filter(Boolean).join('、');

      commit(()=>{
        state.roles=state.roles.filter(x=>!ids.includes(x.id));

        state.members.forEach(m=>{ if(ids.includes(m.defaultRoleId)) m.defaultRoleId=null; });
      });
      roleSelectMode=false; roleSelected=new Set(); render();
    });
  };
}

/* ── 材料系列分色 ─────────────────────────────────────────
   碎片系列＝紅、浮塵系列＝藍、其餘（未知的隕石碎片、符文石之類）＝綠。
   同一套顏色貫穿：統計頁長條圖、掉落標籤、批次編輯面板、匯出圖片。 */
/* 名字裡雖然有「碎片／浮塵」，但不屬於六屬性系列的材料，一律歸到「其餘」 */
const SERIES_EXCEPT=['未知的隕石碎片'];
const MAT_SERIES=[
  {key:'shard',label:'碎片',test:n=>!SERIES_EXCEPT.includes(n)&&n.includes('碎片'),
   color:'#dc2626', ink:'#991b1b', soft:'rgba(220,38,38,.09)', line:'rgba(220,38,38,.26)'},
  {key:'dust', label:'浮塵',test:n=>!SERIES_EXCEPT.includes(n)&&n.includes('浮塵'),
   color:'#1d4ed8', ink:'#1e3a8a', soft:'rgba(29,78,216,.09)', line:'rgba(29,78,216,.26)'},
  {key:'other',label:'其餘',test:()=>true,
   color:'#0f9d76', ink:'#065f46', soft:'rgba(15,157,118,.10)', line:'rgba(15,157,118,.28)'},
];
function matSeries(name){ return MAT_SERIES.find(s=>s.test(name||'')) || MAT_SERIES[2]; }
/* 給 CSS 變數用，元素只要吃 --ms / --ms-ink / --ms-soft / --ms-line 就自動變成該系列的顏色 */
function msVars(s){ return `--ms:${s.color};--ms-ink:${s.ink};--ms-soft:${s.soft};--ms-line:${s.line}`; }
/* 掉落標籤一律照系列排（碎片 → 浮塵 → 其餘），同系列內維持記錄順序 */
function sortDrops(drops){
  const rank=n=>MAT_SERIES.findIndex(s=>s.key===matSeries(n).key);
  return [...drops].sort((a,b)=>rank(a.name)-rank(b.name));
}
/* 把材料名稱依系列分堆，順序固定：碎片 → 浮塵 → 其餘 */
function groupBySeries(names){
  return MAT_SERIES.map(s=>({s,names:names.filter(n=>matSeries(n).key===s.key)})).filter(g=>g.names.length);
}

function allRunNames(){
  const set=new Set();
  Object.values(state.schedule).forEach(pts=>pts.forEach(pt=>set.add(pt.name)));
  return [...set].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
}
function matMatches(k,pt){
  if(matFrom && k<matFrom) return false;
  if(matTo && k>matTo) return false;
  if(matRunName && pt.name!==matRunName) return false;
  return true;
}
/* 組數試算：以下 12 種材料「每種各 N 個」算 1 組（預設 N=5）。
   未知的隕石碎片、稀微魔力符文石不算在組合裡。組數取決於最少的那一種（木桶效應）。 */
const SET_RECIPE=[
  '威力隕石浮塵','耐力隕石浮塵','專注隕石浮塵','創造隕石浮塵','咒數隕石浮塵','智慧隕石浮塵',
  '威力隕石碎片','耐力隕石碎片','專注隕石碎片','創造隕石碎片','咒數隕石碎片','智慧隕石碎片',
];
let matPerSet=5;

/* 篩選摘要（收合狀態下那一行字） */
function matFilterText(){
  const range = (!matFrom&&!matTo) ? '全部日期'
    : (matFrom&&matTo&&matFrom===matTo) ? fmtDate(matFrom)
    : `${matFrom?fmtDate(matFrom):'最早'} – ${matTo?fmtDate(matTo):'最新'}`;
  return `${range} · ${matRunName||'全部場次'}`;
}

function renderMaterials(){
  const runSel=document.getElementById('matRun');
  runSel.innerHTML=`<option value="">全部</option>`+allRunNames().map(n=>
    `<option value="${esc(n)}" ${n===matRunName?'selected':''}>${esc(n)}</option>`).join('');
  document.getElementById('matFrom').value=matFrom;
  document.getElementById('matTo').value=matTo;
  document.getElementById('matFiltText').textContent=matFilterText();

  const entries=[];
  Object.keys(state.schedule).sort().forEach(k=>{
    ptsOf(k).forEach(pt=>{ if(matMatches(k,pt)) entries.push({date:k,pt}); });
  });

  const totals={}; let dropSum=0, runsWithDrops=0;
  entries.forEach(({pt})=>{
    if(pt.drops&&pt.drops.length){
      runsWithDrops++;
      pt.drops.forEach(d=>{ totals[d.name]=(totals[d.name]||0)+d.qty; dropSum+=d.qty; });
    }
  });
  const matNames=Object.keys(totals).sort((a,b)=>totals[b]-totals[a]);

  document.getElementById('matCards').innerHTML=[
    ['符合場次', entries.length],
    ['有掉落的場次', runsWithDrops],
    ['材料種類', matNames.length],
    ['掉落總數量', dropSum],
  ].map(([k,v])=>`<div class="stat"><div class="stat-k">${k}</div><div class="stat-v num">${v}</div></div>`).join('');

  /* 材料總計：分成 碎片／浮塵／其餘 三張卡，各自小計，長條圖用系列色 */
  const max=Math.max(1,...matNames.map(n=>totals[n]));
  document.getElementById('matBars').innerHTML = matNames.length
    ? groupBySeries(matNames).map(({s,names})=>{
        const sum=names.reduce((a,n)=>a+totals[n],0);
        return `<div class="matgrp" style="${msVars(s)}">
          <div class="matgrp-h"><span class="matgrp-t">${s.label}</span>
            <span class="matgrp-k">${names.length} 種</span>
            <span class="matgrp-v num">${sum}</span></div>
          <div class="bars">${names.map(n=>`<div class="bar-row"><span class="bar-l">${esc(n)}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${totals[n]/max*100}%"></div></div>
            <span class="bar-n num">${totals[n]}</span></div>`).join('')}</div>
        </div>`;
      }).join('')
    : `<div class="bench-empty">這個範圍還沒有掉落紀錄</div>`;

  /* ── 組數試算 ───────────────────────────────────────── */
  const per=Math.max(1,matPerSet);
  document.getElementById('matPerSet').value=per;
  const sets=Math.min(...SET_RECIPE.map(n=>Math.floor((totals[n]||0)/per)));
  const nextNeed=(sets+1)*per;                      // 要湊到下一組，每種材料需累積到的量
  const shortTotal=SET_RECIPE.reduce((a,n)=>a+Math.max(0,nextNeed-(totals[n]||0)),0);
  curSets=sets;                                     // 給售出計算「帶入目前組數」用

  document.getElementById('setCards').innerHTML=[
    ['可組成組數', sets],
    ['湊下一組還缺', shortTotal],
  ].map(([k,v])=>`<div class="stat"><div class="stat-k">${k}</div><div class="stat-v num">${v}</div></div>`).join('');

  document.getElementById('setDetail').innerHTML=groupBySeries(SET_RECIPE).map(({s,names})=>
    `<div class="matgrp" style="${msVars(s)}">
      <div class="matgrp-h"><span class="matgrp-t">${s.label}</span>
        <span class="matgrp-k">${names.length} 種</span>
        <span class="matgrp-v num">${names.reduce((a,n)=>a+(totals[n]||0),0)}</span></div>
      <div class="bars">${names.map(n=>{
        const q=totals[n]||0, own=Math.floor(q/per), lack=Math.max(0,nextNeed-q);
        /* 卡住整體組數的那幾種（木桶效應的短板）標成琥珀色，一眼看出瓶頸 */
        return `<div class="setrow ${own===sets?'short':''}">
          <span class="setrow-n">${esc(n)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,q/nextNeed*100)}%${own===sets?';background:#b45309':''}"></div></div>
          <span class="setrow-v"><b>${q}</b> · ${lack?`缺 ${lack}`:'已足'}</span>
        </div>`;
      }).join('')}</div>
    </div>`).join('');

  const withDrops=entries.filter(e=>e.pt.drops&&e.pt.drops.length).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('matDetail').innerHTML = withDrops.length
    ? withDrops.map(({date,pt})=>`<div class="ex-pt">
        <div class="ex-pt-h"><span class="ex-pt-n">${fmtDate(date)} ${fmtDow(date)} · ${esc(pt.name)}</span>
          <span class="ex-pt-t">${esc(pt.time||'')}</span></div>
        <div class="dropgrid" style="padding:11px 14px">${sortDrops(pt.drops).map(d=>
          `<span class="droppill" style="${msVars(matSeries(d.name))}">${esc(d.name)}<span class="drop-qty">×${d.qty}</span></span>`).join('')}</div>
      </div>`).join('')
    : `<div class="bench-empty">這個範圍還沒有掉落紀錄</div>`;

  renderSales();
}

/* ── 售出計算 ─────────────────────────────────────────────
   組數 × 台幣 = 總台幣；總台幣 × 遊戲 R 幣值 = 總遊戲 R 幣。
   每按一次「記錄這筆交易」就存成一筆，交易明細照次數由新到舊列出，上方是累計。 */
function saleAmounts(s){
  const twd=(Number(s.sets)||0)*(Number(s.twd)||0);
  return {twd, r:twd*(Number(s.rate)||0)};
}

function renderSales(){
  const sales=state.sales||[];
  const last=sales[sales.length-1];
  /* 沒動過的欄位：組數跟著目前可組成的組數走，台幣／R 幣值沿用上一筆 */
  if(saleSets===null) saleSets=curSets;
  if(saleTwd===null)  saleTwd = last ? last.twd : '';
  if(saleRate===null) saleRate= last ? last.rate : '';

  const setsEl=document.getElementById('saleSets');
  const twdEl=document.getElementById('saleTwd');
  const rateEl=document.getElementById('saleRate');
  if(document.activeElement!==setsEl) setsEl.value=saleSets;
  if(document.activeElement!==twdEl)  twdEl.value=saleTwd;
  if(document.activeElement!==rateEl) rateEl.value=saleRate;
  document.getElementById('saleLoad').textContent=`帶入目前組數 ${curSets}`;

  const cur={sets:saleSets,twd:saleTwd,rate:saleRate};
  const a=saleAmounts(cur);
  document.getElementById('saleOut').innerHTML=`
    <div class="calcline">總台幣 <em>${nf(cur.sets)} 組 × ${nf(cur.twd)}</em><b>${nf(a.twd)}</b></div>
    <div class="calcline r">總遊戲 R 幣 <em>${nf(a.twd)} × ${nf(cur.rate)}</em><b>${nf(a.r)}</b></div>`;

  /* 累計 */
  const sum=sales.reduce((o,s)=>{ const x=saleAmounts(s);
    o.sets+=Number(s.sets)||0; o.twd+=x.twd; o.r+=x.r; return o; },{sets:0,twd:0,r:0});
  document.getElementById('saleCards').innerHTML=[
    ['交易次數', nf(sales.length)],
    ['累計售出組數', nf(sum.sets)],
    ['累計總台幣', nf(sum.twd)],
    ['累計總 R 幣', nf(sum.r)],
  ].map(([k,v])=>`<div class="stat"><div class="stat-k">${k}</div><div class="stat-v num">${v}</div></div>`).join('');

  document.getElementById('saleList').innerHTML = sales.length
    ? sales.map((s,i)=>({s,i})).reverse().map(({s,i})=>{
        const x=saleAmounts(s);
        return `<div class="salerow">
          <span class="salerow-i num">${i+1}</span>
          <div class="salerow-m">
            <div class="salerow-t num">${nf(x.twd)} <span>· ${nf(x.r)} R</span></div>
            <div class="salerow-s">${fmtDate(s.date)} ${fmtDow(s.date)} · ${nf(s.sets)} 組 × ${nf(s.twd)} 台幣 · R 幣值 ${nf(s.rate)}</div>
          </div>
          <button class="salerow-edit" data-act="editSale" data-id="${s.id}" aria-label="編輯這筆交易" title="編輯"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="salerow-x" data-act="delSale" data-id="${s.id}" aria-label="刪除這筆交易">×</button>
        </div>`;
      }).join('')
    : `<div class="bench-empty">還沒有交易紀錄，填好上面的欄位後按「記錄這筆交易」</div>`;
}
function applyMatPreset(p){
  const t=todayKey();
  if(p==='today'){ matFrom=t; matTo=t; }
  else if(p==='week'){ const d=parseYmd(t); const dow=(d.getDay()+6)%7; matFrom=shiftDate(t,-dow); matTo=shiftDate(t,6-dow); }
  else if(p==='month'){ matFrom=t.slice(0,8)+'01'; const d=parseYmd(t); matTo=shiftDate(matFrom,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-1); }
  else { matFrom=''; matTo=''; }
  renderMaterials();
}
document.getElementById('matFrom').onchange=e=>{ matFrom=e.target.value; renderMaterials(); };document.getElementById('matTo').onchange=e=>{ matTo=e.target.value; renderMaterials(); };
document.getElementById('matRun').onchange=e=>{ matRunName=e.target.value; renderMaterials(); };
document.getElementById('matPerSet').oninput=e=>{ matPerSet=Math.max(1,parseInt(e.target.value)||1); renderMaterials(); };
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>applyMatPreset(b.dataset.preset));

/* 篩選展開／收合 */
const matFiltBtn=document.getElementById('matFiltBtn'), matFiltBody=document.getElementById('matFiltBody');
matFiltBtn.onclick=()=>{
  const open=matFiltBtn.getAttribute('aria-expanded')==='true';
  matFiltBtn.setAttribute('aria-expanded',String(!open));
  matFiltBody.hidden=open;
};
/* 售出計算：欄位即時重算，不進 undo 堆疊（還沒按記錄的都只是試算） */
const saleLive=(id,set)=>document.getElementById(id).oninput=e=>{ set(e.target.value); renderSales(); };
saleLive('saleSets', v=>saleSets=v);
saleLive('saleTwd',  v=>saleTwd=v);
saleLive('saleRate', v=>saleRate=v);
document.getElementById('saleLoad').onclick=()=>{ saleSets=curSets; renderSales(); };
document.getElementById('saleAdd').onclick=()=>{
  const sets=Number(saleSets)||0, twd=Number(saleTwd)||0, rate=Number(saleRate)||0;
  if(sets<=0)  return toast('請先填組數');
  if(twd<=0)   return toast('請先填每組台幣');
  commit(()=>{ (state.sales=state.sales||[]).push({id:uid(),date:todayKey(),sets,twd,rate}); });
  toast('已記錄這筆交易');
};

/* 編輯一筆已記錄的交易明細（日期／組數／台幣／R 幣值都能改），或從這裡直接刪除 */
function saleSheet(id){
  const s=(state.sales||[]).find(x=>x.id===id); if(!s) return;
  sheet('編輯交易明細',`
    <div class="field"><label>日期</label><input name="date" type="date" value="${esc(s.date)}"></div>
    <div class="field"><label>組數</label><input name="sets" type="number" min="0" step="1" inputmode="numeric" value="${esc(String(s.sets))}"></div>
    <div class="field-2">
      <div class="field"><label>台幣（每組）</label><input name="twd" type="number" min="0" step="any" inputmode="decimal" value="${esc(String(s.twd))}"></div>
      <div class="field"><label>遊戲 R 幣值（1 台幣 = ? R）</label><input name="rate" type="number" min="0" step="any" inputmode="decimal" value="${esc(String(s.rate))}"></div>
    </div>
    <div class="sheet-foot">
      <button class="gbtn warn" data-s="del">刪除</button>
      <button class="gbtn" data-s="cancel">取消</button>
      <button class="gbtn accent" data-s="save">儲存</button>
    </div>`, sh=>{
    sh.querySelector('[data-s="save"]').onclick=()=>{
      const date=sh.querySelector('[name="date"]').value||s.date;
      const sets=Number(val(sh,'sets'))||0, twd=Number(val(sh,'twd'))||0, rate=Number(val(sh,'rate'))||0;
      if(sets<=0) return toast('請先填組數');
      if(twd<=0)  return toast('請先填每組台幣');
      commit(()=>{ Object.assign(s,{date,sets,twd,rate}); });
      closeSheet();
      toast('已更新交易明細');
    };
    sh.querySelector('[data-s="cancel"]').onclick=closeSheet;
    sh.querySelector('[data-s="del"]').onclick=()=>{
      confirmSheet('確定要刪除這筆交易紀錄嗎？',()=>{
        commit(()=>{ state.sales=(state.sales||[]).filter(x=>x.id!==id); });
        toast('已刪除交易紀錄');
      });
    };
  });
}

/* 材料總計 / 組數試算 / 售出計算 / 場次明細 子分頁 */
document.querySelectorAll('#matSeg [data-sub]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#matSeg [data-sub]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
  document.querySelectorAll('.subview').forEach(v=>v.classList.toggle('active',v.id==='sub-'+b.dataset.sub));
});


/* ══════════════════════════════════════════════════════════
   指派 / 移動
   ══════════════════════════════════════════════════════════ */
function assign(memberId, ptId){
  commit(()=>{
    const pt=ptsOf(curDate).find(p=>p.id===ptId); if(!pt) return;
    if(pt.slots.length>=pt.capacity){ toast(`${pt.name} 已滿`); return; }
    const m=memberById(memberId);
    pt.slots.push({memberId, roleId:m?.defaultRoleId||null});
  });
  picked=null;
}
/* 依「拖曳來源那一個 slot 的 index」移除，不是依 memberId —
   同一人可以在同一場 RUN 裡重複出現（雙開/多開），用 index 才不會一次把全部重複的都移掉 */
function unassign(ptId, si){
  commit(()=>{
    const pt=ptsOf(curDate).find(p=>p.id===ptId); if(!pt) return;
    const i=+si;
    if(Number.isInteger(i)&&pt.slots[i]!==undefined) pt.slots.splice(i,1);
  });
  picked=null;
}

/* ── 拖曳（滑鼠與觸控通用，用 pointer events） ─────────── */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const chip=e.target.closest('[data-chip]');
  if(!chip||e.target.closest('button[data-act]')) return;
  drag={id:chip.dataset.chip, from:chip.dataset.from, si:chip.dataset.si, x:e.clientX, y:e.clientY, el:chip, moved:false, ghost:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.moved){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)<7) return;
    /* 從 bench 橫向捲動列拿起的 chip：如果這一動主要是左右方向，
       判斷成使用者只是想橫向捲動找人，不是要拖曳指派 —— 放手讓瀏覽器原生橫向捲動接手，
       這樣成員一多、bench 要左右捲才能找到人時，捲動才不會被誤判成拖曳。 */
    if(drag.from==='bench' && Math.abs(dx)>Math.abs(dy)*1.2){ drag=null; return; }
    drag.moved=true; drag.el.classList.add('dragging');
    const m=memberById(drag.id);
    const g=document.createElement('div'); g.className='drag-ghost'; g.textContent=m?m.name:'';
    document.body.appendChild(g); drag.ghost=g;
  }
  drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
  document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
  const t=dropTargetAt(e.clientX,e.clientY);
  if(t) t.classList.add('drop-on');
});
document.addEventListener('pointerup',e=>{
  if(!drag) return;
  const d=drag; drag=null;
  document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
  d.el.classList.remove('dragging');
  if(d.ghost) d.ghost.remove();
  if(!d.moved){ tapChip(d.id); return; }
  const t=dropTargetAt(e.clientX,e.clientY);
  if(!t) return;
  if(t.dataset.drop==='bench'){ if(d.from!=='bench') unassign(d.from,d.si); }
  else if(t.dataset.pt!==d.from) assign(d.id,t.dataset.pt);
});
document.addEventListener('pointercancel',()=>{
  if(!drag) return;
  drag.el.classList.remove('dragging'); if(drag.ghost) drag.ghost.remove();
  document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
  drag=null;
});
/* 把某個 RUN 裡的 slot 從 fromIndex 移到「hoverIndex 那格的前面/後面」——供下面的全螢幕排序編輯器使用 */
function reorderSlot(ptId, fromIndex, hoverIndex, before){
  commit(()=>{
    const p=ptsOf(curDate).find(x=>x.id===ptId); if(!p) return;
    if(!Number.isInteger(fromIndex)||!p.slots[fromIndex]) return;
    let insertBefore=before?hoverIndex:hoverIndex+1;
    if(insertBefore>fromIndex) insertBefore--;
    const [s]=p.slots.splice(fromIndex,1);
    p.slots.splice(insertBefore,0,s);
  });
}

/* ══════════════════════════════════════════════════════════
   全螢幕排序編輯器 —— 陣容分配清單裡的把手太小不好按，
   改成獨立的全螢幕畫面，大按鈕、按住直接拖到任意位子；
   便當也只有在這裡才能切換，平時清單不會一排都寫著「便當」。
   ══════════════════════════════════════════════════════════ */
function orderSheet(ptId){
  sheet('編輯順序', `<div class="order-hint">按住左邊的把手拖曳排序；按「便當」可標記只領材料的人員。</div><div class="order-list" id="orderList"></div>`, s=>{
    s.classList.add('sheet-full');
    const t=s.querySelector('.sheet-t');
    t.style.cssText='display:flex; align-items:center; justify-content:space-between';
    t.insertAdjacentHTML('beforeend','<button class="gbtn accent" style="padding:7px 16px;font-size:13.5px;flex:0 0 auto" id="orderDoneBtn">完成</button>');
    t.querySelector('#orderDoneBtn').onclick=closeSheet;
    renderOrderList(ptId);
  });
}
function renderOrderList(ptId){
  const host=document.getElementById('orderList'); if(!host) return;
  const pt=ptsOf(curDate).find(x=>x.id===ptId);
  if(!pt||!pt.slots.length){ closeSheet(); return; }
  host.innerHTML=pt.slots.map((s,si)=>{
    const m=memberById(s.memberId); if(!m) return '';
    return `<div class="order-row ${s.bento?'bento':''}" data-si="${si}">
      <div class="order-grip" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.8"/><circle cx="15" cy="6" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18" r="1.8"/><circle cx="15" cy="18" r="1.8"/></svg></div>
      <span class="order-name">${esc(m.name)}</span>
      <button class="order-bento" data-oact="bento" data-i="${si}">便當</button>
    </div>`;
  }).join('');
  bindOrderDrag(ptId);
}
let orderDrag=null;
function bindOrderDrag(ptId){
  const host=document.getElementById('orderList'); if(!host) return;
  host.onclick=e=>{
    const b=e.target.closest('[data-oact="bento"]'); if(!b) return;
    const i=+b.dataset.i;
    commit(()=>{ const p=ptsOf(curDate).find(x=>x.id===ptId); if(p&&p.slots[i]) p.slots[i].bento=!p.slots[i].bento; });
    renderOrderList(ptId);
  };
  host.querySelectorAll('.order-grip').forEach(grip=>{
    grip.onpointerdown=e=>{
      e.preventDefault();
      const row=grip.closest('.order-row');
      orderDrag={ptId, fromSi:+row.dataset.si, row, hoverSi:null, before:false, startY:e.clientY};
      row.classList.add('dragging');
    };
  });
}
document.addEventListener('pointermove',e=>{
  if(!orderDrag) return;
  const host=document.getElementById('orderList'); if(!host){ orderDrag=null; return; }
  orderDrag.row.style.transform=`translateY(${e.clientY-orderDrag.startY}px)`;
  host.querySelectorAll('.order-row.drop-before,.order-row.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
  const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.order-row');
  if(el && el!==orderDrag.row && el.closest('#orderList')===host){
    const rect=el.getBoundingClientRect();
    const before=e.clientY<rect.top+rect.height/2;
    el.classList.add(before?'drop-before':'drop-after');
    orderDrag.hoverSi=+el.dataset.si; orderDrag.before=before;
  } else { orderDrag.hoverSi=null; }
});
document.addEventListener('pointerup',()=>{
  if(!orderDrag) return;
  const d=orderDrag; orderDrag=null;
  d.row.classList.remove('dragging');
  d.row.style.transform='';
  document.querySelectorAll('.order-row.drop-before,.order-row.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
  if(d.hoverSi!=null && d.hoverSi!==d.fromSi) reorderSlot(d.ptId, d.fromSi, d.hoverSi, d.before);
  renderOrderList(d.ptId);
});
document.addEventListener('pointercancel',()=>{
  if(!orderDrag) return;
  orderDrag.row.classList.remove('dragging');
  orderDrag.row.style.transform='';
  document.querySelectorAll('.order-row.drop-before,.order-row.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
  orderDrag=null;
});

function dropTargetAt(x,y){
  const el=document.elementFromPoint(x,y);
  return el?el.closest('[data-drop]'):null;
}
/* 點一下＝選取，再點隊伍卡片＝加入 */
function tapChip(id){
  if(picked===id){ picked=null; }
  else if(picked===null){ picked=id; toast('已選取 — 點一下 RUN 加入'); }
  else { picked=id; }
  renderBench();
}
document.addEventListener('click',e=>{
  if(!picked) return;
  if(e.target.closest('[data-chip]')) return; // 這個點擊已經由 pointerup 的 tapChip() 處理過，不要再重複指派
  const card=e.target.closest('[data-drop="pt"]');
  if(card&&!e.target.closest('button[data-act]')) assign(picked,card.dataset.pt);
});

/* iOS Safari 在 fixed 定位的彈窗裡點輸入框時，就算容器是 fixed，
   還是會把「背後的頁面」往上捲動去對齊鍵盤，導致打字的地方被捲到看不見。
   開彈窗時把 body 鎖成 fixed（等於背後頁面不能捲），Safari 就沒有頁面可以捲了。 */
function lockBodyScroll(){
  if(document.body.style.position==='fixed') return;
  const y=window.scrollY||window.pageYOffset||0;
  document.body.dataset.scrollY=y;
  document.body.style.position='fixed';
  document.body.style.top=(-y)+'px';
  document.body.style.left='0';
  document.body.style.right='0';
  document.body.style.width='100%';
  document.body.style.overflow='hidden';
  document.documentElement.style.overflow='hidden';
}
function unlockBodyScroll(){
  if(document.body.style.position!=='fixed') return;
  const y=parseInt(document.body.dataset.scrollY||'0',10);
  document.body.style.position='';
  document.body.style.top='';
  document.body.style.left='';
  document.body.style.right='';
  document.body.style.width='';
  document.body.style.overflow='';
  document.documentElement.style.overflow='';
  delete document.body.dataset.scrollY;
  window.scrollTo(0,y);
}
function sheet(title, bodyHtml, onMount){
  const host=document.getElementById('sheetHost');
  lockBodyScroll();
  host.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <div class="grip"></div><div class="sheet-t">${esc(title)}</div>${bodyHtml}</div></div>`;
  const scrim=host.querySelector('.scrim');
  scrim.addEventListener('click',ev=>{ if(ev.target===scrim) closeSheet(); });
  document.addEventListener('keydown',escClose);
  onMount&&onMount(host.querySelector('.sheet'));
  const f=host.querySelector('input,textarea,select'); if(f&&window.innerWidth>760) f.focus();
}
function closeSheet(){ document.getElementById('sheetHost').innerHTML=''; document.removeEventListener('keydown',escClose); unlockBodyScroll(); }
function escClose(e){ if(e.key==='Escape') closeSheet(); }
const val=(s,n)=>s.querySelector(`[name="${n}"]`).value.trim();

    <div class="sheet-foot">
      <button class="gbtn" data-s="no">取消</button>

    s.querySelector('[data-s="no"]').onclick=closeSheet;

/* BUFF 技能選擇器：依職業列出整條轉職鏈的支援技能，可複選，結果用「、」串起來
   current：目前的 BUFF 文字（沿用既有的自由輸入內容，不會被洗掉）
   roleName：職業名稱，用來自動對應到 RO 職業 */
function buffPickerSheet(current, roleName, onApply, onCancel){
  const CATS=['初心者','一轉','二轉','轉生二轉','三轉','四轉','擴充職業'];
  const picks=(current||'').split('、').map(x=>x.trim()).filter(Boolean);
  const selected=new Set(picks);
  const pickable=roPickableJobs();
  let jobId=roJobIdByName(roleName);
  if(!jobId||!RO_JOBS[jobId]){
    const sameCat=jobId&&RO_JOBS[jobId]?pickable.find(j=>RO_JOBS[j].c===RO_JOBS[jobId].c):null;
    jobId=sameCat||pickable[0]||Object.keys(RO_JOBS)[0];
  }

  /* 下拉選單列出「全部」職業（不只是有 BUFF 的），這樣自己的職業一定找得到、選得到，
     就算這條轉職線目前沒收錄支援技能，也會清楚顯示原因，而不是整個從清單消失 */
  const opts=CATS.map(c=>{
    const list=Object.keys(RO_JOBS).filter(jid=>RO_JOBS[jid].c===c);
    if(!list.length) return '';
    return `<optgroup label="${c}">`+list.map(jid=>
      `<option value="${jid}" ${jid===jobId?'selected':''}>${esc(RO_JOBS[jid].n)}</option>`).join('')+`</optgroup>`;
  }).join('');

  sheet('選擇技能 BUFF',`
    <div class="field"><label>職業（會一併列出這條轉職線的支援技能）</label>
      <select name="job">${opts}</select></div>
    <div id="skillHost"></div>
    <div class="buffprev" id="buffPrev"></div>
    <div class="sheet-foot">
      <button class="gbtn" data-s="clear">清除</button>
      <button class="gbtn" data-s="cancel">取消</button>
      <button class="gbtn accent" data-s="apply">套用</button>
    </div>`,s=>{
    const host=s.querySelector('#skillHost'), prev=s.querySelector('#buffPrev');

    function paintPrev(){
      const arr=[...selected];
      prev.innerHTML=arr.length
        ? `<b>已選 ${arr.length} 個：</b>${esc(arr.join('、'))}`
        : `<span class="none">還沒選任何技能 — 點下方技能加入</span>`;
    }
    function paintSkills(){
      const chain=roJobChain(s.querySelector('[name="job"]').value);
      const groups=chain.filter(c=>RO_JOBS[c].s.length).map(c=>
        `<div class="skillgrp">${esc(RO_JOBS[c].n)}</div>
         <div class="skillgrid">${RO_JOBS[c].s.map(sk=>
           `<button class="skillpill" data-sk="${esc(sk)}" aria-pressed="${selected.has(sk)}">${esc(sk)}</button>`).join('')}</div>`).join('');
      host.innerHTML=groups||`<div class="bench-empty">這個職業沒有收錄支援類技能</div>`;
      host.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{
        const sk=b.dataset.sk;
        if(selected.has(sk)) selected.delete(sk); else selected.add(sk);
        b.setAttribute('aria-pressed',selected.has(sk));
        paintPrev();
      });
    }
    s.querySelector('[name="job"]').onchange=paintSkills;
    paintSkills(); paintPrev();

    s.querySelector('[data-s="clear"]').onclick=()=>{
      selected.clear(); paintSkills(); paintPrev();
    };
    s.querySelector('[data-s="apply"]').onclick=()=>onApply([...selected].join('、'));
    s.querySelector('[data-s="cancel"]').onclick=()=>onCancel();
  });
}

/* 預先知道的材料清單（星座之塔目前的掉落物項目），一開始就會出現在自動建議裡，不用等打過一次才有 */
const KNOWN_MATERIALS=[
  '未知的隕石碎片','稀微魔力符文石',
  '威力隕石浮塵','耐力隕石浮塵','專注隕石浮塵','創造隕石浮塵','咒數隕石浮塵','智慧隕石浮塵',
  '威力隕石碎片','耐力隕石碎片','專注隕石碎片','創造隕石碎片','咒數隕石碎片','智慧隕石碎片',
];
/* 這個 App 目前用過的所有材料名稱（預設清單 + 跨全部日期、全部 RUN 實際打過的），給輸入自動建議用 */
function allMaterialNames(){
  const seen=new Set(KNOWN_MATERIALS), extra=new Set();
  Object.values(state.schedule).forEach(pts=>pts.forEach(pt=>(pt.drops||[]).forEach(d=>{
    if(!seen.has(d.name)) extra.add(d.name);
  })));
  /* 預設 14 種維持遊戲裡的屬性順序（威力→耐力→專注→創造→咒數→智慧），自訂材料排在後面 */
  return [...KNOWN_MATERIALS, ...[...extra].sort((a,b)=>a.localeCompare(b,'zh-Hant'))];
}

/* 掉落物批次編輯：一次調整整場 RUN 的所有材料數量（新增／修改／刪除都在這裡完成）。
   數量歸 0 就等於把那筆刪掉，不用一個一個開來刪。 */
function dropsSheet(ptId){
  const pt=ptsOf(curDate).find(p=>p.id===ptId); if(!pt) return;
  const work=new Map((pt.drops||[]).map(d=>[d.name,d.qty]));
  /* 預設 14 種常用材料 + 其他場次用過的自訂材料（自訂一次之後每場都選得到） */
  const names=allMaterialNames();
  (pt.drops||[]).forEach(d=>{ if(!names.includes(d.name)) names.push(d.name); });

  const rowHtml=n=>`<div class="droprow ${(work.get(n)||0)>0?'on':''}" data-row="${esc(n)}" style="${msVars(matSeries(n))}">
      <span class="droprow-n">${esc(n)}</span>
      <div class="stepper">
        <button class="stepbtn" data-step="-1" data-m="${esc(n)}" ${(work.get(n)||0)<=0?'disabled':''}>−</button>
        <input class="stepqty" type="number" min="0" data-qty="${esc(n)}" value="${work.get(n)||0}">
        <button class="stepbtn plus" data-step="1" data-m="${esc(n)}">＋</button>
      </div>
    </div>`;

  /* 依系列分段列出（碎片／浮塵／其餘），一長串材料比較好找 */
  const groupsHtml=()=>groupBySeries(names).map(({s,names:ns})=>
    `<div class="dropgrp" style="${msVars(s)}">${s.label}</div>`+ns.map(rowHtml).join('')).join('');

  sheet(`${pt.name} 的掉落物`,`
    <div id="dropRows">${groupsHtml()}</div>
    <div class="skillgrp">新增自訂材料</div>
    <div class="dropadd">
      <div class="field"><input name="newName" placeholder="清單裡沒有的材料名稱"></div>
      <button class="gbtn" data-s="addName" style="padding:10px 14px">新增</button>
    </div>
    <div class="dropsum" id="dropSum"></div>
    <div class="sheet-foot">
      <button class="gbtn warn" data-s="clear">全部清空</button>
      <button class="gbtn" data-s="cancel">取消</button>
      <button class="gbtn accent" data-s="save">儲存</button>
    </div>`,s=>{
    const host=s.querySelector('#dropRows'), sum=s.querySelector('#dropSum');

    function paintSum(){
      const picked=[...work.entries()].filter(([,q])=>q>0);
      const total=picked.reduce((a,[,q])=>a+q,0);
      sum.innerHTML=picked.length
        ? `<b>${picked.length} 種 · 共 ${total} 個</b><br>${esc(picked.map(([n,q])=>`${n}×${q}`).join('、'))}`
        : `<span class="none">還沒記錄任何材料</span>`;
    }
    function paintRow(n){
      const row=host.querySelector(`[data-row="${CSS.escape(n)}"]`); if(!row) return;
      const q=work.get(n)||0;
      row.classList.toggle('on',q>0);
      row.querySelector('[data-qty]').value=q;
      row.querySelector('[data-step="-1"]').disabled=q<=0;
    }
    function bindRow(row){
      const n=row.dataset.row;
      row.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{
        const q=Math.max(0,(work.get(n)||0)+(+b.dataset.step));
        work.set(n,q); paintRow(n); paintSum();
      });
      row.querySelector('[data-qty]').oninput=e=>{
        work.set(n,Math.max(0,parseInt(e.target.value)||0));
        row.classList.toggle('on',(work.get(n)||0)>0);
        row.querySelector('[data-step="-1"]').disabled=(work.get(n)||0)<=0;
        paintSum();
      };
    }
    host.querySelectorAll('.droprow').forEach(bindRow);
    paintSum();

    s.querySelector('[data-s="addName"]').onclick=()=>{
      const nm=val(s,'newName').trim(); if(!nm) return toast('請輸入材料名稱');
      const dup=names.includes(nm);
      if(dup) toast('清單裡已經有這個材料了'); else names.push(nm);
      work.set(nm,Math.max(1,work.get(nm)||0));
      /* 新材料要落到它該去的系列分段裡，所以整份重畫再重綁 */
      if(!dup){ host.innerHTML=groupsHtml(); host.querySelectorAll('.droprow').forEach(bindRow); }
      paintRow(nm); paintSum();
      s.querySelector('[name="newName"]').value='';
      const added=host.querySelector(`[data-row="${CSS.escape(nm)}"]`);
      if(added) added.scrollIntoView({block:'nearest'});
    };
    s.querySelector('[data-s="clear"]').onclick=()=>{
      names.forEach(n=>{ work.set(n,0); paintRow(n); });
      paintSum();
    };
    s.querySelector('[data-s="save"]').onclick=()=>{
      commit(()=>{
        const p=ptsOf(curDate).find(x=>x.id===ptId); if(!p) return;
        const old=new Map((p.drops||[]).map(d=>[d.name,d]));
        p.drops=names.filter(n=>(work.get(n)||0)>0).map(n=>{
          const ex=old.get(n);
          return ex?{...ex,qty:work.get(n)}:{id:uid(),name:n,qty:work.get(n)};
        });
      });
      closeSheet();
    };
    s.querySelector('[data-s="cancel"]').onclick=closeSheet;
  });
}

function rolePickSheet(ptId,i){

  const slot=pt.slots[i], m=memberById(slot.memberId);

    <div class="rolegrid">${sortedRoles().map(r=>

      <button class="gbtn" data-s="clear">清除職業</button>
      <button class="gbtn" data-s="cancel">取消</button>
    </div>`,s=>{
    s.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
      commit(()=>{ pt.slots[i].roleId=b.dataset.r; }); closeSheet();
    });
    s.querySelector('[data-s="clear"]').onclick=()=>{ commit(()=>{ pt.slots[i].roleId=null; }); closeSheet(); };

function dateSheet(){
  const allDates=dates();
  const prev=allDates.filter(k=>k<curDate).pop()||allDates[allDates.length-1];
  /* 今天還沒建立的話，預設就填今天（最常見的情境）；否則填目前這天的隔天 */
  const def=state.schedule[todayKey()]?shiftDate(curDate,1):todayKey();
  const dateOpts=allDates.slice().reverse().map(k=>
    `<option value="${k}" ${k===prev?'selected':''}>${fmtDate(k)} ${fmtDow(k)}（${ptsOf(k).length} RUN）</option>`).join('');
  sheet('新增日期',`
    <div class="field"><label>日期</label><input name="d" type="date" value="${def}"></div>
    ${allDates.length?`
    <label class="toggle"><input type="checkbox" name="copy" checked> 複製指定日期的所有 RUN 與職業配置</label>
    <div class="field" id="copyFromField"><label>從哪一天複製</label><select name="copyFrom">${dateOpts}</select></div>`:''}
    <div class="sheet-foot">
      <button class="gbtn" data-s="cancel">取消</button>
      <button class="gbtn accent" data-s="save">建立</button>
    </div>`,s=>{
    const copyChk=s.querySelector('[name="copy"]'), copyField=s.querySelector('#copyFromField');
    const syncCopyVisibility=()=>{ if(copyField) copyField.style.display=(copyChk&&copyChk.checked)?'':'none'; };
    if(copyChk) copyChk.onchange=syncCopyVisibility;
    syncCopyVisibility();
    s.querySelector('[data-s="save"]').onclick=()=>{
      const k=s.querySelector('[name="d"]').value; if(!k) return toast('請選擇日期');
      if(state.schedule[k]){ curDate=k; closeSheet(); render(); return toast('這天已經有排班了'); }
      const copy=copyChk?.checked;
      const from=s.querySelector('[name="copyFrom"]')?.value;
      commit(()=>{
        state.schedule[k]= (copy&&from&&state.schedule[from])
          ? JSON.parse(JSON.stringify(ptsOf(from))).map(p=>({...p,id:uid(),drops:[]}))
          : [mkPt('RUN 1','20:00',12)];
      });
      curDate=k; closeSheet(); render();
    };
    s.querySelector('[data-s="cancel"]').onclick=closeSheet;
  });
}

/* 修改目前這天的日期：把 state.schedule 底下的 RUN／排班資料整包搬到新的日期鍵上，內容不會不見 */
function editDateSheet(){
  const from=curDate;
  sheet('修改日期',`
    <div class="field"><label>把 ${fmtDate(from)}（${fmtDow(from)}）改成</label>
      <input name="d" type="date" value="${from}"></div>
    <div class="sheet-foot">
      <button class="gbtn" data-s="cancel">取消</button>
      <button class="gbtn accent" data-s="save">儲存</button>
    </div>`,s=>{
    s.querySelector('[data-s="save"]').onclick=()=>{
      const to=s.querySelector('[name="d"]').value; if(!to) return toast('請選擇日期');
      if(to===from){ closeSheet(); return; }
      if(state.schedule[to]){ return toast(`${fmtDate(to)} 已經有排班了，不能覆蓋`); }
      commit(()=>{
        state.schedule[to]=state.schedule[from];
        delete state.schedule[from];
      });
      curDate=to; closeSheet(); render();
      toast(`已改成 ${fmtDate(to)}`);
    };
    s.querySelector('[data-s="cancel"]').onclick=closeSheet;
  });
}

function moreSheet(){
  sheet('更多',`
    <div class="field"><label>職業篩選（只看某個預設職業的待分配成員）</label>
      <select name="rf"><option value="">全部</option>${sortedRoles().map(r=>
        `<option value="${r.id}" ${roleFilter===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>
    <div class="sheet-foot" style="flex-wrap:wrap">

    </div>
    <div class="sheet-foot" style="flex-wrap:wrap">

      <button class="gbtn" data-s="importJson">匯入設定 JSON</button>
    </div>
    <div style="text-align:center;color:var(--faint);font-size:11px;margin-top:14px">
      作者：${esc(APP_AUTHOR)} · 版本 ${esc(APP_VERSION)}
    </div>
    <input type="file" name="jsonFile" accept="application/json,.json" style="display:none">`,s=>{
    s.querySelector('[name="rf"]').onchange=e=>{ roleFilter=e.target.value||null; renderBench(); };
    s.querySelector('[data-s="img"]').onclick=()=>{ closeSheet(); exportRangeSheet('img'); };
    s.querySelector('[data-s="csv"]').onclick=()=>{ closeSheet(); exportRangeSheet('csv'); };

        if(!data||!Array.isArray(data.members)||!Array.isArray(data.roles)||typeof data.schedule!=='object'){
          toast('檔案格式不正確'); return;
        }
        closeSheet();
        confirmSheet('匯入將覆蓋目前所有成員、職業與排班資料。\n按下確定後會先自動下載一份目前資料的備份，再進行匯入。',()=>{
          /* 匯入是整包覆蓋且重新整理後就無法用復原救回，所以先把現況存成備份檔再蓋 */
          backupJson();
          curDate=null;
          commit(()=>{ state=migrate(data); });
          toast('已匯入設定（原資料已備份下載）');
        },'備份並匯入');
      };
      reader.readAsText(file);
    };
  });
}

/* 匯出範圍選擇：圖片與 CSV 共用。預設是「只有目前這天」，維持原本一鍵匯出的習慣；
   要多天再切到「日期區間」，快捷鍵沿用材料統計那邊的本週／本月語彙。 */
function exportRangeSheet(kind){
  const isImg=kind==='img';
  const t=todayKey(), d=parseYmd(t), dow=(d.getDay()+6)%7;
  const weekFrom=shiftDate(t,-dow), weekTo=shiftDate(t,6-dow);
  const monthFrom=t.slice(0,8)+'01';
  const monthTo=shiftDate(monthFrom,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-1);
  const all=dates();
  sheet(isImg?'產出圖片':'匯出 CSV',`
    <label class="toggle"><input type="radio" name="mode" value="cur" checked> 只匯出目前這天（${fmtDate(curDate)} ${fmtDow(curDate)}）</label>
    <label class="toggle"><input type="radio" name="mode" value="range"> 匯出日期區間</label>
    <div id="expRange" style="display:none">
      <div class="preset-row">
        <button class="gbtn" data-p="week">本週</button>
        <button class="gbtn" data-p="month">本月</button>
        <button class="gbtn" data-p="all">全部</button>
      </div>
      <div class="field-2">
        <div class="field"><label>從</label><input name="from" type="date" value="${all[0]||t}"></div>
        <div class="field"><label>到</label><input name="to" type="date" value="${all[all.length-1]||t}"></div>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin:-4px 0 4px" id="expCount"></div>
    </div>
    <div class="sheet-foot">
      <button class="gbtn" data-s="cancel">取消</button>
      <button class="gbtn accent" data-s="go">${isImg?'產出':'匯出'}</button>
    </div>`, s=>{
    const box=s.querySelector('#expRange'), cnt=s.querySelector('#expCount');
    const fromEl=s.querySelector('[name="from"]'), toEl=s.querySelector('[name="to"]');
    const isRange=()=>s.querySelector('[name="mode"]:checked').value==='range';
    const picked=()=>isRange()?exportDates(fromEl.value,toEl.value):[curDate];
    const sync=()=>{
      box.style.display=isRange()?'':'none';
      if(isRange()){
        const ks=picked();
        cnt.textContent=ks.length?`這個區間有 ${ks.length} 天有排班資料`:'這個區間沒有任何排班資料';
      }
    };
    s.querySelectorAll('[name="mode"]').forEach(r=>r.onchange=sync);
    fromEl.onchange=sync; toEl.onchange=sync;
    s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
      const p=b.dataset.p;
      if(p==='week'){ fromEl.value=weekFrom; toEl.value=weekTo; }
      else if(p==='month'){ fromEl.value=monthFrom; toEl.value=monthTo; }
      else { fromEl.value=all[0]||t; toEl.value=all[all.length-1]||t; }
      sync();
    });
    sync();
    s.querySelector('[data-s="cancel"]').onclick=closeSheet;
    s.querySelector('[data-s="go"]').onclick=()=>{
      const ks=picked();
      if(!ks.length) return toast('這個區間沒有任何排班資料');
      closeSheet();
      isImg?exportImage(ks):exportCsv(ks);
    };
  });
}

function exportJson(){
  const json=JSON.stringify(state,null,2);
  download(new Blob([json],{type:'application/json'}),`星座塔團隊_設定_${APP_VERSION}_${todayKey()}.json`);
  toast('已匯出設定 JSON');
}

/* 匯入前的自動備份：檔名帶到「時分秒」，才不會跟當天手動匯出的檔案同名互相蓋掉 */
function backupJson(){
  const stamp=fmtNow().replace(/[/:]/g,'').replace(' ','_');
  download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),
    `星座塔團隊_匯入前備份_${stamp}.json`);
}

/* ══════════════════════════════════════════════════════════
   匯出
   圖片：不截取畫面，改用資料重建一份乾淨的 DOM 再轉圖，
   避免 html2canvas 對 <button> 與 CSS 動畫的已知問題。
   ══════════════════════════════════════════════════════════ */
/* 匯出圖片的掉落物區塊：以前是「掉落：A×3、B×5、…」一長行，材料一多就爆版看不完。
   改成依系列分段（碎片紅／浮塵藍／其餘綠），每段一列標籤 + 可換行的材料標籤。
   材料一律列出完整名稱（威力隕石碎片×3），不縮寫、不省略。 */
function exDrops(pt){
  if(!pt.drops||!pt.drops.length) return '';
  const names=pt.drops.map(d=>d.name);
  const qty=n=>pt.drops.filter(d=>d.name===n).reduce((a,d)=>a+d.qty,0);
  const total=pt.drops.reduce((a,d)=>a+d.qty,0);
  const segs=groupBySeries([...new Set(names)]).map(({s,names:ns})=>
    `<div class="ex-dgrp">
      <span class="ex-dlb" style="background:${s.color}">${s.label}</span>
      <div class="ex-dp">${ns.map(n=>
        `<span class="ex-dpill" style="color:${s.ink};border-color:${s.line};background:${s.soft}">${esc(n)}<b>×${qty(n)}</b></span>`
      ).join('')}</div>
    </div>`).join('');
  return `<div class="ex-drops">
    <div class="ex-dtop">掉落物 · ${new Set(names).size} 種 · 共 ${total} 個</div>${segs}</div>`;
}

/* 匯出範圍：預設就是目前這天；選了區間才會是多天。
   回傳的是「這個範圍內真的有排班的日期」，空日期不會產生空白區塊。 */
function exportDates(from,to){
  if(!from&&!to) return [curDate];
  return dates().filter(k=>(!from||k>=from)&&(!to||k<=to));
}
function rangeLabel(ks){
  if(ks.length===1) return `${fmtDate(ks[0])}（${fmtDow(ks[0]).slice(1)}）`;
  return `${fmtDate(ks[0])} – ${fmtDate(ks[ks.length-1])}`;
}
function fileStamp(ks){
  return ks.length===1 ? fmtDate(ks[0]).replace('/','')
                       : `${fmtDate(ks[0]).replace('/','')}-${fmtDate(ks[ks.length-1]).replace('/','')}`;
}

function ptExportBlock(pt){
  const rows=pt.slots.length ? pt.slots.map(s=>{
    const m=memberById(s.memberId), r=roleById(s.roleId);
    if(!m) return '';
    return `<div class="ex-row ${s.bento?'bento':''}"><span class="ex-nm">${esc(m.name)}${s.bento?'<span class="ex-buff" style="color:#16a34a">便當</span>':''}${r&&r.buff?`<span class="ex-buff">${esc(r.buff)}</span>`:''}</span>`+
      (r?`<span class="ex-rl" style="color:${r.color};border-color:${hexA(r.color,.45)};background:${hexA(r.color,.1)}">${esc(r.name)}</span>`
         :`<span class="ex-rl" style="color:#a8aec0;border-color:#e6e8ef">未指定</span>`)+`</div>`;
  }).join('') : `<div class="ex-row"><span class="ex-nm" style="color:#a8aec0">（無人）</span></div>`;
  return `<div class="ex-pt">
    <div class="ex-pt-h"><span class="ex-pt-n">${esc(pt.name)}</span>
      <span class="ex-pt-t">${esc(pt.time||'')}</span>
      <span class="ex-pt-c">${pt.slots.length}/${pt.capacity}</span></div>
    ${rows}
    ${exDrops(pt)}
    </div>`;
}

function buildExportNode(ks){
  ks=ks&&ks.length?ks:[curDate];
  const totalPts=ks.reduce((a,k)=>a+ptsOf(k).length,0);
  const totalSlots=ks.reduce((a,k)=>a+ptsOf(k).reduce((b,p)=>b+p.slots.length,0),0);
  /* 多天時每天各自一個標題段落，單天則維持原本沒有日期小標的乾淨版面 */
  const body=ks.map(k=>{
    const pts=ptsOf(k);
    const cols=pts.map(ptExportBlock).join('');
    const dayHead=ks.length>1
      ? `<div class="ex-day">${fmtDate(k)}（${DOW[parseYmd(k).getDay()]}） · ${pts.length} RUN · ${pts.reduce((a,p)=>a+p.slots.length,0)} 人</div>`
      : '';
    return dayHead+`<div class="ex-cols">${cols||'<div class="ex-sub">這天還沒有 RUN</div>'}</div>`;
  }).join('');
  const host=document.getElementById('exportHost');
  host.innerHTML=`<div class="exportwrap" id="exportWrap">
    <div class="ex-h">${rangeLabel(ks)} 陣容分配</div>
    <div class="ex-sub">${ks.length>1?`${ks.length} 天 · `:''}${totalPts} RUN · 出席 ${totalSlots} 人 · 產出於 ${fmtNow()}</div>
    ${body}
  </div>`;
  return document.getElementById('exportWrap');
}

async function exportImage(ks){
  ks=ks&&ks.length?ks:[curDate];
  if(typeof html2canvas==='undefined') return toast('圖片功能需要連線載入元件，請連上網路再試');
  toast('產出中⋯');
  const node=buildExportNode(ks);
  try{
    const canvas=await html2canvas(node,{backgroundColor:'#ffffff',scale:2,useCORS:true});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const file=new File([blob],`陣容分配_${fileStamp(ks)}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'陣容分配'}); }
      catch(err){ if(err.name!=='AbortError') download(blob,file.name); }
    } else download(blob,file.name);
  }catch(err){ console.error(err); toast('圖片產出失敗，請再試一次'); }
  finally{ document.getElementById('exportHost').innerHTML=''; }
}

function exportCsv(ks){
  ks=ks&&ks.length?ks:[curDate];
  const rows=[['日期','星期','RUN','時間','成員','職業','BUFF','便當','掉落物']];
  ks.forEach(k=>{
    ptsOf(k).forEach(pt=>{
      pt.slots.forEach(s=>{
        const m=memberById(s.memberId), r=roleById(s.roleId);
        if(m) rows.push([fmtDate(k),fmtDow(k),pt.name,pt.time||'',m.name,r?r.name:'',r&&r.buff||'',s.bento?'是':'','']);
      });
      if(pt.drops&&pt.drops.length){
        rows.push([fmtDate(k),fmtDow(k),pt.name,pt.time||'','','','','',
          pt.drops.map(d=>`${d.name}×${d.qty}`).join('、')]);
      }
    });
  });
  if(rows.length===1) return toast(ks.length>1?'這個範圍還沒有排班資料':'這天還沒有排班資料');
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),`陣容分配_${fileStamp(ks)}.csv`);
  toast(`已匯出 CSV（${ks.length} 天）`);
}
function download(blob,name){
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ══════════════════════════════════════════════════════════
   事件綁定
   ══════════════════════════════════════════════════════════ */
document.addEventListener('click',e=>{
  const chip=e.target.closest('[data-date]');
  if(chip){ curDate=chip.dataset.date; picked=null; render(); return; }
  const t=e.target.closest('.tab');
  if(t){
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+t.dataset.view));
    const onBoard=t.dataset.view==='board';
    document.getElementById('bench').classList.toggle('hidden',!onBoard);
    /* 切到材料統計時，如果期間有改過排班就補算一次（平常不算，見 renderMaterialsIfVisible） */
    if(matDirty) renderMaterialsIfVisible();
    return;
  }
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const a=btn.dataset.act, id=btn.dataset.id, ptId=btn.dataset.pt, i=+btn.dataset.i;
  if(a==='role')      rolePickSheet(ptId,i);
  if(a==='unassign')  commit(()=>{ const p=ptsOf(curDate).find(x=>x.id===ptId); p.slots.splice(i,1); });
  if(a==='toggleBento') commit(()=>{ const p=ptsOf(curDate).find(x=>x.id===ptId); const s=p.slots[i]; s.bento=!s.bento; });
  if(a==='orderPt')   orderSheet(ptId);
  if(a==='addDrop')   dropsSheet(ptId);
  if(a==='editDrop')  dropsSheet(ptId);
  if(a==='delSale')   confirmSheet('確定要刪除這筆交易紀錄嗎？',()=>{
    commit(()=>{ state.sales=(state.sales||[]).filter(s=>s.id!==id); });
    toast('已刪除交易紀錄');
  });
  if(a==='editSale')  saleSheet(id);
  if(a==='editPt')    ptSheet(ptId);
  if(a==='dupPt'){
    commit(()=>{ const p=ptsOf(curDate).find(x=>x.id===ptId);
      state.schedule[curDate].push({...JSON.parse(JSON.stringify(p)),id:uid(),name:p.name+' 複本',slots:[],drops:[]}); });
  }
  if(a==='delPt'){
    const p=ptsOf(curDate).find(x=>x.id===ptId);
    confirmSheet(`刪除「${p.name}」？`, ()=>{
      commit(()=>{ state.schedule[curDate]=ptsOf(curDate).filter(x=>x.id!==ptId); });
    });
  }
  if(a==='editMember') memberSheet(id);
  if(a==='editRole')   roleSheet(id);
  if(a==='addRole')    roleSheet(null);
  if(a==='addExpansionRole') expansionRoleSheet();
  if(a==='toggleRoleSel'){
    if(roleSelected.has(id)) roleSelected.delete(id); else roleSelected.add(id);
    renderRoles();
  }
  if(a==='roleUp'||a==='roleDown'){
    commit(()=>{
      const rs=sortedRoles(), i2=rs.findIndex(r=>r.id===id), j=a==='roleUp'?i2-1:i2+1;
      if(j<0||j>=rs.length) return;
      [rs[i2].order,rs[j].order]=[rs[j].order,rs[i2].order];
    });
  }
});

document.getElementById('btnMore').onclick=moreSheet;
document.getElementById('btnAddDate').onclick=dateSheet;
document.getElementById('btnEditDate').onclick=editDateSheet;
document.getElementById('btnToday').onclick=()=>{
  const tk=todayKey();
  if(!state.schedule[tk]) return toast('今天還沒有建立排班，可以點「＋ 新增日期」建立');
  curDate=tk; picked=null; render();
};
document.getElementById('btnDelDate').onclick=()=>{
  if(dates().length<=1) return toast('至少要保留一天');
  const target=curDate;
  const pts=ptsOf(target);
  const slotCount=pts.reduce((a,p)=>a+p.slots.length,0);
  const dropCount=pts.reduce((a,p)=>a+((p.drops&&p.drops.length)||0),0);
  confirmSheet(
    `刪除 ${fmtDate(target)}（${fmtDow(target)}）這天的所有資料？\n`+
    `含 ${pts.length} 個 RUN、${slotCount} 個排班位子${dropCount?`、${dropCount} 筆掉落紀錄`:''}。\n`+
    `刪除後材料統計也會少掉這天的數據。`,
    ()=>{
      commit(()=>{ delete state.schedule[target]; });
      curDate=null; render();
      toast(`已刪除 ${fmtDate(target)}`);
    });
};
document.getElementById('btnAddPt').onclick=()=>ptSheet(null);
document.getElementById('btnAddMember').onclick=()=>memberSheet(null);
document.getElementById('memberSearch').oninput=renderMembers;
document.getElementById('btnPrevDate').onclick=()=>{ const ks=dates(),i=ks.indexOf(curDate); if(i>0){curDate=ks[i-1];render();} };
document.getElementById('btnNextDate').onclick=()=>{ const ks=dates(),i=ks.indexOf(curDate); if(i<ks.length-1){curDate=ks[i+1];render();} };

document.getElementById('btnClearDay').onclick=()=>{
  if(!assignedIds(curDate).size) return toast('本日還沒有排班');
  confirmSheet(`清空 ${fmtDate(curDate)} 所有 RUN 的成員？RUN 本身會保留。`, ()=>{
    commit(()=>{ ptsOf(curDate).forEach(p=>p.slots=[]); });
  });
};

/* iOS Safari（尤其 standalone PWA）鍵盤彈出時不會縮小 fixed 元素所依據的 layout viewport，
   改用 visualViewport 動態量測可視高度／位移，寫進 --vvh／--vvtop，讓 sheet／scrim 貼齊實際看得到的範圍，
   避免鍵盤蓋住輸入欄或畫面被鍵盤頂到跑版。 */
function syncVVH(){
  const vv=window.visualViewport;
  const h=(vv&&vv.height)||window.innerHeight;
  const top=(vv&&vv.offsetTop)||0;
  document.documentElement.style.setProperty('--vvh',h+'px');
  document.documentElement.style.setProperty('--vvtop',top+'px');
}
syncVVH();
let focusedField=null;
document.addEventListener('focusin',e=>{
  if(e.target.matches('input,textarea,select')) focusedField=e.target;
});
document.addEventListener('focusout',e=>{
  if(e.target===focusedField) focusedField=null;
});
/* 只在 visualViewport 真的因鍵盤而變化「之後」才校正一次位置，
   不用猜時間的 setTimeout（會跟 iOS 原生的捲動打架，越修越跑版）。 */
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    syncVVH();
    if(focusedField&&document.activeElement===focusedField){
      focusedField.scrollIntoView({block:'nearest'});
    }
  });
  window.visualViewport.addEventListener('scroll',syncVVH);
}else{
  window.addEventListener('resize',syncVVH);
}


/* PWA：manifest 為 head 內的靜態檔（./manifest.webmanifest），離線快取由 ./sw.js 處理 */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ══════════════════════════════════════════════════════════
   PT 計算（屬性星數 → 總 PT 等級）
   ══════════════════════════════════════════════════════════ */
const ATTRS=[
  {id:'hp',      label:'體力', en:'HP',       color:'#0f9d76', pts:[0,15,30,45,60,75]},
  {id:'attack',  label:'攻擊', en:'Attack',   color:'#dc2626', pts:[0,20,40,60,80,100]},
  {id:'recovery',label:'恢復', en:'Recovery', color:'#65a30d', pts:[0,30,60,90,120,150]},
  {id:'defense', label:'防禦', en:'Defense',  color:'#ca8a04', pts:[0,50,100,150,200,250]},
  {id:'trap',    label:'陷阱', en:'Trap',     color:'#9333ea', pts:[0,85,170,255,340,425]},
];
const MAX_PT=1000;
const PT_TIERS=[
  {pt:0,   label:'50 層挑戰範圍'},
  {pt:600, label:'75 層挑戰範圍'},
];
const stars={hp:0,attack:0,recovery:0,defense:0,trap:0};
const tierOf=t=>PT_TIERS.reduce((c,x)=>t>=x.pt?x:c,PT_TIERS[0]);

function renderCalc(){
  document.getElementById('attrCards').innerHTML=ATTRS.map((a,i)=>{
    const n=stars[a.id];
    return `<div class="attrcard" style="--ac:${a.color};--ac-soft:${hexA(a.color,.1)};--ac-line:${hexA(a.color,.28)};animation-delay:${i*40}ms">
      <div class="attr-top">
        <span class="attr-nm">${a.label}</span><span class="attr-en">${a.en}</span>
        <span class="attr-pt num">${a.pts[n]} pt</span>
      </div>
      <div class="stars">
        ${[1,2,3,4,5].map(v=>`<button class="star ${v<=n?'on':''}" data-attr="${a.id}" data-v="${v}" aria-label="${a.label} ${v} 顆星">★</button>`).join('')}
        <span class="star-lb">${n?n+' 顆星':'封印'}</span>
      </div>
    </div>`;
  }).join('');

  const total=ATTRS.reduce((s,a)=>s+a.pts[stars[a.id]],0);
  const tier=tierOf(total), hi=tier.pt>=600;
  document.getElementById('calcTotal').innerHTML=`${total}<small>pt</small>`;
  document.getElementById('calcMeter').innerHTML=
    Array.from({length:10},(_,i)=>`<div class="pip ${total/MAX_PT*10>i?(hi?'full':'on'):''}"></div>`).join('');
  document.getElementById('calcTier').className='tier'+(hi?' hi':'');
  document.getElementById('calcTierText').textContent=tier.label;
  document.getElementById('calcBreak').innerHTML=ATTRS.map(a=>{
    const n=stars[a.id];
    return `<div class="bd-row" style="--ac:${a.color}">
      <span class="bd-nm">${a.label}</span>
      <span class="bd-st">${n?'★'.repeat(n):'封印中'}</span>
      <span class="bd-pt num">${a.pts[n]} pt</span></div>`;
  }).join('');
}

document.addEventListener('click',e=>{
  const st=e.target.closest('.star');
  if(st){
    const id=st.dataset.attr, v=+st.dataset.v;
    stars[id]= stars[id]===v ? v-1 : v;   // 再點同一顆＝取消該顆
    renderCalc(); return;
  }
  const ps=e.target.closest('[data-preset]');
  if(ps){
    ps.dataset.preset.split(',').forEach((v,i)=>stars[ATTRS[i].id]=+v);
    renderCalc();
  }
});
renderCalc();

render();
</script>
