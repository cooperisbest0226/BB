<!DOCTYPE html>
<!-- 星座塔團隊 · 作者：BB -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>
/* 一定要在 CSS 套用前就決定好深色/淺色，不然畫面會先閃一下淺色再變深色。
   直接讀 localStorage 裡的設定，不等主程式載入完。 */
try{
  const raw=localStorage.getItem('pt-manager-v1');
  const parsed=raw&&JSON.parse(raw);
  const saved=parsed&&parsed.settings&&parsed.settings.theme;
  const dark=saved==='dark'||(saved!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  if(dark) document.documentElement.dataset.theme='dark';
}catch(e){}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f7">
<title>星座塔團隊</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="星座塔團隊">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- 波利圖示：定義一次，人數格子用 <use> 重複引用，不用每格都塞一份完整 SVG。
     身體用 currentColor，所以「未填 / 已填 / 額滿」三種狀態只要換 CSS 的 color 就好。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ic-poring" viewBox="0 0 24 24">
    <path d="M12 2.9C6 2.9 2.1 8.8 2.1 14.1c0 4.2 4.1 6.8 9.9 6.8s9.9-2.6 9.9-6.8C21.9 8.8 18 2.9 12 2.9Z" fill="currentColor"/>
    <ellipse cx="8.6" cy="13.3" rx="2" ry="2.5" fill="#15171c" opacity=".82"/>
    <ellipse cx="15.4" cy="13.3" rx="2" ry="2.5" fill="#15171c" opacity=".82"/>
    <circle cx="7.85" cy="12.2" r=".62" fill="#fff"/>
    <circle cx="14.65" cy="12.2" r=".62" fill="#fff"/>
    <ellipse cx="7.7" cy="7.5" rx="1.9" ry="1.1" fill="#fff" opacity=".5" transform="rotate(-24 7.7 7.5)"/>
  </symbol>
</svg>

<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark">星座塔團隊</span>
        <span class="brand-sub" id="brandSub"></span>
      </div>
      <button class="icon-btn" id="btnMore" title="設定" aria-label="設定">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.5H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.5a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V8.5a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
    </div>
    <!-- 待分配成員：從畫面底部移上來，緊接在標題列下方；只有「陣容分配」分頁會顯示 -->
    <div class="bench" id="bench" data-drop="bench">
      <div class="bench-top">
        <span class="bench-t" id="benchTitle">待分配</span>
        <div class="sec-line"></div>
        <button class="gbtn" id="btnClearDay">清空本日</button>
      </div>
      <div class="bench-list" id="benchList"></div>
    </div>
  </div>

  <!-- 排班 -->
  <section class="view active" id="view-board">
    <div class="daterail">
      <div class="dates" id="dateRail"></div>
    </div>
    <div class="date-actions">
      <button class="icon-btn sm" id="btnPrevDate" aria-label="前一天">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="icon-btn sm" id="btnNextDate" aria-label="後一天">
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="gbtn" id="btnToday">今天</button>
      <span class="date-actions-gap"></span>
      <button class="gbtn" id="btnAddDate">＋ 新增</button>
      <button class="gbtn" id="btnEditDate">修改</button>
      <button class="gbtn warn" id="btnDelDate">刪除</button>
    </div>
    <div class="sec"><span class="sec-t" id="boardLabel">RUN</span><div class="sec-line"></div>
      <button class="gbtn" id="btnAddPt">＋ 新增 RUN</button>
    </div>
    <div class="ptgrid" id="ptGrid"></div>
  </section>


  <!-- PT 計算 -->
  <section class="view" id="view-calc">
    <div class="sec"><span class="sec-t">屬性配置</span><div class="sec-line"></div></div>
    <div id="attrCards"></div>

    <div class="sec"><span class="sec-t">合計</span><div class="sec-line"></div></div>
    <div class="totalcard">
      <div class="total-k">總 PT 等級</div>
      <div class="total-v num" id="calcTotal">0<small>pt</small></div>
      <div class="total-meter" id="calcMeter"></div>
      <span class="tier" id="calcTier"><span class="tier-dot"></span><span id="calcTierText">50 層挑戰範圍</span></span>
      <div class="presets">
        <button class="gbtn" data-preset="0,0,0,0,0">重置</button>
        <button class="gbtn" data-preset="0,5,5,3,5">825PT</button>
        <button class="gbtn" data-preset="0,5,5,5,5">925PT</button>
        <button class="gbtn" data-preset="3,5,5,5,5">970PT</button>
        <button class="gbtn" data-preset="5,5,5,5,5">1000PT</button>
      </div>
    </div>

    <div class="sec"><span class="sec-t">屬性明細</span><div class="sec-line"></div></div>
    <div class="bd" id="calcBreak"></div>
  </section>

  <!-- 成員（含職業設定，用子分頁切換） -->
  <section class="view" id="view-members">
    <div class="subseg" role="tablist" id="memberSeg" style="margin-top:4px">
      <button role="tab" aria-selected="true"  data-sub="mlist">成員列表</button>
      <button role="tab" aria-selected="false" data-sub="mroles">職業設定</button>
    </div>

    <div class="subview active" id="sub-mlist">
      <div class="sec"><span class="sec-t">成員</span><div class="sec-line"></div>
        <button class="gbtn accent" id="btnAddMember">＋ 新增成員</button>
      </div>
      <div class="field"><input id="memberSearch" placeholder="搜尋名字或暱稱⋯"></div>
      <div id="memberList"></div>
    </div>

    <div class="subview" id="sub-mroles">
      <div class="sec"><span class="sec-t">職業</span><div class="sec-line"></div>
        <div id="roleHeaderActions"></div>
      </div>
      <div id="roleList"></div>
    </div>
  </section>

  <!-- 材料統計 -->
  <section class="view" id="view-stats">
    <div class="sec"><span class="sec-t">材料統計</span><div class="sec-line"></div></div>

    <!-- 篩選條件平常收起來，只留一行摘要，需要調整才展開 -->
    <div class="matfilt-wrap">
      <button class="matfilt" id="matFiltBtn" aria-expanded="false" aria-controls="matFiltBody">
        <span class="matfilt-l">篩選</span>
        <span class="matfilt-v" id="matFiltText">全部日期 · 全部場次</span>
        <svg class="matfilt-c" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <!-- 有篩選才出現：不用展開面板就能一鍵回到全部 -->
      <button class="matfilt-x" id="matFiltClear" aria-label="清除篩選" hidden>×</button>
    </div>
    <div class="matfilt-body" id="matFiltBody" hidden>
      <div class="field-2 mat-range">
        <div class="field"><label>從</label><input type="date" id="matFrom"></div>
        <div class="field"><label>到</label><input type="date" id="matTo"></div>
      </div>
      <div class="field"><label>場次（選填，只看特定 RUN 名稱）</label><select id="matRun"><option value="">全部</option></select></div>
      <div class="preset-row">
        <button class="gbtn" data-preset="today">今天</button>
        <button class="gbtn" data-preset="week">本週</button>
        <button class="gbtn" data-preset="month">本月</button>
        <button class="gbtn" data-preset="all">全部</button>
      </div>
    </div>

    <!-- 主結果卡：可組成幾組 + 瓶頸是哪一種 + 每日掉落走勢。
         原本這裡是四張統計卡，但「符合場次／有掉落的場次」幾乎永遠相同、
         「材料種類」近乎常數，四張大卡只傳達一個有用數字卻吃掉近四分之一首屏。 -->
    <div id="matCards" style="margin-bottom:16px"></div>

    <!-- 三塊內容改成子分頁切換，一次只看一件事 -->
    <div class="subseg" role="tablist" id="matSeg">
      <button role="tab" aria-selected="true"  data-sub="totals">材料總計</button>
      <button role="tab" aria-selected="false" data-sub="sets">組數試算</button>
      <button role="tab" aria-selected="false" data-sub="detail">場次明細</button>
    </div>

    <div class="subview active" id="sub-totals">
      <div id="matBars"></div>
    </div>

    <div class="subview" id="sub-sets">
      <div class="setcfg">
        <label for="matPerSet">每種材料</label>
        <input type="number" id="matPerSet" min="1" value="1">
        <label for="matPerSet">個 = 1 組</label>
      </div>
      <div id="setDetail"></div>
    </div>

    <div class="subview" id="sub-detail">
      <div id="matDetail"></div>
    </div>
  </section>

  <!-- 拍賣：材料售出的試算與長期成交紀錄 -->
  <section class="view" id="view-auction">
    <div class="sec"><span class="sec-t">拍賣</span><div class="sec-line"></div></div>

    <div class="salebox">
      <div class="subseg" role="tablist" id="saleModeSeg" style="margin-bottom:13px">
        <button role="tab" aria-selected="true"  data-mode="set">整組出售</button>
        <button role="tab" aria-selected="false" data-mode="item">單品出售</button>
      </div>

      <div id="saleSetFields">
        <div class="field">
          <label>組數
            <button class="minibtn" id="saleLoad" type="button">帶入目前組數</button>
          </label>
          <input type="number" id="saleSets" min="0" step="1" inputmode="numeric">
        </div>
        <div class="field"><label>台幣（每組）</label>
          <input type="number" id="saleTwd" min="0" step="any" inputmode="decimal"></div>
      </div>

      <div id="saleItemFields" hidden>
        <div class="itemhead">
          <span>材料明細</span>
          <button class="minibtn" id="saleItemAdd" type="button">＋ 新增一列</button>
        </div>
        <div id="saleItemRows"></div>
        <datalist id="matNameList"></datalist>
      </div>

      <div class="field"><label>遊戲 R 幣值（1 台幣 = ? R）</label>
        <input type="number" id="saleRate" min="0" step="any" inputmode="decimal"></div>

      <div class="calcout" id="saleOut"></div>
      <button class="gbtn accent" id="saleAdd" style="width:100%; margin-top:12px">記錄這筆交易</button>
    </div>

    <!-- 成交紀錄的日期區間篩選：平常收起來，只留一行摘要 -->
    <button class="matfilt" id="aucFiltBtn" aria-expanded="false" aria-controls="aucFiltBody" style="margin-top:16px">
      <span class="matfilt-l">篩選</span>
      <span class="matfilt-v" id="aucFiltText">全部日期</span>
      <svg class="matfilt-c" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="matfilt-body" id="aucFiltBody" hidden>
      <div class="field-2 mat-range">
        <div class="field"><label>從</label><input type="date" id="aucFrom"></div>
        <div class="field"><label>到</label><input type="date" id="aucTo"></div>
      </div>
      <div class="preset-row">
        <button class="gbtn" data-aucpreset="today">今天</button>
        <button class="gbtn" data-aucpreset="week">本週</button>
        <button class="gbtn" data-aucpreset="month">本月</button>
        <button class="gbtn" data-aucpreset="all">全部</button>
      </div>
    </div>

    <div class="statgrid" id="saleCards" style="margin:16px 0"></div>

    <div class="sec"><span class="sec-t">成交走勢</span><div class="sec-line"></div></div>
    <div id="saleTrend"></div>

    <div class="sec" style="margin-top:16px"><span class="sec-t">單品行情</span><div class="sec-line"></div></div>
    <div id="saleQuotes"></div>

    <div class="sec" style="margin-top:16px"><span class="sec-t">成交紀錄</span><div class="sec-line"></div></div>
    <div id="saleList"></div>
  </section>
</div>

<!-- 底部懸浮分頁列：Liquid Glass 風格。圖示 + 短標籤，底部窄空間下辨識度比純文字高 -->
<nav class="tabbar" role="tablist" aria-label="主要分頁">
  <div class="tabbar-glass">
    <button class="tab" role="tab" aria-selected="true" data-view="board">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="9" rx="2"/><path d="M14 17h7"/></svg>
      <span>陣容</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="calc">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8"/><path d="M8 13h3"/><path d="M8 17h3"/><path d="M15 13v4"/><path d="M13 15h4"/></svg>
      <span>PT 計算</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="members">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.6a3.4 3.4 0 0 1 0 6.8"/><path d="M17.5 14.6a5.5 5.5 0 0 1 3 4.4"/></svg>
      <span>成員</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11"/><path d="M12 20V5"/><path d="M19 20v-6"/></svg>
      <span>材料</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="auction">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h9"/><path d="m8.5 13.5 5-5"/><path d="m10.2 6.6 4.2-4.2 5.2 5.2-4.2 4.2z"/><path d="m5.4 11.4 4.2-4.2 3 3-4.2 4.2z"/></svg>
      <span>拍賣</span>
    </button>
  </div>
</nav>

<div id="sheetHost"></div>
<div id="exportHost"></div>
<!-- html2canvas 改為自帶：原本走 CDN，離線第一次使用時會整個載不到，匯出圖片直接壞掉。
     自帶之後可以列進 Service Worker 的 APP_SHELL 一起預先快取。 -->
<script src="./vendor/html2canvas.min.js" defer></script>
<!-- 主程式拆成多個檔案：改一個區塊不用讓整份 index.html 的快取失效。
     這些是一般 script（不是 module）—— 全部共用同一個全域範圍，
     維持拆檔前的語意，載入順序即為原本的程式碼順序，不可任意調換。 -->
<script src="./js/data.js"></script>
<script src="./js/render.js"></script>
<script src="./js/materials.js"></script>
<script src="./js/auction.js"></script>
<script src="./js/assign.js"></script>
<script src="./js/sheets.js"></script>
<script src="./js/export.js"></script>
<script src="./js/events.js"></script>
<script src="./js/calc.js"></script>
<script src="./js/main.js"></script>

</body>
</html>
