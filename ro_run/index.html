<!DOCTYPE html>
<!-- 星座塔團隊 · 作者：BB -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f7">
<title>星座塔團隊</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="星座塔團隊">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --vvh:100vh; --vvtop:0px; /* JS 依 visualViewport 動態更新，讓鍵盤彈出時 sheet 仍貼齊可視範圍，不被鍵盤蓋住或跑版 */
  --bg:#eef1f7;
  --ink:#15171c;
  --ink-2:#3d434f;
  --muted:#7b8194;
  --faint:#a8aec0;
  --line:rgba(21,23,28,.09);
  --line-2:rgba(21,23,28,.055);
  --glass:rgba(255,255,255,.72);
  --glass-2:rgba(255,255,255,.55);
  --accent:#4f46e5;
  --accent-soft:rgba(79,70,229,.1);
  --danger:#dc2626;
  --ok:#0f9d76;
  --r-lg:20px; --r-md:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(21,23,28,.05), 0 8px 24px -8px rgba(21,23,28,.12);
  --shadow-lift:0 2px 4px rgba(21,23,28,.06), 0 18px 40px -12px rgba(21,23,28,.22);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
/* ambient night-sky wash */
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60vw 50vh at 12% -8%, rgba(99,102,241,.20), transparent 62%),
    radial-gradient(55vw 45vh at 92% 4%, rgba(139,92,246,.16), transparent 60%),
    radial-gradient(70vw 55vh at 50% 108%, rgba(34,211,238,.13), transparent 62%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0}
input,textarea,select{
  width:100%; background:rgba(255,255,255,.8); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:9px 11px; outline:none; transition:border-color .16s, box-shadow .16s;
  font-size:16px; /* iOS Safari 對 <16px 欄位 focus 時會自動放大頁面，standalone PWA 下會造成版面跑掉、鍵盤位置跟著跑掉 */
}
input:focus,textarea:focus,select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1}

/* ── layout ─────────────────────────────────────────────── */
.app{max-width:1180px; margin:0 auto; padding:0 16px calc(120px + env(safe-area-inset-bottom)); transition:padding-bottom .3s var(--ease)}
.app.nobench{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.topbar{
  position:sticky; top:0; z-index:30; margin:0 -16px; padding:10px 16px 10px;
  background:rgba(238,241,247,.82); backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px) saturate(1.6); border-bottom:1px solid var(--line-2);
}
.topbar-row{display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:baseline; gap:8px; margin-right:auto; min-width:0}
.brand-mark{font-size:15px; font-weight:700; letter-spacing:-.2px}
.brand-sub{font-size:11px; color:var(--faint); letter-spacing:.4px; white-space:nowrap}
.icon-btn{
  width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
  color:var(--ink-2); background:var(--glass-2); border:1px solid var(--line-2);
  transition:background .16s, color .16s, transform .12s var(--ease);
}
.icon-btn:hover{background:#fff; color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.32; cursor:default}
.icon-btn svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

/* tabs */
.tabbar{display:flex; gap:2px; margin-top:9px; background:rgba(21,23,28,.045); padding:3px; border-radius:11px}
.tab{
  flex:1; padding:7px 4px; border-radius:8px; font-size:12.5px; font-weight:500;
  color:var(--muted); transition:color .18s, background .18s, box-shadow .18s; white-space:nowrap;
}
.tab[aria-selected="true"]{background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(21,23,28,.1)}
.view{display:none; animation:rise .34s var(--ease) both}
.view.active{display:block}
@keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}

/* section heading */
.sec{display:flex; align-items:center; gap:10px; margin:26px 0 12px}
.sec-t{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.sec-line{flex:1; height:1px; background:var(--line-2)}

/* ── date rail ──────────────────────────────────────────── */
.daterail{display:flex; align-items:center; gap:8px; margin-top:14px}
.dates{
  display:flex; gap:7px; overflow-x:auto; scroll-snap-type:x mandatory;
  flex:1; padding:2px 0; scrollbar-width:none;
}
.dates::-webkit-scrollbar{display:none}
.datechip{
  scroll-snap-align:start; flex:0 0 auto; min-width:66px; padding:9px 13px 10px;
  background:var(--glass); border:1px solid var(--line-2); border-radius:var(--r-md);
  text-align:center; transition:transform .18s var(--ease), box-shadow .18s, border-color .18s;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.datechip:active{transform:scale(.96)}
.datechip .dc-dow{font-size:10px; color:var(--faint); letter-spacing:.06em; font-weight:500}
.datechip .dc-md{font-size:16px; font-weight:600; letter-spacing:-.3px; margin-top:1px}
.datechip .dc-meta{font-size:10px; color:var(--faint); margin-top:2px}
.datechip[aria-current="true"]{
  background:linear-gradient(135deg,var(--accent),#7c6ef2); border-color:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(79,70,229,.35);
}
.datechip[aria-current="true"] .dc-dow,
.datechip[aria-current="true"] .dc-meta{color:rgba(255,255,255,.62)}

/* ── PT cards ───────────────────────────────────────────── */
.ptgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:13px; margin-top:6px}
.ptcard{
  background:var(--glass); border:1px solid var(--line-2); border-radius:var(--r-lg);
  backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
  box-shadow:var(--shadow); overflow:hidden; transition:box-shadow .22s, border-color .18s, transform .18s var(--ease);
  animation:rise .4s var(--ease) both;
}
.ptcard.drop-on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-lift)}
.pt-head{display:flex; align-items:flex-start; gap:10px; padding:14px 15px 0}
.pt-id{min-width:0; flex:1}
.pt-name{font-size:15.5px; font-weight:650; letter-spacing:-.2px; display:flex; align-items:center; gap:7px}
.pt-time{font-size:11.5px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:5px}
.pt-count{text-align:right; line-height:1; white-space:nowrap}
.pt-count b{font-size:21px; font-weight:680; letter-spacing:-.8px}
.pt-count span{font-size:12px; color:var(--faint); font-weight:500}
.pt-count.full b{color:var(--ok)}

/* signature: segmented capacity meter */
.meter{display:flex; gap:2.5px; padding:11px 15px 12px}
.pip{flex:1; height:4px; border-radius:2px; background:rgba(21,23,28,.09); transition:background .3s var(--ease)}
.pip.on{background:var(--accent)}
.pip.full{background:var(--ok)}

.slots{display:flex; flex-direction:column; gap:1px; background:var(--line-2); border-top:1px solid var(--line-2)}
.slot{
  display:flex; align-items:center; gap:9px; padding:9px 15px; background:rgba(255,255,255,.62);
  transition:background .16s;
}
.slot:hover{background:rgba(255,255,255,.9)}
.slot-nm{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1}
.slot-name{font-size:13.5px; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.slot-buff{font-size:10.5px; font-weight:500; color:var(--accent); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rolepill{
  font-size:11.5px; font-weight:600; padding:3.5px 9px; border-radius:99px; white-space:nowrap;
  border:1px solid; transition:transform .12s var(--ease);
}
.rolepill:active{transform:scale(.93)}
.rolepill.empty{color:var(--faint); border-color:var(--line); background:transparent; font-weight:500}
.slot-x{color:var(--faint); font-size:15px; line-height:1; padding:2px 3px; border-radius:5px; transition:color .16s, background .16s}
.slot-x:hover{color:var(--danger); background:rgba(220,38,38,.08)}
.slot-empty{
  padding:10px 15px; font-size:12.5px; color:var(--faint); background:rgba(255,255,255,.42);
  text-align:center;
}
.pt-foot{display:flex; gap:7px; padding:10px 13px; border-top:1px solid var(--line-2); background:rgba(255,255,255,.45)}

/* small ghost button */
.gbtn{
  font-size:12px; font-weight:500; color:var(--ink-2); padding:6px 11px; border-radius:8px;
  border:1px solid var(--line); background:rgba(255,255,255,.7); transition:background .16s, border-color .16s, transform .12s var(--ease);
}
.gbtn:hover{background:#fff; border-color:var(--line)}
.gbtn:active{transform:scale(.96)}
.gbtn.accent{color:#fff; background:var(--ink); border-color:var(--ink)}
.gbtn.accent:hover{background:#000}
.gbtn.warn:hover{color:var(--danger); border-color:rgba(220,38,38,.3); background:rgba(220,38,38,.05)}

/* ── bench (unassigned pool) ────────────────────────────── */
.bench{
  position:fixed; left:0; right:0; bottom:0; z-index:25;
  background:rgba(238,241,247,.9); backdrop-filter:blur(22px) saturate(1.6);
  -webkit-backdrop-filter:blur(22px) saturate(1.6); border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  transition:transform .3s var(--ease);
}
.bench.drop-on{box-shadow:inset 0 3px 0 var(--accent)}
.bench.hidden{transform:translateY(105%); pointer-events:none}
.bench-top{display:flex; align-items:center; gap:9px; margin-bottom:8px}
.bench-t{font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.03em}
.bench-list{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; min-height:34px}
.bench-list::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:7px 12px;
  background:#fff; border:1px solid var(--line-2); border-radius:99px; font-size:13px; font-weight:500;
  box-shadow:0 1px 2px rgba(21,23,28,.05); touch-action:pan-x; cursor:grab;
  transition:transform .14s var(--ease), box-shadow .16s, opacity .16s;
}
.chip:active{cursor:grabbing}
.chip.picked{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.chip.dragging{opacity:.32}
.chip-dot{width:7px; height:7px; border-radius:99px; flex:0 0 auto}
.chip-n{
  font-size:10px; font-weight:700; color:#fff; background:var(--accent); border-radius:99px;
  min-width:15px; height:15px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px;
}
.bench-empty{font-size:12.5px; color:var(--faint); padding:8px 2px}
.drag-ghost{
  position:fixed; z-index:999; pointer-events:none; padding:7px 12px; background:#fff;
  border-radius:99px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lift);
  border:1px solid var(--accent); transform:translate(-50%,-50%) scale(1.04);
}

/* ── rows (members / roles) ─────────────────────────────── */
.list{background:var(--glass); border:1px solid var(--line-2); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow)}
.row{display:flex; align-items:center; gap:11px; padding:12px 15px; border-bottom:1px solid var(--line-2); transition:background .16s}
.row:last-child{border-bottom:none}
.row:hover{background:rgba(255,255,255,.72)}
.row-main{flex:1; min-width:0}
.row-t{font-size:14px; font-weight:550; display:flex; align-items:center; gap:7px}
.row-s{font-size:11.5px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.swatch{width:22px; height:22px; border-radius:7px; flex:0 0 auto; border:1px solid rgba(21,23,28,.1)}
.checkbox{
  width:21px; height:21px; border-radius:7px; flex:0 0 auto; border:1.5px solid var(--line);
  background:#fff; position:relative; transition:background .16s, border-color .16s;
}
.checkbox.on{background:var(--accent); border-color:var(--accent)}
.checkbox.on::after{
  content:''; position:absolute; left:6px; top:2.5px; width:5px; height:10px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);
}
.row-selectable{cursor:pointer}
.row-selectable:active{background:rgba(79,70,229,.06)}
.badge{font-size:10px; font-weight:600; padding:2px 7px; border-radius:99px; background:rgba(21,23,28,.06); color:var(--muted)}
.badge.off{background:rgba(220,38,38,.09); color:var(--danger)}
.emptystate{
  text-align:center; padding:38px 20px; color:var(--muted); font-size:13.5px;
  background:var(--glass); border:1px dashed var(--line); border-radius:var(--r-lg);
}
.emptystate b{display:block; font-size:15px; color:var(--ink); font-weight:600; margin-bottom:5px}

/* ── stats ──────────────────────────────────────────────── */
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:11px}
.stat{background:var(--glass); border:1px solid var(--line-2); border-radius:var(--r-md); padding:14px 15px; box-shadow:var(--shadow)}
.stat-k{font-size:11px; color:var(--muted); font-weight:500; letter-spacing:.03em}
.stat-v{font-size:27px; font-weight:680; letter-spacing:-1px; margin-top:3px; line-height:1}
.stat-v small{font-size:13px; color:var(--faint); font-weight:500; letter-spacing:0}
.bars{display:flex; flex-direction:column; gap:9px; margin-top:4px}
.bar-row{display:flex; align-items:center; gap:10px}
.bar-l{font-size:12.5px; font-weight:500; width:74px; flex:0 0 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{flex:1; height:7px; background:rgba(21,23,28,.07); border-radius:99px; overflow:hidden}
.bar-fill{height:100%; border-radius:99px; transition:width .5s var(--ease)}
.bar-n{font-size:12px; color:var(--muted); width:22px; text-align:right; flex:0 0 auto}


/* ── PT 計算 ────────────────────────────────────────────── */
.attrcard{
  background:var(--glass); border:1px solid var(--line-2); border-radius:var(--r-md);
  padding:13px 15px 14px; margin-bottom:9px; box-shadow:var(--shadow);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-left:3px solid var(--ac); animation:rise .4s var(--ease) both;
}
.attr-top{display:flex; align-items:center; gap:8px; margin-bottom:9px}
.attr-nm{font-size:14.5px; font-weight:600; letter-spacing:-.2px}
.attr-en{font-size:10.5px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase}
.attr-pt{
  margin-left:auto; font-size:12px; font-weight:650; padding:3px 9px; border-radius:99px;
  color:var(--ac); background:var(--ac-soft); border:1px solid var(--ac-line);
}
.stars{display:flex; align-items:center; gap:3px}
.star{
  width:30px; height:30px; display:grid; place-items:center; border-radius:8px; font-size:18px;
  color:rgba(21,23,28,.13); transition:color .18s var(--ease), transform .14s var(--ease), background .16s;
}
.star:hover{background:rgba(21,23,28,.04)}
.star:active{transform:scale(.88)}
.star.on{color:var(--ac)}
.star-lb{margin-left:7px; font-size:11px; color:var(--faint); font-weight:500}

.totalcard{
  background:var(--glass); border:1px solid var(--line-2); border-radius:var(--r-lg);
  padding:19px 18px 17px; box-shadow:var(--shadow); text-align:center;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
.total-k{font-size:11px; font-weight:550; color:var(--muted); letter-spacing:.07em; text-transform:uppercase}
.total-v{font-size:52px; font-weight:700; letter-spacing:-2.5px; line-height:1.05; margin:5px 0 3px}
.total-v small{font-size:16px; font-weight:550; color:var(--faint); letter-spacing:-.2px; margin-left:2px}
.total-meter{display:flex; gap:2.5px; margin:13px 0 12px}
.tier{
  display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600;
  padding:6px 14px; border-radius:99px; background:var(--accent-soft); color:var(--accent);
  border:1px solid rgba(79,70,229,.2);
}
.tier.hi{background:rgba(15,157,118,.1); color:var(--ok); border-color:rgba(15,157,118,.25)}
.tier-dot{width:6px; height:6px; border-radius:99px; background:currentColor}
.presets{display:flex; gap:5px; margin-top:13px}
.presets .gbtn{flex:1; min-width:0; text-align:center; padding:9px 4px; font-weight:550; font-size:11.5px; letter-spacing:-.2px}
.bd{background:var(--glass); border:1px solid var(--line-2); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow)}
.bd-row{display:flex; align-items:center; gap:11px; padding:10px 15px; border-bottom:1px solid var(--line-2); font-size:13px}
.bd-row:last-child{border-bottom:none}
.bd-nm{font-weight:500; width:44px; flex:0 0 auto}
.bd-st{color:var(--faint); font-size:12px; letter-spacing:1px; flex:1}
.bd-pt{font-weight:600; color:var(--ac)}

/* ── sheet / modal ──────────────────────────────────────── */
.scrim{
  position:fixed; left:0; right:0; top:0; height:calc(var(--vvh, 100vh)); z-index:100; background:rgba(21,23,28,.34);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease both;
  transform:translateY(var(--vvtop,0px));
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%; max-width:480px; background:#fff; border-radius:22px 22px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom)); max-height:calc(var(--vvh, 100vh) * .88); overflow-y:auto;
  animation:slide .34s var(--ease) both; box-shadow:0 -8px 40px rgba(21,23,28,.2);
}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.grip{width:34px; height:4px; background:rgba(21,23,28,.14); border-radius:99px; margin:6px auto 12px}
.sheet-t{font-size:16.5px; font-weight:650; letter-spacing:-.2px; margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block; font-size:11.5px; font-weight:550; color:var(--muted); margin-bottom:5px}
.field-2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.sheet-foot{display:flex; gap:9px; margin-top:16px}
.sheet-foot .gbtn{flex:1; padding:11px; font-size:13.5px; font-weight:550; text-align:center}
.rolegrid{display:flex; flex-wrap:wrap; gap:7px}
.swatches{display:flex; flex-wrap:wrap; gap:7px}
.sw-opt{width:30px; height:30px; border-radius:9px; border:2px solid transparent; transition:transform .14s var(--ease)}
.sw-opt[aria-pressed="true"]{border-color:var(--ink); transform:scale(1.1)}
.toggle{display:flex; align-items:center; gap:9px; font-size:13.5px; padding:9px 0}
.toggle input{width:auto; margin:0}

/* BUFF 技能選擇器 */
.skillgrp{font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em; margin:13px 0 6px}
.skillgrid{display:flex; flex-wrap:wrap; gap:7px}
.skillpill{
  padding:7px 12px; border-radius:99px; border:1px solid var(--line); background:#fff;
  font-size:12.5px; font-weight:500; transition:background .14s, color .14s, border-color .14s;
}
.skillpill[aria-pressed="true"]{color:#fff; background:var(--accent); border-color:var(--accent)}
.buffprev{

/* 取得某職業的整條轉職鏈（一轉 → 該職業） */
function roJobChain(jid){
  const out=[]; let cur=jid;
  while(cur&&RO_JOBS[cur]){ out.unshift(cur); cur=RO_JOBS[cur].p; }
  return out;
}
/* 鏈上有支援技能的職業才列進選單，避免選了卻沒東西可挑 */
function roPickableJobs(){
  return Object.keys(RO_JOBS).filter(jid=>roJobChain(jid).some(c=>RO_JOBS[c].s.length));
}
/* 用職業名稱回頭找 RO 職業 id（App 預設職業就是四轉職業名，所以多半對得上） */
function roJobIdByName(name){
  const n=(name||'').trim();
  return Object.keys(RO_JOBS).find(jid=>RO_JOBS[jid].n===n)||null;
}

// 全新安裝時的預設狀態：不帶任何示範成員／RUN，職業清單直接套用四轉職業
function seed(){
  const roles=FOURTH_JOBS.map((j,i)=>({id:uid(),name:j.name,color:PALETTE[i%PALETTE.length],icon:j.icon,order:i}));
  return {members:[],roles,schedule:{}};
}

function mkPt(name,time,cap){ return {id:uid(),name,time,capacity:cap,slots:[]}; }
function todayKey(){ const d=new Date(); return ymd(d); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
const DOW=['日','一','二','三','四','五','六'];
function fmtDate(k){ const d=parseYmd(k); return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function fmtDow(k){ return '週'+DOW[parseYmd(k).getDay()]; }
function shiftDate(k,n){ const d=parseYmd(k); d.setDate(d.getDate()+n); return ymd(d); }

let state=load(), curDate=null, undoStack=[], redoStack=[], picked=null, roleFilter=null;

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){ const p=JSON.parse(r); if(p&&p.members&&p.roles&&p.schedule) return migrate(p); }
  }catch(e){}
  return seed();
}
// 舊資料相容：把 PT 1 / PT1 這類舊命名轉成 RUN 1 / RUN1
function migrate(p){
  Object.values(p.schedule).forEach(pts=>pts.forEach(pt=>{
    const m=/^PT\s*(\d+)$/i.exec((pt.name||'').trim());
    if(m) pt.name='RUN '+m[1];
  }));
  /* 技能 BUFF 從「成員」搬到「職業」：把成員身上舊的 buff 文字，搬到他預設職業的 buff 上（該職業還沒設定過的話），
     這樣同職業的人 BUFF 才會一致，也才能跟著指派的職業正確標記，不用每個成員手動輸入一次 */
  (p.members||[]).forEach(m=>{
    if(m.buff&&m.defaultRoleId){
      const r=(p.roles||[]).find(x=>x.id===m.defaultRoleId);
      if(r&&!r.buff) r.buff=m.buff;
    }
    delete m.buff;
  });
  return p;
}
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ toast('儲存失敗，裝置空間可能已滿'); } }
function snap(){ return JSON.stringify(state); }

/* 每次改動前呼叫，寫入復原點 */
function commit(fn){
  const before=snap();
  fn();
  if(snap()===before) return;
  undoStack.push(before); if(undoStack.length>60) undoStack.shift();
  redoStack.length=0;
  persist(); render();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snap());
  state=JSON.parse(undoStack.pop());
  persist(); render(); toast('已復原');
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snap());
  state=JSON.parse(redoStack.pop());
  persist(); render(); toast('已重做');
}

/* ── 查詢輔助 ─────────────────────────────────────────── */
const dates=()=>Object.keys(state.schedule).sort();
const ptsOf=k=>state.schedule[k]||[];
const memberById=id=>state.members.find(m=>m.id===id);
const roleById=id=>state.roles.find(r=>r.id===id);
const sortedRoles=()=>[...state.roles].sort((a,b)=>a.order-b.order);
function assignedIds(k){ const s=new Set(); ptsOf(k).forEach(p=>p.slots.forEach(x=>s.add(x.memberId))); return s; }
/* 同一天可以把同一個人加進多個 RUN，所以「成員名單」永遠列出全部啟用中的成員，
   不會因為已經加過就消失 —— 這樣才能重複拖曳/點選加入不同場次。 */
function countRuns(k,memberId){ return ptsOf(k).reduce((n,p)=>n+(p.slots.some(s=>s.memberId===memberId)?1:0),0); }
function benchMembers(k){ return state.members.filter(m=>m.active); }
/* 純粹「今天一場都還沒排到」的人 —— 給統計卡片用 */
function unassignedMembers(k){ const a=assignedIds(k); return state.members.filter(m=>m.active&&!a.has(m.id)); }
function ensureDate(k){ if(!state.schedule[k]) state.schedule[k]=[]; }

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },1900);
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hexA(hex,a){ const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return `rgba(${r},${g},${b},${a})`; }

/* ══════════════════════════════════════════════════════════
   繪製
   ══════════════════════════════════════════════════════════ */
function render(){
  const ks=dates();
  if(!ks.length){ ensureDate(todayKey()); persist(); }
  if(!curDate||!state.schedule[curDate]) curDate=dates().includes(todayKey())?todayKey():dates()[0];
  renderDates(); renderBoard(); renderBench(); renderMembers(); renderRoles(); renderStats();
  document.getElementById('btnUndo').disabled=!undoStack.length;
  document.getElementById('btnRedo').disabled=!redoStack.length;
  document.getElementById('brandSub').textContent=fmtDate(curDate)+' '+fmtDow(curDate);
}

function renderDates(){
  const rail=document.getElementById('dateRail');
  rail.innerHTML=dates().map(k=>{
    const pts=ptsOf(k), used=assignedIds(k).size;
    return `<button class="datechip" data-date="${k}" aria-current="${k===curDate}">
      <div class="dc-dow">${fmtDow(k)}</div>
      <div class="dc-md num">${fmtDate(k)}</div>
      <div class="dc-meta num">${pts.length} RUN · ${used} 人</div>
    </button>`;
  }).join('');
  const cur=rail.querySelector('[aria-current="true"]');
  if(cur) cur.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}

function renderBoard(){
  const grid=document.getElementById('ptGrid'), pts=ptsOf(curDate);
  document.getElementById('boardLabel').textContent=`${fmtDate(curDate)} ${fmtDow(curDate)} · ${pts.length} RUN`;
  if(!pts.length){
    grid.innerHTML=`<div class="emptystate"><b>這天還沒有 RUN</b>先建一個 RUN，再把待分配的成員拖進來。</div>`;
    return;
  }
  grid.innerHTML=pts.map((pt,i)=>{
    const n=pt.slots.length, full=n>=pt.capacity;
    const pips=Array.from({length:pt.capacity},(_,j)=>
      `<div class="pip ${j<n?(full?'full':'on'):''}"></div>`).join('');
    const rows=pt.slots.length ? pt.slots.map((s,si)=>{
      const m=memberById(s.memberId), r=roleById(s.roleId);
      if(!m) return '';
      const pill=r
        ? `<button class="rolepill" data-act="role" data-pt="${pt.id}" data-i="${si}"
             style="color:${r.color};border-color:${hexA(r.color,.4)};background:${hexA(r.color,.09)}">${esc(r.icon||'')}${esc(r.name)}</button>`
        : `<button class="rolepill empty" data-act="role" data-pt="${pt.id}" data-i="${si}">指定職業</button>`;
      return `<div class="slot" data-chip="${m.id}" data-from="${pt.id}" data-si="${si}">
        <div class="slot-nm">
          <span class="slot-name">${esc(m.name)}</span>
          ${r&&r.buff?`<span class="slot-buff">${esc(r.buff)}</span>`:''}
        </div>${pill}
        <button class="slot-x" data-act="unassign" data-pt="${pt.id}" data-i="${si}" aria-label="移出">×</button>
      </div>`;
    }).join('') : `<div class="slot-empty">還沒有人 — 從下方拖曳或點選成員加入</div>`;
    return `<div class="ptcard" data-drop="pt" data-pt="${pt.id}" style="animation-delay:${i*45}ms">
      <div class="pt-head">
        <div class="pt-id">
          <div class="pt-name">${esc(pt.name)}</div>
          <div class="pt-time num">${esc(pt.time||'未設定時間')}</div>
        </div>
        <div class="pt-count num ${full?'full':''}"><b>${n}</b><span>/${pt.capacity}</span></div>
      </div>
      <div class="meter">${pips}</div>
      <div class="slots">${rows}</div>
      <div class="pt-foot">
        <button class="gbtn" data-act="editPt" data-pt="${pt.id}">編輯</button>
        <button class="gbtn" data-act="dupPt" data-pt="${pt.id}">複製</button>
        <button class="gbtn warn" data-act="delPt" data-pt="${pt.id}" style="margin-left:auto">刪除</button>
      </div>
    </div>`;
  }).join('');
}

function renderBench(){
  const host=document.getElementById('benchList');
  let list=benchMembers(curDate);
  if(roleFilter) list=list.filter(m=>m.defaultRoleId===roleFilter);
  document.getElementById('benchTitle').textContent=`成員 ${list.length}`;
  if(!list.length){
    host.innerHTML=`<div class="bench-empty">${roleFilter?'這個職業沒有符合的成員':'還沒有啟用中的成員'}</div>`;
    return;
  }
  host.innerHTML=list.map(m=>{
    const r=roleById(m.defaultRoleId), n=countRuns(curDate,m.id);
    return `<button class="chip ${picked===m.id?'picked':''}" data-chip="${m.id}" data-from="bench">
      ${r?`<span class="chip-dot" style="background:${r.color}"></span>`:''}${esc(m.name)}${n?`<span class="chip-n">${n}</span>`:''}
    </button>`;
  }).join('');
}

function renderMembers(){
  const q=(document.getElementById('memberSearch').value||'').trim().toLowerCase();
  const host=document.getElementById('memberList');
  const list=state.members.filter(m=>!q||m.name.toLowerCase().includes(q));
  if(!list.length){
    host.innerHTML=`<div class="emptystate"><b>${q?'找不到符合的成員':'還沒有成員'}</b>${q?'換個關鍵字試試。':'新增成員後就能開始排班。'}</div>`;
    return;
  }
  host.innerHTML=`<div class="list">`+list.map(m=>{
    const r=roleById(m.defaultRoleId);
    const meta=[r?r.name:'', r&&r.buff, m.notes].filter(Boolean).join(' · ');
    return `<div class="row" data-act="editMember" data-id="${m.id}">
      <div class="row-main">
        <div class="row-t">${esc(m.name)}${m.active?'':'<span class="badge off">停用</span>'}</div>
        ${meta?`<div class="row-s">${esc(meta)}</div>`:''}
      </div>
      ${r?`<span class="rolepill" style="color:${r.color};border-color:${hexA(r.color,.4)};background:${hexA(r.color,.09)}">${esc(r.name)}</span>`:''}
    </div>`;
  }).join('')+`</div>`;
}

let roleSelectMode=false, roleSelected=new Set();
function renderRoles(){
  const rs=sortedRoles();
  document.getElementById('roleHeaderActions').innerHTML = roleSelectMode
    ? `<button class="gbtn" id="roleSelCancel">取消</button>
       <button class="gbtn warn" id="roleSelDelete" ${roleSelected.size?'':'disabled'}
         style="${roleSelected.size?'color:#fff;background:var(--danger);border-color:var(--danger)':''}">刪除${roleSelected.size?` (${roleSelected.size})`:''}</button>`
    : `<button class="gbtn" id="roleSelStart" ${rs.length?'':'disabled'}>勾選管理</button>
       <button class="gbtn accent" data-act="addRole">＋ 新增職業</button>`;

  const host=document.getElementById('roleList');
  if(!rs.length){ host.innerHTML=`<div class="emptystate"><b>還沒有職業</b>先建立職業，排班時才能指定。</div>`; return; }
  host.innerHTML=`<div class="list">`+rs.map((r,i)=>{
    const checked=roleSelected.has(r.id);
    return `
    <div class="row ${roleSelectMode?'row-selectable':''}" ${roleSelectMode?`data-act="toggleRoleSel" data-id="${r.id}"`:''}>
      ${roleSelectMode?`<span class="checkbox ${checked?'on':''}"></span>`:`<span class="swatch" style="background:${r.color}"></span>`}
      <div class="row-main" ${roleSelectMode?'':`data-act="editRole" data-id="${r.id}"`}>
        <div class="row-t">${esc(r.icon||'')}${esc(r.name)}</div>
        <div class="row-s">${r.buff?esc(r.buff):`排序 ${i+1}`}</div>
      </div>
      ${roleSelectMode?'':`
      <button class="icon-btn" data-act="roleUp" data-id="${r.id}" ${i===0?'disabled':''} aria-label="上移">
        <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
      <button class="icon-btn" data-act="roleDown" data-id="${r.id}" ${i===rs.length-1?'disabled':''} aria-label="下移">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`}
    </div>`;
  }).join('')+`</div>`;

  const start=document.getElementById('roleSelStart');
  if(start) start.onclick=()=>{ roleSelectMode=true; roleSelected=new Set(); renderRoles(); };
  const cancel=document.getElementById('roleSelCancel');
  if(cancel) cancel.onclick=()=>{ roleSelectMode=false; roleSelected=new Set(); renderRoles(); };
  const del=document.getElementById('roleSelDelete');
  if(del) del.onclick=()=>{
    if(!roleSelected.size) return;
    const ids=[...roleSelected], names=ids.map(id=>roleById(id)?.name).filter(Boolean).join('、');
    confirmSheet(`刪除「${names}」共 ${ids.length} 個職業？已指定這些職業的人會變成未指定。`, ()=>{
      commit(()=>{
        state.roles=state.roles.filter(x=>!ids.includes(x.id));
        Object.values(state.schedule).forEach(ps=>ps.forEach(p=>p.slots.forEach(sl=>{ if(ids.includes(sl.roleId)) sl.roleId=null; })));
        state.members.forEach(m=>{ if(ids.includes(m.defaultRoleId)) m.defaultRoleId=null; });
      });
      roleSelectMode=false; roleSelected=new Set(); render();
    });
  };
}

function renderStats(){
  const pts=ptsOf(curDate);
  const cap=pts.reduce((a,p)=>a+p.capacity,0);
  const used=pts.reduce((a,p)=>a+p.slots.length,0);
  const noRole=pts.reduce((a,p)=>a+p.slots.filter(s=>!s.roleId).length,0);
  document.getElementById('statsLabel').textContent=`${fmtDate(curDate)} ${fmtDow(curDate)}`;
  document.getElementById('statCards').innerHTML=[
    ['出席人數',`${used}<small>/${cap}</small>`],
    ['RUN 數', pts.length],
    ['空位', cap-used],
    ['未指定職業', noRole],
    ['待分配', unassignedMembers(curDate).length],
    ['總成員', state.members.filter(m=>m.active).length],
  ].map(([k,v])=>`<div class="stat"><div class="stat-k">${k}</div><div class="stat-v num">${v}</div></div>`).join('');

  const counts={}; pts.forEach(p=>p.slots.forEach(s=>{ if(s.roleId) counts[s.roleId]=(counts[s.roleId]||0)+1; }));
  const max=Math.max(1,...Object.values(counts));
  const rb=sortedRoles().filter(r=>counts[r.id]);
  document.getElementById('roleBars').innerHTML = rb.length
    ? rb.map(r=>`<div class="bar-row"><span class="bar-l">${esc(r.name)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${counts[r.id]/max*100}%;background:${r.color}"></div></div>
        <span class="bar-n num">${counts[r.id]}</span></div>`).join('')
    : `<div class="bench-empty">這天還沒有指定任何職業</div>`;

  const att={}; dates().forEach(k=>assignedIds(k).forEach(id=>att[id]=(att[id]||0)+1));
  const amax=Math.max(1,...Object.values(att));
  const rows=state.members.filter(m=>att[m.id]).sort((a,b)=>att[b.id]-att[a.id]);
  document.getElementById('attendBars').innerHTML = rows.length
    ? rows.map(m=>`<div class="bar-row"><span class="bar-l">${esc(m.name)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${att[m.id]/amax*100}%;background:var(--accent)"></div></div>
        <span class="bar-n num">${att[m.id]}</span></div>`).join('')
    : `<div class="bench-empty">還沒有出勤紀錄</div>`;
}

/* ══════════════════════════════════════════════════════════
   指派 / 移動
   ══════════════════════════════════════════════════════════ */
function assign(memberId, ptId){
  commit(()=>{
    const pt=ptsOf(curDate).find(p=>p.id===ptId); if(!pt) return;
    if(pt.slots.length>=pt.capacity){ toast(`${pt.name} 已滿`); return; }
    const m=memberById(memberId);
    pt.slots.push({memberId, roleId:m?.defaultRoleId||null});
  });
  picked=null;
}
/* 依「拖曳來源那一個 slot 的 index」移除，不是依 memberId —
   同一人可以在同一場 RUN 裡重複出現（雙開/多開），用 index 才不會一次把全部重複的都移掉 */
function unassign(ptId, si){
  commit(()=>{
    const pt=ptsOf(curDate).find(p=>p.id===ptId); if(!pt) return;
    const i=+si;
    if(Number.isInteger(i)&&pt.slots[i]!==undefined) pt.slots.splice(i,1);
  });
  picked=null;
}

/* ── 拖曳（滑鼠與觸控通用，用 pointer events） ─────────── */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const chip=e.target.closest('[data-chip]');
  if(!chip||e.target.closest('button[data-act]')) return;
  drag={id:chip.dataset.chip, from:chip.dataset.from, si:chip.dataset.si, x:e.clientX, y:e.clientY, el:chip, moved:false, ghost:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.moved){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)<7) return;
    /* 從 bench 橫向捲動列拿起的 chip：如果這一動主要是左右方向，
       判斷成使用者只是想橫向捲動找人，不是要拖曳指派 —— 放手讓瀏覽器原生橫向捲動接手，
       這樣成員一多、bench 要左右捲才能找到人時，捲動才不會被誤判成拖曳。 */
    if(drag.from==='bench' && Math.abs(dx)>Math.abs(dy)*1.2){ drag=null; return; }
    drag.moved=true; drag.el.classList.add('dragging');
    const m=memberById(drag.id);
    const g=document.createElement('div'); g.className='drag-ghost'; g.textContent=m?m.name:'';
    document.body.appendChild(g); drag.ghost=g;
  }
  drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
  document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
  const t=dropTargetAt(e.clientX,e.clientY);
  if(t) t.classList.add('drop-on');
});
document.addEventListener('pointerup',e=>{
  if(!drag) return;
  const d=drag; drag=null;
  document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
  d.el.classList.remove('dragging');
  if(d.ghost) d.ghost.remove();
  if(!d.moved){ tapChip(d.id); return; }
  const t=dropTargetAt(e.clientX,e.clientY);
  if(!t) return;
  if(t.dataset.drop==='bench'){ if(d.from!=='bench') unassign(d.from,d.si); }
  else if(t.dataset.pt!==d.from) assign(d.id,t.dataset.pt);
});
document.addEventListener('pointercancel',()=>{
  if(!drag) return;
  drag.el.classList.remove('dragging'); if(drag.ghost) drag.ghost.remove();
  document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
  drag=null;
});
function dropTargetAt(x,y){
  const el=document.elementFromPoint(x,y);
  return el?el.closest('[data-drop]'):null;
}
/* 點一下＝選取，再點隊伍卡片＝加入 */
function tapChip(id){
  if(picked===id){ picked=null; }
  else if(picked===null){ picked=id; toast('已選取 — 點一下 RUN 加入'); }
  else { picked=id; }
  renderBench();
}
document.addEventListener('click',e=>{
  if(!picked) return;
  if(e.target.closest('[data-chip]')) return; // 這個點擊已經由 pointerup 的 tapChip() 處理過，不要再重複指派
  const card=e.target.closest('[data-drop="pt"]');
  if(card&&!e.target.closest('button[data-act]')) assign(picked,card.dataset.pt);
});

/* ══════════════════════════════════════════════════════════
   Sheet（底部彈出面板）
   ══════════════════════════════════════════════════════════ */
/* iOS Safari 在 fixed 定位的彈窗裡點輸入框時，就算容器是 fixed，
   還是會把「背後的頁面」往上捲動去對齊鍵盤，導致打字的地方被捲到看不見。
   開彈窗時把 body 鎖成 fixed（等於背後頁面不能捲），Safari 就沒有頁面可以捲了。 */
function lockBodyScroll(){
  if(document.body.style.position==='fixed') return;
  const y=window.scrollY||window.pageYOffset||0;
  document.body.dataset.scrollY=y;
  document.body.style.position='fixed';
  document.body.style.top=(-y)+'px';
  document.body.style.left='0';
  document.body.style.right='0';
  document.body.style.width='100%';
  document.body.style.overflow='hidden';
  document.documentElement.style.overflow='hidden';
}
function unlockBodyScroll(){
  if(document.body.style.position!=='fixed') return;
  const y=parseInt(document.body.dataset.scrollY||'0',10);
  document.body.style.position='';
  document.body.style.top='';
  document.body.style.left='';
  document.body.style.right='';
  document.body.style.width='';
  document.body.style.overflow='';
  document.documentElement.style.overflow='';
  delete document.body.dataset.scrollY;
  window.scrollTo(0,y);
}
function sheet(title, bodyHtml, onMount){
  const host=document.getElementById('sheetHost');
  lockBodyScroll();
  host.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <div class="grip"></div><div class="sheet-t">${esc(title)}</div>${bodyHtml}</div></div>`;
  const scrim=host.querySelector('.scrim');
  scrim.addEventListener('click',ev=>{ if(ev.target===scrim) closeSheet(); });
  document.addEventListener('keydown',escClose);
  onMount&&onMount(host.querySelector('.sheet'));
  const f=host.querySelector('input,textarea,select'); if(f&&window.innerWidth>760) f.focus();
}
function closeSheet(){ document.getElementById('sheetHost').innerHTML=''; document.removeEventListener('keydown',escClose); unlockBodyScroll(); }
function escClose(e){ if(e.key==='Escape') closeSheet(); }
const val=(s,n)=>s.querySelector(`[name="${n}"]`).value.trim();


/* 原生 confirm() 在 PWA 獨立模式下不一定會顯示，改用畫面內的確認卡片 */
function confirmSheet(message, onConfirm){
  sheet('請確認',`
    <p style="font-size:13.5px; color:var(--ink-2); line-height:1.6; margin:0 0 16px">${esc(message)}</p>

/* BUFF 技能選擇器：依職業列出整條轉職鏈的支援技能，可複選，結果用「、」串起來
   current：目前的 BUFF 文字（沿用既有的自由輸入內容，不會被洗掉）
   roleName：職業名稱，用來自動對應到 RO 職業 */
function buffPickerSheet(current, roleName, onApply, onCancel){
  const CATS=['一轉','二轉','轉生二轉','三轉','四轉','擴充職業'];
  const picks=(current||'').split('、').map(x=>x.trim()).filter(Boolean);
  const selected=new Set(picks);
  const pickable=roPickableJobs();
  let jobId=roJobIdByName(roleName);
  if(!jobId||!pickable.includes(jobId)) jobId=pickable[0];

  const opts=CATS.map(c=>{
    const list=pickable.filter(jid=>RO_JOBS[jid].c===c);
    if(!list.length) return '';
    return `<optgroup label="${c}">`+list.map(jid=>
      `<option value="${jid}" ${jid===jobId?'selected':''}>${esc(RO_JOBS[jid].n)}</option>`).join('')+`</optgroup>`;
  }).join('');

  sheet('選擇技能 BUFF',`
    <div class="field"><label>職業（會一併列出這條轉職線的支援技能）</label>
      <select name="job">${opts}</select></div>
    <div id="skillHost"></div>
    <div class="buffprev" id="buffPrev"></div>
    <div class="sheet-foot">
      <button class="gbtn" data-s="clear">清除</button>
      <button class="gbtn" data-s="cancel">取消</button>
      <button class="gbtn accent" data-s="apply">套用</button>
    </div>`,s=>{
    const host=s.querySelector('#skillHost'), prev=s.querySelector('#buffPrev');

    function paintPrev(){
      const arr=[...selected];
      prev.innerHTML=arr.length
        ? `<b>已選 ${arr.length} 個：</b>${esc(arr.join('、'))}`
        : `<span class="none">還沒選任何技能 — 點下方技能加入</span>`;
    }
    function paintSkills(){
      const chain=roJobChain(s.querySelector('[name="job"]').value);
      const groups=chain.filter(c=>RO_JOBS[c].s.length).map(c=>
        `<div class="skillgrp">${esc(RO_JOBS[c].n)}</div>
         <div class="skillgrid">${RO_JOBS[c].s.map(sk=>
           `<button class="skillpill" data-sk="${esc(sk)}" aria-pressed="${selected.has(sk)}">${esc(sk)}</button>`).join('')}</div>`).join('');
      host.innerHTML=groups||`<div class="bench-empty">這個職業沒有收錄支援類技能</div>`;
      host.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{
        const sk=b.dataset.sk;
        if(selected.has(sk)) selected.delete(sk); else selected.add(sk);
        b.setAttribute('aria-pressed',selected.has(sk));
        paintPrev();
      });
    }
    s.querySelector('[name="job"]').onchange=paintSkills;
    paintSkills(); paintPrev();

    s.querySelector('[data-s="clear"]').onclick=()=>{
      selected.clear(); paintSkills(); paintPrev();
    };
    s.querySelector('[data-s="apply"]').onclick=()=>onApply([...selected].join('、'));
    s.querySelector('[data-s="cancel"]').onclick=()=>onCancel();
  });
}

/* ══════════════════════════════════════════════════════════
   匯出
   圖片：不截取畫面，改用資料重建一份乾淨的 DOM 再轉圖，
   避免 html2canvas 對 <button> 與 CSS 動畫的已知問題。
   ══════════════════════════════════════════════════════════ */
function buildExportNode(){
  const pts=ptsOf(curDate);
  const cols=pts.map(pt=>{
    const rows=pt.slots.length ? pt.slots.map(s=>{
      const m=memberById(s.memberId), r=roleById(s.roleId);
      if(!m) return '';
      return `<div class="ex-row"><span class="ex-nm">${esc(m.name)}${r&&r.buff?`<span class="ex-buff">${esc(r.buff)}</span>`:''}</span>`+
        (r?`<span class="ex-rl" style="color:${r.color};border-color:${hexA(r.color,.45)};background:${hexA(r.color,.1)}">${esc(r.name)}</span>`
           :`<span class="ex-rl" style="color:#a8aec0;border-color:#e6e8ef">未指定</span>`)+`</div>`;
    }).join('') : `<div class="ex-row"><span class="ex-nm" style="color:#a8aec0">（無人）</span></div>`;
    return `<div class="ex-pt">
      <div class="ex-pt-h"><span class="ex-pt-n">${esc(pt.name)}</span>
        <span class="ex-pt-t">${esc(pt.time||'')}</span>
        <span class="ex-pt-c">${pt.slots.length}/${pt.capacity}</span></div>
      ${rows}</div>`;
  }).join('');
  const host=document.getElementById('exportHost');
  host.innerHTML=`<div class="exportwrap" id="exportWrap">
    <div class="ex-h">${fmtDate(curDate)}（${DOW[parseYmd(curDate).getDay()]}） 陣容分配</div>
    <div class="ex-sub">${pts.length} RUN · 出席 ${pts.reduce((a,p)=>a+p.slots.length,0)} 人 · 產出於 ${new Date().toLocaleString('zh-TW',{hour12:false})}</div>
    <div class="ex-cols">${cols||'<div class="ex-sub">這天還沒有 RUN</div>'}</div>
  </div>`;
  return document.getElementById('exportWrap');
}

async function exportImage(){
  if(typeof html2canvas==='undefined') return toast('圖片功能需要連線載入元件，請連上網路再試');
  toast('產出中⋯');
  const node=buildExportNode();
  try{
    const canvas=await html2canvas(node,{backgroundColor:'#ffffff',scale:2,useCORS:true});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const file=new File([blob],`陣容分配_${fmtDate(curDate).replace('/','')}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'陣容分配'}); }
      catch(err){ if(err.name!=='AbortError') download(blob,file.name); }
    } else download(blob,file.name);
  }catch(err){ console.error(err); toast('圖片產出失敗，請再試一次'); }
  finally{ document.getElementById('exportHost').innerHTML=''; }
}

function exportCsv(){
  const rows=[['日期','RUN','時間','成員','職業','BUFF']];
  ptsOf(curDate).forEach(pt=>pt.slots.forEach(s=>{
    const m=memberById(s.memberId), r=roleById(s.roleId);
    if(m) rows.push([fmtDate(curDate),pt.name,pt.time||'',m.name,r?r.name:'',r&&r.buff||'']);
  }));
  if(rows.length===1) return toast('這天還沒有排班資料');
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),`陣容分配_${fmtDate(curDate).replace('/','')}.csv`);
  toast('已匯出 CSV');
}
function download(blob,name){
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ══════════════════════════════════════════════════════════
   事件綁定
   ══════════════════════════════════════════════════════════ */
document.addEventListener('click',e=>{
  const chip=e.target.closest('[data-date]');
  if(chip){ curDate=chip.dataset.date; picked=null; render(); return; }
  const t=e.target.closest('.tab');
  if(t){
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+t.dataset.view));
    const onBoard=t.dataset.view==='board';
    document.getElementById('bench').classList.toggle('hidden',!onBoard);
    document.querySelector('.app').classList.toggle('nobench',!onBoard);
    return;
  }
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const a=btn.dataset.act, id=btn.dataset.id, ptId=btn.dataset.pt, i=+btn.dataset.i;
  if(a==='role')      rolePickSheet(ptId,i);
  if(a==='unassign')  commit(()=>{ const p=ptsOf(curDate).find(x=>x.id===ptId); p.slots.splice(i,1); });
  if(a==='editPt')    ptSheet(ptId);
  if(a==='dupPt'){
    commit(()=>{ const p=ptsOf(curDate).find(x=>x.id===ptId);
      state.schedule[curDate].push({...JSON.parse(JSON.stringify(p)),id:uid(),name:p.name+' 複本',slots:[]}); });
  }
  if(a==='delPt'){
    const p=ptsOf(curDate).find(x=>x.id===ptId);
    confirmSheet(`刪除「${p.name}」？`, ()=>{
      commit(()=>{ state.schedule[curDate]=ptsOf(curDate).filter(x=>x.id!==ptId); });
    });
  }
  if(a==='editMember') memberSheet(id);
  if(a==='editRole')   roleSheet(id);
  if(a==='addRole')    roleSheet(null);
  if(a==='toggleRoleSel'){
    if(roleSelected.has(id)) roleSelected.delete(id); else roleSelected.add(id);
    renderRoles();
  }
  if(a==='roleUp'||a==='roleDown'){
    commit(()=>{
      const rs=sortedRoles(), i2=rs.findIndex(r=>r.id===id), j=a==='roleUp'?i2-1:i2+1;
      if(j<0||j>=rs.length) return;
      [rs[i2].order,rs[j].order]=[rs[j].order,rs[i2].order];
    });
  }
});

  if(!assignedIds(curDate).size) return toast('本日還沒有排班');
  confirmSheet(`清空 ${fmtDate(curDate)} 所有 RUN 的成員？RUN 本身會保留。`, ()=>{
    commit(()=>{ ptsOf(curDate).forEach(p=>p.slots=[]); });
  });
};

/* iOS Safari（尤其 standalone PWA）鍵盤彈出時不會縮小 fixed 元素所依據的 layout viewport，
   改用 visualViewport 動態量測可視高度／位移，寫進 --vvh／--vvtop，讓 sheet／scrim 貼齊實際看得到的範圍，
   避免鍵盤蓋住輸入欄或畫面被鍵盤頂到跑版。 */
function syncVVH(){
  const vv=window.visualViewport;
  const h=(vv&&vv.height)||window.innerHeight;
  const top=(vv&&vv.offsetTop)||0;
  document.documentElement.style.setProperty('--vvh',h+'px');
  document.documentElement.style.setProperty('--vvtop',top+'px');
}
syncVVH();
let focusedField=null;
document.addEventListener('focusin',e=>{
  if(e.target.matches('input,textarea,select')) focusedField=e.target;
});
document.addEventListener('focusout',e=>{
  if(e.target===focusedField) focusedField=null;
});
/* 只在 visualViewport 真的因鍵盤而變化「之後」才校正一次位置，
   不用猜時間的 setTimeout（會跟 iOS 原生的捲動打架，越修越跑版）。 */
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    syncVVH();
    if(focusedField&&document.activeElement===focusedField){
      focusedField.scrollIntoView({block:'nearest'});
    }
  });
  window.visualViewport.addEventListener('scroll',syncVVH);
}else{
  window.addEventListener('resize',syncVVH);
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')) return;
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
  if(mod&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
});

/* PWA：manifest 為 head 內的靜態檔（./manifest.webmanifest），離線快取由 ./sw.js 處理 */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ══════════════════════════════════════════════════════════
   PT 計算（屬性星數 → 總 PT 等級）
   ══════════════════════════════════════════════════════════ */
const ATTRS=[
  {id:'hp',      label:'體力', en:'HP',       color:'#0f9d76', pts:[0,15,30,45,60,75]},
  {id:'attack',  label:'攻擊', en:'Attack',   color:'#dc2626', pts:[0,20,40,60,80,100]},
  {id:'recovery',label:'恢復', en:'Recovery', color:'#65a30d', pts:[0,30,60,90,120,150]},
  {id:'defense', label:'防禦', en:'Defense',  color:'#ca8a04', pts:[0,50,100,150,200,250]},
  {id:'trap',    label:'陷阱', en:'Trap',     color:'#9333ea', pts:[0,85,170,255,340,425]},
];
const MAX_PT=1000;
const PT_TIERS=[
  {pt:0,   label:'50 層挑戰範圍'},
  {pt:600, label:'75 層挑戰範圍'},
];
const stars={hp:0,attack:0,recovery:0,defense:0,trap:0};
const tierOf=t=>PT_TIERS.reduce((c,x)=>t>=x.pt?x:c,PT_TIERS[0]);

function renderCalc(){
  document.getElementById('attrCards').innerHTML=ATTRS.map((a,i)=>{
    const n=stars[a.id];
    return `<div class="attrcard" style="--ac:${a.color};--ac-soft:${hexA(a.color,.1)};--ac-line:${hexA(a.color,.28)};animation-delay:${i*40}ms">
      <div class="attr-top">
        <span class="attr-nm">${a.label}</span><span class="attr-en">${a.en}</span>
        <span class="attr-pt num">${a.pts[n]} pt</span>
      </div>
      <div class="stars">
        ${[1,2,3,4,5].map(v=>`<button class="star ${v<=n?'on':''}" data-attr="${a.id}" data-v="${v}" aria-label="${a.label} ${v} 顆星">★</button>`).join('')}
        <span class="star-lb">${n?n+' 顆星':'封印'}</span>
      </div>
    </div>`;
  }).join('');

  const total=ATTRS.reduce((s,a)=>s+a.pts[stars[a.id]],0);
  const tier=tierOf(total), hi=tier.pt>=600;
  document.getElementById('calcTotal').innerHTML=`${total}<small>pt</small>`;
  document.getElementById('calcMeter').innerHTML=
    Array.from({length:10},(_,i)=>`<div class="pip ${total/MAX_PT*10>i?(hi?'full':'on'):''}"></div>`).join('');
  document.getElementById('calcTier').className='tier'+(hi?' hi':'');
  document.getElementById('calcTierText').textContent=tier.label;
  document.getElementById('calcBreak').innerHTML=ATTRS.map(a=>{
    const n=stars[a.id];
    return `<div class="bd-row" style="--ac:${a.color}">
      <span class="bd-nm">${a.label}</span>
      <span class="bd-st">${n?'★'.repeat(n):'封印中'}</span>
      <span class="bd-pt num">${a.pts[n]} pt</span></div>`;
  }).join('');
}

document.addEventListener('click',e=>{
  const st=e.target.closest('.star');
  if(st){
    const id=st.dataset.attr, v=+st.dataset.v;
    stars[id]= stars[id]===v ? v-1 : v;   // 再點同一顆＝取消該顆
    renderCalc(); return;
  }
  const ps=e.target.closest('[data-preset]');
  if(ps){
    ps.dataset.preset.split(',').forEach((v,i)=>stars[ATTRS[i].id]=+v);
    renderCalc();
  }
});
renderCalc();

render();
</script>
