<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>車庫</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#EEEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="車庫">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
<link rel="icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   車庫 · Garage
   顏色來自車輛本身：介面是無彩度的，唯一的彩度是你的車漆。
   例外只有儀表警示燈的兩個顏色：琥珀與磚紅。
   ============================================================ */
:root{
  --paper:#EEEFF1;
  --card:#FFFFFF;
  --ink:#1C1F24;
  --ink2:#5C6672;
  --ink3:#8A9099;
  --line:rgba(28,31,36,.10);
  --line2:rgba(28,31,36,.055);
  --amber:#C8791F;
  --brick:#A63A2B;
  --accent-l:#7C93A8;
  --accent-d:#9DB4C9;
  --accent:var(--accent-l);
  --shadow:0 1px 2px rgba(16,20,26,.05), 0 8px 24px -10px rgba(16,20,26,.16);
  --r:22px;
  --num:'Oswald','Helvetica Neue','Arial Narrow',system-ui,sans-serif;
  --han:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#111418; --card:#191D22; --ink:#EDEFF2; --ink2:#9AA2AC; --ink3:#6B737D;
    --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.06);
    --amber:#E0994A; --brick:#D4655A;
    --accent:var(--accent-d);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--han);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* ---------- 版面 ---------- */
.app{min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 10px;flex:0 0 auto}
.top h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.02em}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:var(--ink2)}
.icon-btn:active{background:var(--line2)}

/* ---------- 車卡輪播 ---------- */
.rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.rail::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:6px 16px 8px;display:flex}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  width:100%;display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--line2)}

.card-head{padding:20px 22px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.vname{font-size:19px;font-weight:600;letter-spacing:.01em;margin:0;display:flex;align-items:center;gap:9px}
.paint{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.vsub{margin:3px 0 0;font-size:12.5px;color:var(--ink3);letter-spacing:.06em}

/* ---------- 里程表 ---------- */
.odo-wrap{padding:14px 22px 0}
.odo{display:flex;align-items:flex-end;font-family:var(--num);font-weight:300;
  font-size:clamp(58px,17.5vw,82px);line-height:1;letter-spacing:-.005em;
  color:var(--ink);font-variant-numeric:tabular-nums}
.odo .col{width:.60em;height:1em;overflow:hidden;position:relative}
.odo .reel{position:absolute;inset-inline:0;top:0;display:flex;flex-direction:column;
  transform:translateY(calc(var(--d,0) * -1em));
  transition:transform 1.05s var(--ease);transition-delay:calc(var(--i,0) * 55ms)}
.odo .reel i{height:1em;line-height:1;font-style:normal;text-align:center}
.odo .sep{width:.26em;text-align:center;color:var(--ink3)}
.odo-unit{font-family:var(--han);font-size:14px;color:var(--ink3);
  letter-spacing:.28em;padding-bottom:.7em;margin-left:.35em}
.odo-note{padding:8px 22px 0;font-size:12.5px;color:var(--ink3);min-height:19px;letter-spacing:.01em}

.update{margin:16px 22px 0;height:46px;border-radius:14px;background:var(--accent);
  color:#fff;font-size:15px;font-weight:600;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .18s var(--ease),filter .18s}
.update:active{transform:scale(.975);filter:brightness(.93)}
@media (prefers-color-scheme:dark){.update{color:#14171B}}

/* ---------- 里程帶 ---------- */
.strip{padding:26px 22px 0}
.strip-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);
  letter-spacing:.08em;margin-bottom:7px}
.strip-track{position:relative;height:3px;border-radius:2px;background:var(--line);margin:14px 0 10px}
.strip-fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent);
  transition:width 1s var(--ease)}
.strip-track.warn .strip-fill{background:var(--amber)}
.strip-track.over .strip-fill{background:var(--brick)}
.strip-dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;
  background:var(--accent);border:3px solid var(--card);
  transform:translate(-50%,-50%);transition:left 1s var(--ease);
  box-shadow:0 0 0 1px var(--line)}
.strip-track.warn .strip-dot{background:var(--amber)}
.strip-track.over .strip-dot{background:var(--brick)}
.strip-dot.est{background:var(--card);box-shadow:0 0 0 2px var(--accent) inset,0 0 0 1px var(--line)}
.strip-track.warn .strip-dot.est{box-shadow:0 0 0 2px var(--amber) inset,0 0 0 1px var(--line)}
.strip-track.over .strip-dot.est{box-shadow:0 0 0 2px var(--brick) inset,0 0 0 1px var(--line)}
.strip-nums{display:flex;justify-content:space-between;font-family:var(--num);font-weight:300;
  font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ---------- 唯一要注意的一件事 ---------- */
.focus{padding:22px 22px 0}
.focus-eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--ink3);margin-bottom:8px}
.focus-eyebrow.warn{color:var(--amber)}
.focus-eyebrow.over{color:var(--brick)}
.focus-main{font-size:23px;font-weight:600;letter-spacing:.005em;line-height:1.3;margin:0}
.focus-main .n{font-family:var(--num);font-weight:400;font-size:1.12em;letter-spacing:0}
.focus-sub{margin:7px 0 0;font-size:14px;color:var(--ink2);line-height:1.55}

.card-foot{margin-top:auto;padding:6px 22px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column}
.foot-btn{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink2);
  border-top:1px solid var(--line2);padding:16px 0;width:100%;justify-content:space-between}
.foot-btn .chev{color:var(--ink3)}
.foot-btn .thumb{width:26px;height:26px;border-radius:8px;object-fit:cover;flex:0 0 auto;
  box-shadow:0 0 0 1px var(--line2)}
.dotmark{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;
  margin-left:1px;vertical-align:middle}

/* 新增車輛卡 */
.card.add{align-items:center;justify-content:center;gap:14px;
  background:none;box-shadow:none;border:1.5px dashed var(--line);color:var(--ink3);min-height:60vh}
.card.add .plus{font-size:34px;font-weight:200;font-family:var(--num);line-height:1}

/* 頁點 */
.dots{display:flex;justify-content:center;gap:7px;padding:12px 0 18px;flex:0 0 auto}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s,width .3s}
.dot.on{background:var(--ink3);width:16px}

/* ---------- 空狀態 ---------- */
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 34px 12vh;gap:14px}
.empty h2{margin:0;font-size:26px;font-weight:600;letter-spacing:.01em}
.empty p{margin:0;color:var(--ink2);font-size:15.5px;line-height:1.65}
.empty button{margin-top:12px;align-self:flex-start;background:var(--ink);color:var(--paper);
  padding:13px 24px;border-radius:14px;font-size:15px;font-weight:600}

/* ---------- 底部面板 ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,13,17,.42);opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease);z-index:40;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:26px 26px 0 0;transform:translateY(101%);
  transition:transform .42s var(--ease);max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px -12px rgba(10,13,17,.35)}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 0;flex:0 0 auto}
.sheet-head{padding:16px 22px 6px;flex:0 0 auto}
.sheet-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:.01em}
.sheet-head p{margin:5px 0 0;font-size:13.5px;color:var(--ink3)}
.sheet-body{overflow-y:auto;padding:12px 22px calc(20px + env(safe-area-inset-bottom,0px));
  -webkit-overflow-scrolling:touch}

/* ---------- 數字鍵盤 ---------- */
.pad-display{text-align:center;padding:14px 22px 2px;font-family:var(--num);font-weight:300;
  font-size:clamp(50px,15vw,70px);line-height:1.1;font-variant-numeric:tabular-nums;
  letter-spacing:.01em}
.pad-display.dim{color:var(--ink3)}
.pad-hint{text-align:center;font-size:13px;color:var(--ink3);min-height:38px;padding:2px 26px 0;line-height:1.45}
.pad-hint.warn{color:var(--amber)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px 18px 0}
.key{height:56px;border-radius:15px;background:var(--line2);font-family:var(--num);font-weight:300;
  font-size:27px;display:grid;place-items:center;transition:transform .12s var(--ease),background .12s}
.key:active{transform:scale(.94);background:var(--line)}
.key.fn{font-family:var(--han);font-size:15px;font-weight:500;color:var(--ink2);background:none}
.pad-actions{display:flex;gap:10px;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px))}
.btn{flex:1;height:50px;border-radius:15px;font-size:15.5px;font-weight:600;letter-spacing:.04em;
  display:grid;place-items:center;transition:transform .16s var(--ease),filter .16s}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#14171B}}
.btn.ghost{background:var(--line2);color:var(--ink2);flex:0 0 34%}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- 項目清單 ---------- */
.item{display:block;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.item-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.item-name{font-size:15.5px;font-weight:500}
.item-left{font-size:14px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.item-left .n{font-family:var(--num);font-weight:400;font-size:1.1em}
.item-left.warn{color:var(--amber)}
.item-left.over{color:var(--brick);font-weight:600}
.item-left.unknown{color:var(--ink3)}
.mini{position:relative;height:2px;border-radius:1px;background:var(--line);margin-top:11px}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:1px;background:var(--accent);display:block}
.mini.warn i{background:var(--amber)} .mini.over i{background:var(--brick)}
.mini.unknown{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.sec-label{font-size:11.5px;letter-spacing:.16em;color:var(--ink3);margin:26px 0 4px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;
  border-bottom:1px solid var(--line2)}
.toggle-row:last-child{border-bottom:0}
.toggle-row span{font-size:15px}
.toggle-row small{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.sw{width:47px;height:29px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto;
  transition:background .25s var(--ease)}
.sw i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--card);
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw.on{background:var(--accent)} .sw.on i{transform:translateX(18px)}

/* ---------- 表單 ---------- */
.field{margin:16px 0 0}
.field label{display:block;font-size:12px;letter-spacing:.12em;color:var(--ink3);margin-bottom:7px}
.field input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);
  background:var(--line2);padding:0 15px;font-size:16px}
.field input:focus{outline:none;border-color:var(--accent);background:var(--card)}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:46px;border-radius:14px;border:1px solid var(--line);font-size:15px;
  color:var(--ink2);transition:all .2s var(--ease)}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.paints{display:flex;flex-wrap:wrap;gap:11px}
.pchip{width:38px;height:38px;border-radius:12px;position:relative;border:1px solid var(--line);
  transition:transform .18s var(--ease)}
.pchip.on{transform:scale(1.06)}
.pchip.on::after{content:'';position:absolute;inset:-4px;border-radius:15px;border:2px solid var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.quick button{padding:11px 15px;border-radius:13px;border:1px solid var(--line);font-size:14.5px;
  color:var(--ink2)}
.quick button:active{background:var(--line2)}
.danger{color:var(--brick);font-size:14.5px;padding:14px 0;display:block;width:100%;text-align:left}
.about{font-size:13px;color:var(--ink3);line-height:1.7;margin-top:22px}

/* ---------- 進廠紀錄 ---------- */
.rec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.add-rec{background:var(--accent);color:#fff;width:44px;height:44px;border-radius:14px;flex:0 0 auto;margin-top:2px}
@media (prefers-color-scheme:dark){.add-rec{color:#14171B}}
.add-rec:active{transform:scale(.94)}
.rec-empty{padding:30px 2px 10px;text-align:center;color:var(--ink3);font-size:14.5px;line-height:1.7}
.rec-empty button{margin-top:14px;display:inline-block;background:var(--accent);color:#fff;
  padding:12px 22px;border-radius:14px;font-size:14.5px;font-weight:600}
@media (prefers-color-scheme:dark){.rec-empty button{color:#14171B}}
.rec-month{font-size:11.5px;letter-spacing:.16em;color:var(--ink3);margin:22px 0 4px}
.rec-month:first-child{margin-top:2px}
.rec-row{display:flex;gap:13px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line2)}
.rec-row:last-child{border-bottom:0}
.rec-thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:0 0 auto;box-shadow:0 0 0 1px var(--line2)}
.rec-thumb.ph{display:grid;place-items:center;background:var(--line2);color:var(--ink3);font-size:19px}
.rec-info{flex:1;min-width:0}
.rec-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rec-date{font-size:15px;font-weight:600}
.rec-km{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.rec-km .n{font-family:var(--num)}
.rec-meta{font-size:13px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rec-chip{font-size:11.5px;color:var(--ink2);background:var(--line2);padding:3px 9px;border-radius:8px}

/* ---------- 單筆紀錄編輯：照片 ---------- */
.photo-box{position:relative;border-radius:18px;overflow:hidden;background:var(--line2);
  aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;margin-top:4px}
.photo-box img{width:100%;height:100%;object-fit:cover;display:block}
.photo-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink3);
  padding:20px;text-align:center}
.photo-empty svg{opacity:.6}
.photo-empty span{font-size:13.5px}
.photo-swap{position:absolute;right:10px;bottom:10px;background:rgba(20,23,27,.55);
  backdrop-filter:blur(6px);color:#fff;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center}
.photo-swap:active{transform:scale(.93)}

/* ---------- 項目 chip 多選 ---------- */
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:12px;border:1px solid var(--line);font-size:14px;
  color:var(--ink2);transition:all .18s var(--ease)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}

.field textarea{width:100%;min-height:76px;border-radius:14px;border:1px solid var(--line);
  background:var(--line2);padding:12px 15px;font-size:15px;font-family:var(--han);resize:vertical}
.field textarea:focus{outline:none;border-color:var(--accent);background:var(--card)}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="top">
    <h1>車庫</h1>
    <button class="icon-btn" id="btnSettings" aria-label="設定">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
  <div id="main"></div>
</div>

<div class="scrim" id="scrim"></div>

<!-- 更新里程 -->
<section class="sheet" id="shPad" aria-hidden="true">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="padTitle">現在的里程</h2></div>
  <div class="pad-display" id="padDisp">0</div>
  <div class="pad-hint" id="padHint"></div>
  <div class="pad">
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <button class="key fn" data-k="clear">清除</button><button class="key" data-k="0">0</button>
    <button class="key fn" data-k="del" aria-label="刪除">⌫</button>
  </div>
  <div class="pad-actions">
    <button class="btn ghost" data-close>取消</button>
    <button class="btn primary" id="padSave">存起來</button>
  </div>
</section>

<script>
'use strict';
/* ============================================================
   資料
   ============================================================ */
const DB_NAME='garage_v1', DB_VER=2;
let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('vehicles')) d.createObjectStore('vehicles',{keyPath:'id'});
      if(!d.objectStoreNames.contains('items')){
        const s=d.createObjectStore('items',{keyPath:'id'}); s.createIndex('v','vehicleId');
      }
      if(!d.objectStoreNames.contains('logs')){
        const s=d.createObjectStore('logs',{keyPath:'id'}); s.createIndex('v','vehicleId');
      }
      if(!d.objectStoreNames.contains('records')){
        const s=d.createObjectStore('records',{keyPath:'id'}); s.createIndex('v','vehicleId');
      }
    };
    r.onsuccess=e=>{db=e.target.result;res(db)};
    r.onerror=e=>rej(e.target.error);
  });
}
const tx=(name,mode)=>db.transaction(name,mode).objectStore(name);
const put=(name,val)=>new Promise((res,rej)=>{const q=tx(name,'readwrite').put(val);q.onsuccess=()=>res(val);q.onerror=()=>rej(q.error)});
const del=(name,key)=>new Promise((res,rej)=>{const q=tx(name,'readwrite').delete(key);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
const all=(name)=>new Promise((res,rej)=>{const q=tx(name,'readonly').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)});
const clearStore=(name)=>new Promise((res,rej)=>{const q=tx(name,'readwrite').clear();q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- 內建保養項目 ---------- */
const PRESETS={
  car:[
    {key:'oil',         name:'機油',        km:5000,  mo:6,   core:true},
    {key:'oilfilter',   name:'機油芯',      km:10000, mo:12,  core:true},
    {key:'airfilter',   name:'空氣濾清器',  km:20000, mo:24,  core:true},
    {key:'cabinfilter', name:'冷氣濾網',    km:15000, mo:12,  core:true},
    {key:'brakepad',    name:'煞車來令片',  km:30000, mo:null,core:true},
    {key:'tire',        name:'輪胎',        km:50000, mo:60,  core:true},
    {key:'battery',     name:'電瓶',        km:null,  mo:30,  core:true},
    {key:'brakefluid',  name:'煞車油',      km:40000, mo:24,  core:false},
    {key:'atf',         name:'變速箱油',    km:40000, mo:48,  core:false},
    {key:'coolant',     name:'水箱精',      km:60000, mo:48,  core:false},
    {key:'plug',        name:'火星塞',      km:40000, mo:null,core:false},
    {key:'wiper',       name:'雨刷',        km:null,  mo:12,  core:false},
    {key:'inspect',     name:'定期驗車',    km:null,  mo:12,  core:false},
  ],
  moto:[
    {key:'oil',        name:'機油',        km:1500,  mo:3,   core:true},
    {key:'gearoil',    name:'齒輪油',      km:3000,  mo:6,   core:true},
    {key:'airfilter',  name:'空氣濾清器',  km:5000,  mo:12,  core:true},
    {key:'plug',       name:'火星塞',      km:5000,  mo:12,  core:true},
    {key:'belt',       name:'傳動皮帶',    km:10000, mo:24,  core:true},
    {key:'brakepad',   name:'煞車來令片',  km:10000, mo:null,core:true},
    {key:'tire',       name:'輪胎',        km:15000, mo:36,  core:true},
    {key:'battery',    name:'電瓶',        km:null,  mo:24,  core:true},
    {key:'roller',     name:'普利珠與滑件',km:10000, mo:null,core:false},
    {key:'brakefluid', name:'煞車油',      km:20000, mo:24,  core:false},
    {key:'coolant',    name:'水箱精',      km:20000, mo:24,  core:false},
    {key:'inspect',    name:'定期驗車',    km:null,  mo:24,  core:false},
  ]
};

/* ---------- 車漆 ---------- */
const PAINTS=[
  {id:'pearl', name:'珍珠白', chip:'#F3F5F7', l:'#7C93A8', d:'#9DB4C9'},
  {id:'silver',name:'銀',     chip:'#C6CCD2', l:'#8A98A4', d:'#A9B6C1'},
  {id:'gray',  name:'鐵灰',   chip:'#6E7883', l:'#5C6672', d:'#8892A0'},
  {id:'black', name:'曜石黑', chip:'#25292E', l:'#3B4149', d:'#79828E'},
  {id:'red',   name:'紅',     chip:'#B8443A', l:'#A83A32', d:'#D4655A'},
  {id:'blue',  name:'藍',     chip:'#33689B', l:'#2F6090', d:'#5A93C8'},
  {id:'green', name:'綠',     chip:'#43755A', l:'#3E6B52', d:'#6BA084'},
  {id:'orange',name:'橘',     chip:'#C56E2E', l:'#B4632A', d:'#DA9155'},
  {id:'yellow',name:'黃',     chip:'#D8B23A', l:'#9C7C18', d:'#D2AC44'},
  {id:'brown', name:'棕',     chip:'#7A5C47', l:'#6E5340', d:'#A5836A'},
];
const paintOf=id=>PAINTS.find(p=>p.id===id)||PAINTS[0];

/* ============================================================
   計算
   ============================================================ */
const DAY=864e5;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>{const t=new Date(d);t.setHours(0,0,0,0);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/DAY);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function addMonths(d,m){const t=new Date(d);const day=t.getDate();t.setMonth(t.getMonth()+m);
  if(t.getDate()<day) t.setDate(0); return t}

/* 日均里程：有兩筆以上就用實際的，否則用一個保守預設 */
function dailyAvg(v){
  const logs=S.logs.filter(l=>l.vehicleId===v.id).sort((a,b)=>a.date.localeCompare(b.date));
  if(logs.length>=2){
    const a=logs[0], b=logs[logs.length-1];
    const days=daysBetween(a.date,b.date), km=b.km-a.km;
    if(days>=3 && km>0) return clamp(km/days,1,600);
  }
  return v.type==='moto'?18:33;
}
/* 現在大概開到哪 */
function estKm(v){
  const d=Math.max(0,daysBetween(v.odoDate,iso(today())));
  return Math.round(v.odo + dailyAvg(v)*d);
}
const stale=v=>daysBetween(v.odoDate,iso(today()));

/* 一個項目現在的狀態。永遠只回傳一個「還剩多少」。 */
function status(item,v){
  const now=estKm(v), avg=dailyAvg(v), t=today();
  let byKm=null, byTime=null;
  if(item.km && item.lastKm!=null){
    const due=item.lastKm+item.km, left=due-now;
    byKm={kind:'km',left,days:left/avg,from:item.lastKm,due};
  }
  if(item.mo && item.lastDate){
    const due=addMonths(parseISO(item.lastDate),item.mo);
    const days=Math.round((due-t)/DAY);
    byTime={kind:'time',days,due,left:days};
  }
  if(!byKm && !byTime) return {known:false,item};
  const bind=(byKm&&byTime)?(byKm.days<=byTime.days?byKm:byTime):(byKm||byTime);
  const other=(byKm&&byTime)?(bind===byKm?byTime:byKm):null;
  const over=bind.days<0;
  const level=over?'over':(bind.days<=45?'warn':'ok');
  return {known:true,item,bind,other,byKm,byTime,over,level,days:bind.days,now,avg};
}

function leftText(st){
  if(!st.known) return '還不知道';
  const b=st.bind;
  if(b.kind==='km'){
    if(st.over) return '已經超過 <span class="n">'+fmt(-b.left)+'</span> 公里';
    return '還能開 <span class="n">'+fmt(b.left)+'</span> 公里';
  }
  const d=b.days;
  if(st.over) return '已經超過 <span class="n">'+fmt(-d)+'</span> 天';
  if(d<60) return '還剩 <span class="n">'+d+'</span> 天';
  return '還剩 <span class="n">'+Math.round(d/30)+'</span> 個月';
}
function whenText(days){
  if(days<=0) return '已經過了';
  if(days<7) return Math.round(days)+' 天後';
  if(days<60) return '大約 '+Math.round(days/7)+' 週後';
  return '大約 '+Math.round(days/30)+' 個月後';
}
function agoText(days){
  if(days<7) return Math.max(1,Math.round(days))+' 天前';
  if(days<60) return '大約 '+Math.round(days/7)+' 週前';
  return '大約 '+Math.round(days/30)+' 個月前';
}
function fdate(x){return x.getFullYear()+'/'+String(x.getMonth()+1).padStart(2,'0')+'/'+String(x.getDate()).padStart(2,'0')}
function subText(st){
  if(!st.known) return '';
  const b=st.bind;
  if(b.kind==='km'){
    if(st.over) return '照你平常的開法，'+agoText(-b.days)+'就該做了。下次進廠先處理這個。';
    return '照你平常的開法，'+whenText(b.days)+'到。'+(b.days>21?'不急，下次經過保養廠可以順便。':'可以開始安排了。');
  }
  if(st.over) return '到期日是 '+fdate(b.due)+'，已經過了。';
  return '到期日 '+fdate(b.due)+'。';
}
/* 進度百分比：0 = 剛做完，100 = 到期 */
function pct(st){
  if(!st.known) return 0;
  const b=st.bind;
  if(b.kind==='km'){
    const span=st.item.km||1;
    return clamp((span-b.left)/span*100,0,100);
  }
  const span=(st.item.mo||1)*30.4;
  return clamp((span-b.days)/span*100,0,100);
}

/* ============================================================
   狀態
   ============================================================ */
const S={vehicles:[],items:[],logs:[],records:[],idx:0};
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};

async function load(){
  const [v,i,l,r]=await Promise.all([all('vehicles'),all('items'),all('logs'),all('records')]);
  S.vehicles=v.sort((a,b)=>a.order-b.order); S.items=i; S.logs=l; S.records=r;
  if(S.idx>=S.vehicles.length) S.idx=Math.max(0,S.vehicles.length-1);
}
const activeV=()=>S.vehicles[S.idx]||null;
const itemsOf=v=>S.items.filter(i=>i.vehicleId===v.id);
const recordsOf=v=>S.records.filter(r=>r.vehicleId===v.id).sort((a,b)=>b.date===a.date?b.createdAt-a.createdAt:b.date.localeCompare(a.date));

let objURLs=[];
function trackURL(u){ objURLs.push(u); return u }
function revokeURLs(){ objURLs.forEach(u=>URL.revokeObjectURL(u)); objURLs=[] }

function applyAccent(v){
  const p=v?paintOf(v.paint):PAINTS[0];
  document.documentElement.style.setProperty('--accent-l',p.l);
  document.documentElement.style.setProperty('--accent-d',p.d);
}

/* ============================================================
   里程表數字滾輪
   ============================================================ */
function buildOdo(km){
  const s=fmt(km).split('');
  const wrap=el('div','odo');
  const cols=[];
  s.forEach(ch=>{
    if(ch===','){ wrap.appendChild(el('span','sep',',')); return }
    const c=el('span','col');
    const reel=el('span','reel','<i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i>');
    reel.dataset.target=ch;
    c.appendChild(reel); wrap.appendChild(c); cols.push(reel);
  });
  cols.forEach((r,n)=>{ r.style.setProperty('--i', String(cols.length-1-n)); r.style.setProperty('--d','0'); });
  wrap.appendChild(el('span','odo-unit','公里'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    cols.forEach(r=>r.style.setProperty('--d', r.dataset.target));
  }));
  return wrap;
}

/* ============================================================
   畫面
   ============================================================ */
function render(){
  revokeURLs();
  const main=$('#main');
  main.innerHTML='';
  if(!S.vehicles.length){ renderEmpty(main); applyAccent(null); return }
  applyAccent(activeV());

  const rail=el('div','rail'); rail.id='rail';
  S.vehicles.forEach(v=>rail.appendChild(slideFor(v)));
  const add=el('div','slide');
  const addCard=el('div','card add','<div class="plus">＋</div><div>再加一台車</div>');
  addCard.onclick=()=>openVehicle(null);
  add.appendChild(addCard); rail.appendChild(add);
  main.appendChild(rail);

  const dots=el('div','dots');
  for(let i=0;i<S.vehicles.length+1;i++){ const d=el('div','dot'+(i===S.idx?' on':'')); dots.appendChild(d) }
  main.appendChild(dots);

  rail.scrollLeft=S.idx*rail.clientWidth;
  let raf;
  rail.addEventListener('scroll',()=>{
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const i=Math.round(rail.scrollLeft/rail.clientWidth);
      [...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i));
      if(i!==S.idx && i<S.vehicles.length){ S.idx=i; applyAccent(activeV()) }
      else if(i<S.vehicles.length){ S.idx=i }
    });
  },{passive:true});
}

function renderEmpty(main){
  const e=el('div','empty');
  e.innerHTML='<h2>先加一台車。</h2><p>只要告訴我它現在的里程，其他的之後再說。<br>里程是這裡唯一的時鐘 —— 有了它，保養時間才算得出來。</p>';
  const b=el('button',null,'加第一台車'); b.onclick=()=>openVehicle(null);
  e.appendChild(b); main.appendChild(e);
}

function slideFor(v){
  const slide=el('div','slide');
  const card=el('div','card');
  const its=itemsOf(v).filter(i=>i.on);
  const sts=its.map(i=>status(i,v));
  const known=sts.filter(s=>s.known).sort((a,b)=>a.days-b.days);
  const unknown=sts.filter(s=>!s.known);
  const focus=known[0]||null;

  /* 標頭 */
  const head=el('div','card-head');
  const left=el('div');
  const h=el('h3','vname','<span class="paint"></span>'+escapeHtml(v.name));
  left.appendChild(h);
  const sub=[v.type==='moto'?'機車':'汽車']; if(v.plate) sub.push(v.plate.toUpperCase());
  left.appendChild(el('p','vsub',sub.join(' · ')));
  head.appendChild(left);
  const edit=el('button','icon-btn','<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>');
  edit.setAttribute('aria-label','編輯車輛'); edit.onclick=()=>openVehicle(v);
  head.appendChild(edit);
  card.appendChild(head);

  /* 里程表 */
  const ow=el('div','odo-wrap'); ow.appendChild(buildOdo(v.odo)); card.appendChild(ow);
  const st=stale(v);
  let note='';
  if(st===0) note='今天記錄的。';
  else if(st<=3) note=st+' 天前記錄的。';
  else note=st+' 天前記錄 · 現在估計 '+fmt(estKm(v))+' 公里';
  card.appendChild(el('div','odo-note',note));

  const upd=el('button','update','＋　更新里程'); upd.onclick=()=>openPad(v); card.appendChild(upd);

  /* 唯一要注意的一件事 */
  const f=el('div','focus');
  if(!focus){
    f.innerHTML='<div class="focus-eyebrow">還沒有基準</div>'+
      '<p class="focus-main">先告訴我幾個項目上次是什麼時候做的。</p>'+
      '<p class="focus-sub">有了基準，我才能幫你算下一次。大概就好，不用精確。</p>';
  }else if(focus.level==='ok'){
    f.innerHTML='<div class="focus-eyebrow">目前</div>'+
      '<p class="focus-main">一切正常。</p>'+
      '<p class="focus-sub">下一個是'+escapeHtml(focus.item.name)+'，'+leftText(focus)+'。</p>';
  }else{
    const cls=focus.level;
    f.innerHTML='<div class="focus-eyebrow '+cls+'">'+(focus.over?'已經過期':'該注意了')+'</div>'+
      '<p class="focus-main">'+escapeHtml(focus.item.name)+'　'+leftText(focus)+'</p>'+
      '<p class="focus-sub">'+subText(focus)+'</p>';
  }
  card.appendChild(f);

  /* 里程帶 —— 緊跟著它所屬的那個項目 */
  if(focus && focus.bind.kind==='km') card.appendChild(stripEl(focus,v));
  else if(focus) card.appendChild(stripTime(focus,v));

  /* 底部 */
  const foot=el('div','card-foot');
  const n=known.length+unknown.length;
  let txt;
  if(!n) txt='還沒有追蹤任何項目';
  else if(!focus) txt=n+' 個項目等著設定基準';
  else txt='另外 '+Math.max(0,n-1)+' 項在追蹤中';
  const fb=el('button','foot-btn','<span>'+txt+(unknown.length&&focus?' <span class="dotmark"></span>':'')+'</span><span class="chev">›</span>');
  fb.onclick=()=>openItems(v);
  foot.appendChild(fb);

  const recs=recordsOf(v);
  const rtxt=recs.length?recs.length+' 筆進廠紀錄':'還沒有任何紀錄';
  const latest=recs[0];
  const rb=el('button','foot-btn');
  const rleft=el('span','','');
  rleft.style.cssText='display:inline-flex;align-items:center;gap:9px';
  if(latest && latest.photo){
    const url=trackURL(URL.createObjectURL(latest.photo));
    const img=document.createElement('img'); img.className='thumb'; img.src=url;
    rleft.appendChild(img);
  }
  rleft.appendChild(el('span',null,rtxt));
  rb.appendChild(rleft);
  rb.appendChild(el('span','chev','›'));
  rb.onclick=()=>openRecords(v);
  foot.appendChild(rb);
  card.appendChild(foot);

  slide.appendChild(card); return slide;
}

function stripEl(st,v){
  const w=el('div','strip');
  const p=pct(st);
  w.innerHTML=
    '<div class="strip-cap"><span>上次'+escapeHtml(st.item.name)+'</span><span>下次該做</span></div>'+
    '<div class="strip-track '+(st.level==='ok'?'':st.level)+'">'+
      '<div class="strip-fill" style="width:'+p+'%"></div>'+
      '<div class="strip-dot'+(stale(v)>0?' est':'')+'" style="left:'+p+'%"></div>'+
    '</div>'+
    '<div class="strip-nums"><span>'+fmt(st.bind.from)+'</span><span>'+fmt(st.bind.due)+'</span></div>';
  return w;
}
function stripTime(st,v){
  const w=el('div','strip');
  const p=pct(st);
  const d=st.bind.due;
  const from=addMonths(d,-(st.item.mo||1));
  const fd=x=>x.getFullYear()+'/'+String(x.getMonth()+1).padStart(2,'0');
  w.innerHTML=
    '<div class="strip-cap"><span>上次'+escapeHtml(st.item.name)+'</span><span>下次該做</span></div>'+
    '<div class="strip-track '+(st.level==='ok'?'':st.level)+'">'+

    '</div>'+
    '<div class="strip-nums"><span>'+fd(from)+'</span><span>'+fd(d)+'</span></div>';
  return w;
}

let openSheets=[];
function sheetOpen(id){

function sheetClose(id){

  openSheets=openSheets.filter(x=>$(x)!==s);

function paintPad(){
  const d=$('#padDisp'), h=$('#padHint');
  const n=padBuf===''?0:parseInt(padBuf,10);
  d.textContent=padBuf===''?'0':fmt(n);
  d.classList.toggle('dim',padPrefilled||padBuf==='');
  h.classList.remove('warn');
  if(padPrefilled){
    const s=stale(padV);
    h.textContent=s===0?'這是你今天記的數字，改一下就好。'
      :'照你平常的開法估的（'+s+' 天前記錄 '+fmt(padV.odo)+'）。對的話直接存。';
  }else if(padBuf!=='' && n<padV.odo){
    h.textContent='比上次記錄的 '+fmt(padV.odo)+' 還少。是補登舊資料嗎？還是可以存。';
    h.classList.add('warn');
  }else if(padBuf!==''){
    const diff=n-padV.odo, d2=stale(padV);
    if(d2>0) h.textContent='距離上次記錄開了 '+fmt(diff)+' 公里，'+d2+' 天。';
    else if(diff>0) h.textContent='比今天稍早記的多 '+fmt(diff)+' 公里。';
    else h.textContent='';
  }else h.textContent='';
  $('#padSave').toggleAttribute('disabled',padBuf==='');
}
document.querySelectorAll('#shPad .key').forEach(k=>{
  k.onclick=()=>{

    if(v==='del'){ if(padPrefilled){padBuf='';padPrefilled=false} else padBuf=padBuf.slice(0,-1) }
    else if(v==='clear'){ padBuf=''; padPrefilled=false }
    else if(padBuf.length<8) padBuf=(padBuf==='0'?'':padBuf)+v;
    paintPad();
  };
});

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const maxDim=1400;
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){
          if(w>h){h=Math.round(h*maxDim/w);w=maxDim} else {w=Math.round(w*maxDim/h);h=maxDim}
        }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('encode failed')),'image/jpeg',0.82);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

      await del('vehicles',v.id);
      closeAll(); S.idx=0; await load(); render();
    };
    body.appendChild(rm);
  }
  sheetOpen('#shVeh');
}
async function saveVehicle(){
  const name=$('#vName').value.trim()||'我的車';
  const odo=parseInt($('#vOdo').value,10);
  if(isNaN(odo)){ $('#vOdo').focus(); $('#vOdo').style.borderColor='var(--brick)'; return }
  const plate=$('#vPlate').value.trim();
  const day=iso(today());
  if(vehEdit){
    vehEdit.name=name; vehEdit.paint=vehPaint; vehEdit.plate=plate;
    if(odo!==vehEdit.odo){ vehEdit.odo=odo; vehEdit.odoDate=day;
      const ex=S.logs.find(l=>l.vehicleId===vehEdit.id&&l.date===day);
      if(ex){ex.km=odo;await put('logs',ex)} else await put('logs',{id:uid(),vehicleId:vehEdit.id,km:odo,date:day});
    }
    await put('vehicles',vehEdit);
  }else{
    const v={id:uid(),name,type:vehType,paint:vehPaint,plate,odo,odoDate:day,order:S.vehicles.length,createdAt:day};
    await put('vehicles',v);
    await put('logs',{id:uid(),vehicleId:v.id,km:odo,date:day});
    for(const p of PRESETS[vehType]){
      await put('items',{id:uid(),vehicleId:v.id,key:p.key,name:p.name,km:p.km,mo:p.mo,
        lastKm:null,lastDate:null,on:p.core});
    }
    S.idx=S.vehicles.length;
  }
  closeAll(); await load(); render();
}

function blobToDataURL(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob) });
}
function dataURLToBlob(url){
  const [head,b64]=url.split(','); const mime=head.match(/:(.*?);/)[1];
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function exportData(){
  const records=await Promise.all(S.records.map(async r=>{
    const {photo,...rest}=r;
    return {...rest, photoData: photo?await blobToDataURL(photo):null};
  }));
  const data={app:'garage',version:2,exportedAt:new Date().toISOString(),
    vehicles:S.vehicles,items:S.items,logs:S.logs,records};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='車庫備份-'+iso(today())+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('#fileIn').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!d.vehicles) throw new Error('格式不對');
    if(!confirm('匯入會覆蓋現在的全部資料。要繼續嗎？')) return;
    await clearStore('vehicles'); await clearStore('items'); await clearStore('logs'); await clearStore('records');
    for(const v of d.vehicles) await put('vehicles',v);
    for(const i of (d.items||[])) await put('items',i);
    for(const l of (d.logs||[])) await put('logs',l);
    for(const r of (d.records||[])){
      const {photoData,...rest}=r;
      await put('records',{...rest, photo: photoData?dataURLToBlob(photoData):null});
    }
    closeAll(); S.idx=0; await load(); render();
  }catch(err){ alert('這個檔案讀不出來。請確認是「車庫」匯出的備份檔。') }
  e.target.value='';
};
