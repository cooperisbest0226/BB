/* ================= Phase 2: Calendar ================= */
const DOW = ['日','一','二','三','四','五','六'];
const ymOf = iso => iso.slice(0, 7);
function monthCells(ym){
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(first);
  start.setDate(1 - first.getDay());
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    cells.push(d.toISOString().slice(0, 10));
    if (i >= 34 && cells[i].slice(0, 7) !== ym && cells[34].slice(0, 7) !== ym) break;
  }
  return cells.length > 35 && cells.slice(35).every(c => c.slice(0, 7) !== ym) ? cells.slice(0, 35) : cells;
}
function shiftMonth(ym, n){
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function calChip(t){
  const p = t.projectId ? projectById(t.projectId) : null;
  const done = t.status === 'done';
  const over = isOverdue(t);
  const color = p ? safeColor(p.color) : 'var(--text-3)';
  return `<div class="calchip${done ? ' is-done' : ''}${over ? ' is-over' : ''}" draggable="true" data-calchip="${t.id}" title="${esc(t.title)}">
    <span class="calchip-dot" style="background:${done ? 'var(--success)' : color}"></span>
    <span class="calchip-text">${esc(t.title)}</span>
  </div>`;
}
function renderCalendar(){
  const ym = S.calMonth;
  const cells = monthCells(ym);
  const today = todayISO();
  const byDay = {};
  for (const t of S.tasks) if (t.dueDate) (byDay[t.dueDate] ||= []).push(t);
  for (const k in byDay) byDay[k].sort((a, b) => (a.status === 'done') - (b.status === 'done'));

  const unscheduled = S.tasks.filter(t => !t.dueDate && t.status !== 'done');
  const [yy, mm] = ym.split('-');
  const monthTasks = S.tasks.filter(t => t.dueDate && ymOf(t.dueDate) === ym);
  const monthDone = monthTasks.filter(t => t.status === 'done').length;

  const weeks = cells.map(iso => {
    const d = new Date(iso + 'T00:00:00');
    const items = byDay[iso] || [];
    const other = iso.slice(0, 7) !== ym;
    const wknd = d.getDay() === 0 || d.getDay() === 6;
    const shown = items.slice(0, 3);
    return `<div class="cal-day${other ? ' other' : ''}${iso === today ? ' today' : ''}${wknd ? ' weekend' : ''}" data-calday="${iso}">
      <span class="cal-date num">${d.getDate()}</span>
      ${shown.map(calChip).join('')}
      ${items.length > 3 ? `<button class="cal-more" type="button" data-calmore="${iso}">還有 ${items.length - 3} 件</button>` : ''}
    </div>`;
  }).join('');

  const sel = S.calSelectedDay;
  const selItems = sel ? (byDay[sel] || []) : [];

  return `
  <div class="cal-head">
    <h2 class="cal-month num">${yy} 年 ${Number(mm)} 月</h2>
    <div class="cal-nav">
      <button class="btn btn-icon" type="button" data-calnav="-1" aria-label="上個月">${icon('chevronLeft')}</button>
      <button class="btn btn-sm" type="button" data-calnav="0">今天</button>
      <button class="btn btn-icon" type="button" data-calnav="1" aria-label="下個月">${icon('chevronRight')}</button>
    </div>
    <span style="margin-left:auto;font-size:12.5px;color:var(--text-3)" class="num">本月 ${monthDone} / ${monthTasks.length} 項完成</span>
  </div>
  <div class="cal-layout">
    <div>
      <div class="cal-grid">
        <div class="cal-dow">${DOW.map(d => `<span>${d}</span>`).join('')}</div>
        <div class="cal-weeks">${weeks}</div>
      </div>
      <div class="cal-daylist">
        ${sel ? `<div class="sec-head"><h3 class="sec-title">${Number(sel.slice(5,7))} 月 ${Number(sel.slice(8))} 日</h3>
          <button class="sec-link" type="button" data-calday-clear>清除</button></div>
          <div class="panel">${selItems.length
            ? `<ul>${selItems.map(t => taskRow(t)).join('')}</ul>`
            : `<div class="empty"><p class="empty-text">這天沒有任務</p></div>`}</div>`
        : `<p style="font-size:12.5px;color:var(--text-3);text-align:center">點某一天看當天的任務</p>`}
      </div>
    </div>
    <div class="tray" id="calTray">
      <p class="tray-title">未排程</p>
      <p class="tray-hint">${unscheduled.length ? '拖到日期上就排進去了，拖回這裡則取消日期。' : '所有未完成的任務都有日期了。'}</p>
      ${unscheduled.map(t => {
        const p = t.projectId ? projectById(t.projectId) : null;
        return `<div class="tray-item" draggable="true" data-calchip="${t.id}">
          <span class="calchip-dot" style="background:${p ? safeColor(p.color) : 'var(--text-3)'}"></span>
          <span>${esc(t.title)}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function bindCalendar(host){
  let dragId = null;
  const setDrag = el => {
    el.addEventListener('dragstart', e => {
      dragId = el.dataset.calchip;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
    });
    el.addEventListener('dragend', () => { dragId = null; el.classList.remove('dragging'); });
  };
  host.querySelectorAll('[data-calchip]').forEach(setDrag);

  const reschedule = async (id, date) => {
    const t = S.tasks.find(x => x.id === id);
    if (!t || t.dueDate === date) return;
    t.dueDate = date;
    await saveTask(t);
    render();
    toast(date ? `已排到 ${dueLabel(date)}` : '已移回未排程');
  };

  host.querySelectorAll('.cal-day').forEach(cell => {
    cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('dragover'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('dragover'));
    cell.addEventListener('drop', e => {
      e.preventDefault(); cell.classList.remove('dragover');
      const id = dragId || e.dataTransfer.getData('text/plain');
      if (id) reschedule(id, cell.dataset.calday);
    });
  });
  const tray = host.querySelector('#calTray');
  if (tray) {
    tray.addEventListener('dragover', e => { e.preventDefault(); tray.classList.add('dragover'); });
    tray.addEventListener('dragleave', () => tray.classList.remove('dragover'));
    tray.addEventListener('drop', e => {
      e.preventDefault(); tray.classList.remove('dragover');
      const id = dragId || e.dataTransfer.getData('text/plain');
      if (id) reschedule(id, null);
    });
  }
}

/* ================= Phase 2: Timeline ================= */
function tlRange(p){
  const span = S.tlSpan;
  const anchor = S.tlAnchor || todayISO();
  if (span === 'week') {
    const d = new Date(anchor + 'T00:00:00');
    const start = addDays(anchor, -d.getDay());
    return {start, days: 14, label: `${start.slice(5).replace('-','/')} – ${addDays(start, 13).slice(5).replace('-','/')}`};
  }
  const ym = ymOf(anchor);
  const [y, m] = ym.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  return {start: `${ym}-01`, days, label: `${y} 年 ${m} 月`};
}
function renderTimeline(p){
  const {start, days, label} = tlRange(p);
  const end = addDays(start, days - 1);
  const today = todayISO();
  const all = tasksOf(p.id);
  const dated = all.filter(t => t.dueDate || t.startDate);
  const undated = all.filter(t => !t.dueDate && !t.startDate);

  const inRange = dated.filter(t => {
    const s = t.startDate || t.dueDate;
    const e = t.dueDate || t.startDate;
    return !(e < start || s > end);
  }).sort((a, b) => (a.startDate || a.dueDate).localeCompare(b.startDate || b.dueDate));

  const cols = `140px repeat(${days}, minmax(20px, 1fr))`;
  const axis = Array.from({length: days}, (_, i) => {
    const iso = addDays(start, i);
    const d = new Date(iso + 'T00:00:00');
    const wknd = d.getDay() === 0 || d.getDay() === 6;
    return `<div class="tl-axis-label${iso === today ? ' is-today' : ''}${wknd ? ' is-weekend' : ''}">
      ${days > 20 ? d.getDate() : `${DOW[d.getDay()]}<br>${d.getDate()}`}
    </div>`;
  }).join('');

  const todayIdx = (today >= start && today <= end) ? Math.round((new Date(today) - new Date(start)) / 86400000) : -1;
  const todayLine = todayIdx >= 0
    ? `<div class="tl-today" style="left:calc(${(todayIdx + 0.5) / days * 100}%)"></div>` : '';

  const rows = inRange.map(t => {
    const s = t.startDate && t.startDate >= start ? t.startDate : (t.startDate ? start : (t.dueDate < start ? start : t.dueDate));
    const e = t.dueDate && t.dueDate <= end ? t.dueDate : (t.dueDate ? end : s);
    const si = Math.max(0, Math.round((new Date(s) - new Date(start)) / 86400000));
    const ei = Math.min(days - 1, Math.round((new Date(e) - new Date(start)) / 86400000));
    const span = Math.max(1, ei - si + 1);
    const milestone = span === 1 && !t.startDate;
    const done = t.status === 'done';
    const color = isOverdue(t) ? 'var(--danger)' : done ? 'var(--success)' : safeColor(p.color);
    const cells = Array.from({length: days}, (_, i) => {
      const d = new Date(addDays(start, i) + 'T00:00:00');
      const wknd = d.getDay() === 0 || d.getDay() === 6;
      return `<div class="tl-cell${wknd ? ' is-weekend' : ''}"></div>`;
    }).join('');
    const left = si / days * 100;
    const width = span / days * 100;
    return `<div class="tl-row" style="grid-template-columns:${cols}">
      <div class="tl-name${done ? ' is-done' : ''}" title="${esc(t.title)}">${esc(t.title)}</div>
      <div class="tl-cells" style="grid-column:2 / -1;grid-template-columns:repeat(${days}, minmax(20px,1fr))">
        ${cells}
        <div class="tl-bar${done ? ' is-done' : ''}${milestone ? ' is-milestone' : ''}"
             style="left:${milestone ? `calc(${left}% + ${(width / 2)}% - 8px)` : `${left}%`};width:${width}%;background:${color}"
             data-task="${t.id}" title="${esc(t.title)}">${milestone || span < 3 ? '' : esc(t.title)}</div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="tl-head">
    <div class="seg">
      <button type="button" data-tlspan="week" aria-pressed="${S.tlSpan === 'week'}">兩週</button>
      <button type="button" data-tlspan="month" aria-pressed="${S.tlSpan === 'month'}">月</button>
    </div>
    <div class="cal-nav">
      <button class="btn btn-icon" type="button" data-tlnav="-1" aria-label="上一段">${icon('chevronLeft')}</button>
      <button class="btn btn-sm" type="button" data-tlnav="0">今天</button>
      <button class="btn btn-icon" type="button" data-tlnav="1" aria-label="下一段">${icon('chevronRight')}</button>
    </div>
    <span class="tl-range num" style="margin-left:4px">${label}</span>
  </div>
  ${inRange.length ? `<div class="tl-scroll"><div class="tl-inner" style="position:relative">
    <div class="tl-axis" style="grid-template-columns:${cols}">
      <div class="tl-axis-label" style="border-left:none"></div>${axis}
      ${todayLine ? `<div class="tl-today" style="left:calc(140px + (100% - 140px) * ${(todayIdx + 0.5) / days})"></div>` : ''}
    </div>
    ${rows}
  </div></div>
  <div class="tl-legend">
    <span><i style="background:${safeColor(p.color)}"></i>進行中</span>
    <span><i style="background:var(--success)"></i>已完成</span>
    <span><i style="background:var(--danger)"></i>逾期</span>
    <span><i style="background:${safeColor(p.color)};transform:rotate(45deg);width:9px;height:9px"></i>單日到期</span>
  </div>`
  : `<div class="panel"><div class="empty"><p class="empty-title">這段期間沒有排程的任務</p><p class="empty-text">用上面的箭頭換一段時間，或在任務詳情裡設定開始日與到期日</p></div></div>`}
  ${undated.length ? `<div style="margin-top:18px">
    <div class="sec-head"><h3 class="sec-title">未排程（${undated.length}）</h3></div>
    <div class="panel"><ul>${undated.map(t => taskRow(t)).join('')}</ul></div>
  </div>` : ''}`;
}

/* ================= Phase 3: stats helpers ================= */
const CHARTS = {};
function destroyCharts(){
  for (const k in CHARTS) { try { CHARTS[k].destroy(); } catch {} delete CHARTS[k]; }
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function completionsByDay(){
  const map = {};
  for (const t of S.tasks) if (t.completedAt) {
    const d = t.completedAt.slice(0, 10);
    map[d] = (map[d] || 0) + 1;
  }
  return map;
}
function streakDays(){
  const map = completionsByDay();
  let n = 0, cur = todayISO();
  if (!map[cur]) cur = addDays(cur, -1);
  while (map[cur]) { n++; cur = addDays(cur, -1); }
  return n;
}
function projectHealth(p){
  const list = tasksOf(p.id);
  if (!list.length) return {level:'idle', label:'尚無任務', pct:0, done:0, total:0, overdue:0};
  const done = list.filter(t => t.status === 'done').length;
  const overdue = list.filter(isOverdue).length;
  const pct = Math.round(done / list.length * 100);
  let level = 'ok', label = '順利';
  if (overdue >= 3) { level = 'risk'; label = `${overdue} 項逾期`; }
  else if (overdue > 0) { level = 'warn'; label = `${overdue} 項逾期`; }
  else if (done === list.length) { level = 'ok'; label = '已完成'; }
  else {
    const stale = list.every(t => (Date.now() - new Date(t.updatedAt)) > 14 * 86400000);
    if (stale) { level = 'idle'; label = '兩週未更新'; }
  }
  return {level, label, pct, done, total:list.length, overdue};
}

/* ---------- heatmap ---------- */
function renderHeatmap(){
  const weeks = 26;
  const map = completionsByDay();
  const today = todayISO();
  const end = addDays(today, 6 - new Date(today + 'T00:00:00').getDay());
  const start = addDays(end, -(weeks * 7 - 1));
  const max = Math.max(1, ...Object.values(map));
  const level = n => !n ? 0 : n >= max * .75 ? 4 : n >= max * .5 ? 3 : n >= max * .25 ? 2 : 1;

  let cells = '', months = '', lastMonth = '';
  for (let w = 0; w < weeks; w++) {
    const wkStart = addDays(start, w * 7);
    const m = wkStart.slice(5, 7);
    months += `<span style="width:11px">${m !== lastMonth ? Number(m) : ''}</span>`;
    lastMonth = m;
  }
  for (let d = 0; d < 7; d++) {
    for (let w = 0; w < weeks; w++) {
      const iso = addDays(start, w * 7 + d);
      const n = map[iso] || 0;
      const future = iso > today;
      const cls = future ? 'future' : n ? `l${level(n)}` : '';
      cells += `<div class="heat-cell ${cls}${iso === today ? ' today' : ''}" style="grid-row:${d + 1};grid-column:${w + 1}"
        title="${iso}：完成 ${n} 項"></div>`;
    }
  }
  const total = Object.entries(map).filter(([k]) => k >= start && k <= today).reduce((a, [, v]) => a + v, 0);
  return `<div class="card">
    <p class="card-title">完成熱力圖</p>
    <p class="card-sub num">近半年共完成 ${total} 項・目前連續 ${streakDays()} 天</p>
    <div class="heat-scroll">
      <div class="heat-months">${months}</div>
      <div class="heat">${cells}</div>
    </div>
    <div class="heat-legend">
      <span>少</span>
      <i class="heat-cell"></i><i class="heat-cell l1"></i><i class="heat-cell l2"></i><i class="heat-cell l3"></i><i class="heat-cell l4"></i>
      <span>多</span>
    </div>
  </div>`;
}

/* ---------- statistics view ---------- */
function renderStats(){
  const total = S.tasks.length;
  const done = S.tasks.filter(t => t.status === 'done').length;
  const rate = total ? Math.round(done / total * 100) : 0;
  const today = todayISO();
  const map = completionsByDay();
  const week = Array.from({length: 7}, (_, i) => map[addDays(today, -i)] || 0).reduce((a, b) => a + b, 0);
  const first = S.tasks.reduce((m, t) => t.createdAt < m ? t.createdAt : m, new Date().toISOString()).slice(0, 10);
  const activeDays = Math.max(1, Math.round((new Date(today) - new Date(first)) / 86400000) + 1);
  const avg = (done / activeDays).toFixed(1);

  if (!total) {
    return `<div class="panel"><div class="empty">
      <p class="empty-title">還沒有資料可以統計</p>
      <p class="empty-text">建立幾筆任務並完成它們，這裡就會長出圖表</p>
      <button class="btn btn-primary" type="button" data-new-task style="margin-top:12px">${icon('plus')}新增任務</button>
    </div></div>`;
  }

  const health = activeProjects().map(p => ({p, h:projectHealth(p)}))
    .sort((a, b) => ({risk:0, warn:1, ok:2, idle:3})[a.h.level] - ({risk:0, warn:1, ok:2, idle:3})[b.h.level]);

  const estTasks = S.tasks.filter(t => t.estimate || t.actual);
  const est = estTasks.reduce((a, t) => a + (t.estimate || 0), 0);
  const act = estTasks.reduce((a, t) => a + (t.actual || 0), 0);

  return `
  <div class="stat-cards">
    <div class="stat"><p class="stat-label">總完成率</p><p class="stat-value num">${rate}%</p><p class="stat-sub num">${done} / ${total} 項</p></div>
    <div class="stat"><p class="stat-label">近 7 天完成</p><p class="stat-value num">${week}</p></div>
    <div class="stat"><p class="stat-label">平均每日完成</p><p class="stat-value num">${avg}</p></div>
    <div class="stat"><p class="stat-label">連續完成天數</p><p class="stat-value num ${streakDays() ? 'is-success' : ''}">${streakDays()}</p></div>
  </div>

  ${renderHeatmap()}

  <div class="chart-grid" style="margin-top:14px">
    <div class="card">
      <p class="card-title">完成趨勢</p>
      <p class="card-sub">近 12 週每週完成的任務數</p>
      <div class="chart-box"><canvas id="chTrend"></canvas></div>
    </div>
    <div class="card">
      <p class="card-title">任務分布</p>
      <p class="card-sub">未完成任務落在哪些專案</p>
      <div class="chart-box"><canvas id="chProject"></canvas></div>
    </div>
    <div class="card">
      <p class="card-title">狀態與優先權</p>
      <p class="card-sub">目前所有任務的組成</p>
      <div class="chart-box"><canvas id="chStatus"></canvas></div>
    </div>
    <div class="card">
      <p class="card-title">工時：預估 vs 實際</p>
      <p class="card-sub">${estTasks.length
        ? `共 ${estTasks.length} 項有填時數・預估 ${est} 小時、實際 ${act} 小時`
        : '還沒有任務填寫時數，在任務詳情裡填了就會出現'}</p>
      <div class="chart-box"><canvas id="chHours"></canvas></div>
    </div>
  </div>

  <div class="card">
    <p class="card-title">專案健康度</p>
    <p class="card-sub">逾期越多越需要注意</p>
    ${health.length ? health.map(({p, h}) => `<div class="health-row">
      <span class="projicon" style="background:${safeColor(p.color)}1a;color:${safeColor(p.color)};width:24px;height:24px;border-radius:7px">${icon(p.icon)}</span>
      <span class="health-name">${esc(p.name)}</span>
      <span class="health-tag ${h.level}">${esc(h.label)}</span>
      <span class="health-bar bar"><span class="bar-fill" style="width:${h.pct}%;background:${safeColor(p.color)}"></span></span>
      <span class="health-pct num">${h.pct}%</span>
    </div>`).join('')
    : `<p style="font-size:12.5px;color:var(--text-3)">還沒有專案</p>`}
  </div>`;
}

function buildCharts(){
  if (typeof Chart === 'undefined' || !S.tasks.length) return;
  destroyCharts();
  const txt = cssVar('--text-2'), muted = cssVar('--text-3'), grid = cssVar('--border');
  const primary = cssVar('--primary'), ok = cssVar('--success'), warn = cssVar('--warning'), danger = cssVar('--danger');
  const anim = reduceMotion() ? false : {duration: 420};
  const base = {
    responsive:true, maintainAspectRatio:false, animation:anim,
    plugins:{legend:{labels:{color:txt, boxWidth:11, boxHeight:11, font:{size:11}, usePointStyle:true, pointStyle:'circle'}}},
  };
  const axes = {
    x:{ticks:{color:muted, font:{size:10.5}}, grid:{display:false}, border:{color:grid}},
    y:{ticks:{color:muted, font:{size:10.5}, precision:0}, grid:{color:grid}, border:{display:false}, beginAtZero:true},
  };
  const map = completionsByDay();
  const today = todayISO();

  /* 1. 近 12 週完成趨勢 */
  const el1 = document.getElementById('chTrend');
  if (el1) {
    const labels = [], data = [];
    const thisWeekStart = addDays(today, -new Date(today + 'T00:00:00').getDay());
    for (let w = 11; w >= 0; w--) {
      const s = addDays(thisWeekStart, -w * 7);
      labels.push(s.slice(5).replace('-', '/'));
      data.push(Array.from({length: 7}, (_, i) => map[addDays(s, i)] || 0).reduce((a, b) => a + b, 0));
    }
    CHARTS.trend = new Chart(el1, {
      type:'line',
      data:{labels, datasets:[{
        data, borderColor:primary, backgroundColor:primary + '22', fill:true,
        tension:.35, borderWidth:2, pointRadius:2.5, pointBackgroundColor:primary,
      }]},
      options:{...base, plugins:{...base.plugins, legend:{display:false}}, scales:axes},
    });
  }

  /* 2. 未完成任務的專案分布 */
  const el2 = document.getElementById('chProject');
  if (el2) {
    const open = S.tasks.filter(t => t.status !== 'done');
    const byP = {};
    for (const t of open) {
      const key = t.projectId || '__none';
      byP[key] = (byP[key] || 0) + 1;
    }
    const entries = Object.entries(byP);
    CHARTS.project = new Chart(el2, {
      type:'doughnut',
      data:{
        labels: entries.map(([k]) => k === '__none' ? '未分類' : (projectById(k)?.name || '已刪除')),
        datasets:[{
          data: entries.map(([, v]) => v),
          backgroundColor: entries.map(([k]) => k === '__none' ? muted : (projectById(k) ? safeColor(projectById(k).color) : muted)),
          borderWidth:0, hoverOffset:5,
        }],
      },
      options:{...base, cutout:'62%', plugins:{...base.plugins, legend:{...base.plugins.legend, position:'right'}}},
    });
  }

  /* 3. 狀態 × 優先權堆疊 */
  const el3 = document.getElementById('chStatus');
  if (el3) {
    const statusKeys = ['todo','doing','waiting','done'];
    const prios = [['high','高',danger],['mid','中',warn],['low','低',muted]];
    CHARTS.status = new Chart(el3, {
      type:'bar',
      data:{
        labels: statusKeys.map(k => STATUS[k]),
        datasets: prios.map(([pk, plabel, color]) => ({
          label: plabel, backgroundColor: color, borderRadius:4, borderSkipped:false,
          data: statusKeys.map(sk => S.tasks.filter(t => t.status === sk && t.priority === pk).length),
        })),
      },
      options:{...base, scales:{x:{...axes.x, stacked:true}, y:{...axes.y, stacked:true}}},
    });
  }

  /* 4. 工時 預估 vs 實際 */
  const el4 = document.getElementById('chHours');
  if (el4) {
    const rows = activeProjects().map(p => {
      const list = tasksOf(p.id);
      return {name:p.name,
        est:list.reduce((a, t) => a + (t.estimate || 0), 0),
        act:list.reduce((a, t) => a + (t.actual || 0), 0)};
    }).filter(r => r.est || r.act);
    const none = S.tasks.filter(t => !t.projectId);
    const nEst = none.reduce((a, t) => a + (t.estimate || 0), 0);
    const nAct = none.reduce((a, t) => a + (t.actual || 0), 0);
    if (nEst || nAct) rows.push({name:'未分類', est:nEst, act:nAct});

    CHARTS.hours = new Chart(el4, {
      type:'bar',
      data:{
        labels: rows.length ? rows.map(r => r.name) : ['尚無資料'],
        datasets:[
          {label:'預估', data:rows.map(r => r.est), backgroundColor:primary + '77', borderRadius:4, borderSkipped:false},
          {label:'實際', data:rows.map(r => r.act), backgroundColor:ok, borderRadius:4, borderSkipped:false},
        ],
      },
      options:{...base, scales:{x:axes.x, y:{...axes.y, title:{display:true, text:'小時', color:muted, font:{size:10.5}}}}},
    });
  }
}

/* ---------- dashboard: focus + activity ---------- */
function renderFocus(){
  const pinned = S.tasks.filter(t => t.pinned && t.status !== 'done').slice(0, 3);
  if (!pinned.length) return '';
  return `<div class="focus">
    <div class="focus-head">${icon('target')}<span class="focus-title">今日焦點</span>
      <span class="focus-hint">最多 3 項</span></div>
    <div class="focus-list">${pinned.map(t => {
      const p = t.projectId ? projectById(t.projectId) : null;
      return `<div class="focus-item">
        <button class="check" type="button" data-toggle="${t.id}" aria-label="標記為完成">${icon('check')}</button>
        <span class="row-body" data-task="${t.id}" style="cursor:pointer">
          <span class="row-title">${esc(t.title)}</span>
          ${p ? `<span class="row-meta"><span>${esc(p.name)}</span></span>` : ''}
        </span>
        ${t.dueDate ? `<span class="pill ${dueClass(t.dueDate)}">${dueLabel(t.dueDate)}</span>` : ''}
        <button class="pin on" type="button" data-pin="${t.id}" aria-label="取消焦點">${icon('pin')}</button>
      </div>`;
    }).join('')}</div>
  </div>`;
}
function relTime(iso){
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return '剛剛';
  if (mins < 60) return `${mins} 分鐘前`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} 小時前`;
  const days = Math.round(hrs / 24);
  if (days < 7) return `${days} 天前`;
  return iso.slice(5, 10).replace('-', '/');
}
function renderActivity(){
  const events = [];
  for (const t of S.tasks) {
    if (t.completedAt) events.push({at:t.completedAt, kind:'done', t});
    else if (t.updatedAt && t.updatedAt !== t.createdAt) events.push({at:t.updatedAt, kind:'edit', t});
    else events.push({at:t.createdAt, kind:'new', t});
  }
  events.sort((a, b) => b.at.localeCompare(a.at));
  const top = events.slice(0, 5);
  const style = {
    done:['check','var(--success)','var(--success-soft)','完成'],
    edit:['edit','var(--primary)','var(--primary-soft)','更新'],
    new:['plus','var(--text-2)','var(--surface-2)','新增'],
  };
  if (!top.length) return '';
  return `<div>
    <div class="sec-head"><h3 class="sec-title">近期動態</h3></div>
    <div class="panel">${top.map(e => {
      const [ic, color, bg, label] = style[e.kind];
      return `<div class="act-item" data-task="${e.t.id}" style="cursor:pointer">
        <span class="act-icon" style="background:${bg};color:${color}">${icon(ic)}</span>
        <span class="act-text">${label}「${esc(e.t.title)}」</span>
        <span class="act-when">${relTime(e.at)}</span>
      </div>`;
    }).join('')}</div>
  </div>`;
}
async function togglePin(id){
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const pinnedCount = S.tasks.filter(x => x.pinned && x.status !== 'done').length;
  if (!t.pinned && pinnedCount >= 3) { toast('焦點最多 3 項，先取消一項再加'); return; }
  t.pinned = !t.pinned;
  try { await saveTask(t); } catch { return; }
  render();
}

/* ================= Phase 4: Markdown ================= */
/* 先跳脫整份原始碼，再把 Markdown 語法還原成標籤 —— 任何使用者輸入的
   HTML 都會被當成純文字，不會執行。連結只允許 http/https/mailto。 */
function mdInline(s){
  return s
    .replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (m, text, href) =>
      /^(https?:\/\/|mailto:)/i.test(href)
        ? `<a href="${href}" target="_blank" rel="noopener noreferrer">${text}</a>` : m)
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
}
function mdToHtml(src){
  if (!src || !src.trim()) return '';
  const lines = esc(src).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0, para = [], list = null;

  const flushPara = () => { if (para.length) { out.push(`<p>${mdInline(para.join(' '))}</p>`); para = []; } };
  const closeList = () => { if (list) { out.push(`</${list.tag}>`); list = null; } };
  const openList = (tag, cls) => {
    if (list && list.tag === tag && list.cls === cls) return;
    closeList();
    out.push(`<${tag}${cls ? ` class="${cls}"` : ''}>`);
    list = {tag, cls};
  };
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>';

  while (i < lines.length) {
    const line = lines[i];

    // 圍欄程式碼區塊
    const fence = line.match(/^```(\w*)\s*$/);
    if (fence) {
      flushPara(); closeList();
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${buf.join('\n')}</code></pre>`);
      continue;
    }
    // 空行
    if (!line.trim()) { flushPara(); closeList(); i++; continue; }
    // 分隔線
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushPara(); closeList(); out.push('<hr>'); i++; continue; }
    // 標題
    const hd = line.match(/^(#{1,3})\s+(.*)$/);
    if (hd) { flushPara(); closeList(); out.push(`<h${hd[1].length}>${mdInline(hd[2])}</h${hd[1].length}>`); i++; continue; }
    // 引用
    if (/^&gt;\s?/.test(line)) {
      flushPara(); closeList();
      const buf = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) buf.push(lines[i++].replace(/^&gt;\s?/, ''));
      out.push(`<blockquote>${mdInline(buf.join(' '))}</blockquote>`);
      continue;
    }
    // 表格
    if (line.includes('|') && lines[i + 1] && /^\s*\|?[\s:-]*-[\s|:-]*$/.test(lines[i + 1])) {
      flushPara(); closeList();
      const cut = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cut(line);
      i += 2;
      const body = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) body.push(cut(lines[i++]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${
        body.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    // 待辦清單
    const task = line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/);
    if (task) {
      flushPara(); openList('ul', 'md-task');
      const on = task[1].toLowerCase() === 'x';
      out.push(`<li class="${on ? 'done' : ''}"><span class="md-check${on ? ' on' : ''}">${on ? CHECK : ''}</span><span>${mdInline(task[2])}</span></li>`);
      i++; continue;
    }
    // 無序 / 有序清單
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      flushPara(); openList(ul ? 'ul' : 'ol', '');
      out.push(`<li>${mdInline((ul || ol)[1])}</li>`);
      i++; continue;
    }
    // 一般段落
    closeList();
    para.push(line.trim());
    i++;
  }
  flushPara(); closeList();
  return out.join('\n');
}

/* ================= Phase 4: command palette ================= */
const PAL = {open:false, q:'', items:[], sel:0};

function highlight(text, q){
  const t = esc(text);
  if (!q || typeof q !== 'string') return t;
  const idx = t.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return t;
  return t.slice(0, idx) + `<mark>${t.slice(idx, idx + q.length)}</mark>` + t.slice(idx + q.length);
}
const COMMANDS = [
  {id:'c-task', title:'新增任務', sub:'開啟新增任務對話框', ico:'plus', keys:['N'], run:() => taskDialog()},
  {id:'c-proj', title:'新增專案', sub:'開啟新增專案對話框', ico:'folder', run:() => projectDialog()},
  {id:'c-theme', title:'切換外觀', sub:'跟隨系統 / 淺色 / 深色', ico:'sun', run:() => cycleTheme()},
  {id:'c-export', title:'匯出備份', sub:'下載 JSON 檔', ico:'download', run:() => exportJSON()},
  {id:'g-dashboard', title:'前往 Dashboard', ico:'home', run:() => go('dashboard')},
  {id:'g-tasks', title:'前往 Tasks', ico:'checks', run:() => go('tasks')},
  {id:'g-calendar', title:'前往 Calendar', ico:'calendar', run:() => go('calendar')},
  {id:'g-projects', title:'前往 Projects', ico:'folder', run:() => go('projects')},
  {id:'g-stats', title:'前往 Statistics', ico:'chart', run:() => go('stats')},
  {id:'g-settings', title:'前往 Settings', ico:'settings', run:() => go('settings')},
];
function paletteItems(q){
  const query = q.trim().toLowerCase();
  const groups = [];

  if (!query) {
    const recent = S.tasks.filter(t => t.status !== 'done')
      .sort((a, b) => b.updatedAt.localeCompare(a.updatedAt)).slice(0, 4);
    if (recent.length) groups.push({label:'最近的任務', items:recent.map(t => taskEntry(t))});
    groups.push({label:'指令', items:COMMANDS.slice(0, 4).map(c => cmdEntry(c))});
    groups.push({label:'前往', items:COMMANDS.slice(4).map(c => cmdEntry(c))});
    return groups;
  }

  const tasks = S.tasks
    .map(t => {
      const inTitle = t.title.toLowerCase().includes(query);
      const inNotes = (t.notes || '').toLowerCase().includes(query);
      const inTags = t.tags.some(g => g.toLowerCase().includes(query));
      const inChk = t.checklist.some(c => c.text.toLowerCase().includes(query));
      if (!inTitle && !inNotes && !inTags && !inChk) return null;
      return {t, score:(inTitle ? 0 : 1) + (t.status === 'done' ? 2 : 0)};
    })
    .filter(Boolean).sort((a, b) => a.score - b.score).slice(0, 8).map(x => taskEntry(x.t, query));

  const projects = S.projects
    .filter(p => p.name.toLowerCase().includes(query)
      || (p.description || '').toLowerCase().includes(query)
      || (p.notes || '').toLowerCase().includes(query))
    .slice(0, 5).map(p => projEntry(p, query));

  const notes = S.projects
    .filter(p => (p.notes || '').toLowerCase().includes(query))
    .slice(0, 4).map(p => ({
      id:'note-' + p.id, ico:'book', title:highlight(p.name + ' 的筆記', ''),
      sub:noteSnippet(p.notes, query),
      run:() => { S.openProject = p.id; S.projectTab = 'notes'; S.route = 'projects'; render(); },
    }));

  const cmds = COMMANDS.filter(c => c.title.toLowerCase().includes(query)).map(c => cmdEntry(c));

  if (tasks.length) groups.push({label:`任務（${tasks.length}）`, items:tasks});
  if (projects.length) groups.push({label:'專案', items:projects});
  if (notes.length) groups.push({label:'筆記', items:notes});
  if (cmds.length) groups.push({label:'指令', items:cmds});
  return groups;

  function taskEntry(t, q2){
    const p = t.projectId ? projectById(t.projectId) : null;
    const bits = [];
    if (p) bits.push(p.name);
    if (t.dueDate && t.status !== 'done') bits.push(dueLabel(t.dueDate));
    bits.push(STATUS[t.status]);
    return {
      id:'t-' + t.id, ico:t.status === 'done' ? 'check' : 'checks',
      title:highlight(t.title, q2), sub:esc(bits.join('・')),
      run:() => { S.selectedTask = t.id; S.route = 'tasks'; S.taskView = 'list';
        S.taskFilter = 'all'; S.taskProject = 'all'; render(); },
    };
  }
  function projEntry(p, q2){
    const pr = projProgress(p);
    return {
      id:'p-' + p.id, ico:p.icon, color:p.color,
      title:highlight(p.name, q2), sub:`${pr.done} / ${pr.total} 項完成`,
      run:() => { S.openProject = p.id; S.projectTab = 'tasks'; S.route = 'projects'; render(); },
    };
  }
}
function cmdEntry(c){
  return {id:c.id, ico:c.ico, title:esc(c.title), sub:c.sub ? esc(c.sub) : '', keys:c.keys, run:c.run};
}
function noteSnippet(notes, q){
  const plain = notes.replace(/\s+/g, ' ');
  const i = plain.toLowerCase().indexOf(q);
  const from = Math.max(0, i - 24);
  return (from ? '…' : '') + highlight(plain.slice(from, from + 70), q) + (plain.length > from + 70 ? '…' : '');
}
function flatItems(groups){ return groups.flatMap(g => g.items); }

function renderPalette(){
  const groups = paletteItems(PAL.q);
  PAL.items = flatItems(groups);
  if (PAL.sel >= PAL.items.length) PAL.sel = Math.max(0, PAL.items.length - 1);
  let n = -1;
  const body = groups.length
    ? groups.map(g => `<p class="pal-group">${g.label}</p>` + g.items.map(it => {
        n++;
        return `<button class="pal-item" type="button" role="option" data-pal="${n}" aria-selected="${n === PAL.sel}">
          <span class="pal-ico"${it.color ? ` style="background:${safeColor(it.color)}1a;color:${safeColor(it.color)}"` : ''}>${icon(it.ico)}</span>
          <span class="pal-body">
            <span class="pal-title">${it.title}</span>
            ${it.sub ? `<span class="pal-sub">${it.sub}</span>` : ''}
          </span>
          ${it.keys ? `<span class="keys">${it.keys.map(k => `<kbd>${k}</kbd>`).join('')}</span>` : ''}
        </button>`;
      }).join('')).join('')
    : `<p class="pal-empty">找不到「${esc(PAL.q)}」相關的任務、專案或筆記</p>`;
  $('#palResults').innerHTML = body;
  const cur = $('#palResults').querySelector('[aria-selected="true"]');
  if (cur) cur.scrollIntoView({block:'nearest'});
}
function openPalette(){
  const dlg = $('#palette');
  if (dlg.open) return;
  PAL.q = ''; PAL.sel = 0;
  $('#palInput').value = '';
  renderPalette();
  dlg.showModal();
  setTimeout(() => $('#palInput').focus(), 20);
}
function closePalette(){ const d = $('#palette'); if (d.open) d.close(); }
function runPalette(i){
  const it = PAL.items[i];
  if (!it) return;
  closePalette();
  setTimeout(() => it.run(), 10);
}
function initPalette(){
  const input = $('#palInput');
  input.addEventListener('input', () => { PAL.q = input.value; PAL.sel = 0; renderPalette(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); PAL.sel = Math.min(PAL.sel + 1, PAL.items.length - 1); renderPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); PAL.sel = Math.max(PAL.sel - 1, 0); renderPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPalette(PAL.sel); }
  });
  $('#palResults').addEventListener('click', e => {
    const b = e.target.closest('[data-pal]');
    if (b) runPalette(+b.dataset.pal);
  });
  $('#palResults').addEventListener('mousemove', e => {
    const b = e.target.closest('[data-pal]');
    if (b && +b.dataset.pal !== PAL.sel) { PAL.sel = +b.dataset.pal; renderPalette(); }
  });
}

  [['N'], '新增任務'],
  [['↑','↓'], '在面板中移動'],

/* ---------------- master render ---------------- */
const TITLES = {dashboard:'Dashboard', tasks:'Tasks', calendar:'Calendar', projects:'Projects', stats:'Statistics', settings:'Settings'};
function render(){
  renderNav();
  $('#pageTitle').textContent = S.openProject && S.route === 'projects' ? 'Projects' : TITLES[S.route];
  const actions = $('#pageActions');
  const searchBtn = `<button class="searchbtn" type="button" data-open-palette aria-label="搜尋">${icon('search')}<span>搜尋</span><kbd>${navigator.platform.startsWith('Mac') ? '⌘' : 'Ctrl'} K</kbd></button>`;
  const primaryBtn = (S.route === 'tasks' || S.route === 'dashboard')
    ? `<button class="btn btn-primary btn-sm" type="button" data-new-task>${icon('plus')}新增任務</button>`
    : (S.route === 'projects' && !S.openProject)
      ? `<button class="btn btn-primary btn-sm" type="button" data-new-project>${icon('plus')}新增專案</button>`
      : '';
  actions.innerHTML = searchBtn + primaryBtn;

  destroyCharts();
  for (const r of Object.keys(TITLES)) $('#view-' + r).hidden = r !== S.route;
  const host = $('#view-' + S.route);
  if (S.route === 'dashboard') host.innerHTML = renderDashboard();
  else if (S.route === 'tasks') host.innerHTML = renderTasks();
  else if (S.route === 'calendar') { S.calMonth ||= ymOf(todayISO()); host.innerHTML = renderCalendar(); }
  else if (S.route === 'projects') host.innerHTML = renderProjects();
  else if (S.route === 'stats') host.innerHTML = renderStats();
  else host.innerHTML = renderSettings();
  applyTheme();
  bindView();
}

/* ---------------- dialogs: task / project ---------------- */
function taskDialog(){
  openDialog(`
    <h2>新增任務</h2>
    <p class="sheet-desc">只有標題是必填的，其他可以之後再補。</p>
    <div style="margin-bottom:11px"><label class="label" for="nTitle">標題</label><input class="field" id="nTitle" placeholder="要做什麼？"></div>
    <div class="detail-grid">
      <div><label class="label" for="nProject">專案</label>
        <select class="field" id="nProject"><option value="">未分類</option>${activeProjects().map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div><label class="label" for="nPriority">優先權</label>
        <select class="field" id="nPriority">${Object.entries(PRIO).map(([k,v]) => `<option value="${k}"${k === 'mid' ? ' selected' : ''}>${v.label}</option>`).join('')}</select></div>
      <div><label class="label" for="nDue">到期日</label><input class="field" id="nDue" type="date" value="${todayISO()}"></div>
      <div><label class="label" for="nStatus">狀態</label>
        <select class="field" id="nStatus">${Object.entries(STATUS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
    </div>
    <div class="sheet-foot">
      <button class="btn" type="button" data-act="cancel">取消</button>
      <button class="btn btn-primary" type="button" data-act="save">新增任務</button>
    </div>`, dlg => {
    const save = async () => {
      const title = dlg.querySelector('#nTitle').value.trim();
      if (!title) { dlg.querySelector('#nTitle').focus(); return; }
      const t = newTask({
        title,
        projectId: dlg.querySelector('#nProject').value || null,
        priority: dlg.querySelector('#nPriority').value,
        dueDate: dlg.querySelector('#nDue').value || null,
        status: dlg.querySelector('#nStatus').value,
      });
      await saveTask(t);
      closeDialog();
      S.selectedTask = t.id;
      render();
      toast('已新增任務');
    };
    dlg.querySelector('[data-act="cancel"]').onclick = closeDialog;

  });
}
function projectDialog(existing){

  openDialog(`
    <h2>${existing ? '編輯專案' : '新增專案'}</h2>
    <p class="sheet-desc">顏色與圖示會用在儀表板上，好認就好。</p>
    <div style="margin-bottom:11px"><label class="label" for="pName">名稱</label><input class="field" id="pName" value="${esc(p.name)}" placeholder="例如：網站改版"></div>
    <div style="margin-bottom:11px"><label class="label" for="pDesc">描述</label><input class="field" id="pDesc" value="${esc(p.description || '')}" placeholder="一句話說明（選填）"></div>
    <div style="margin-bottom:11px"><span class="label">顏色</span>
      <div class="swatches" id="pColors">${COLORS.map(c => `<button class="swatch" type="button" data-color="${c}" style="background:${c}" aria-pressed="${p.color === c}" aria-label="顏色 ${c}"></button>`).join('')}</div></div>
    <div><span class="label">圖示</span>
      <div class="iconpick" id="pIcons">${PROJ_ICONS.map(n => `<button type="button" data-icon="${n}" aria-pressed="${p.icon === n}" aria-label="圖示 ${n}">${icon(n)}</button>`).join('')}</div></div>
    <div class="sheet-foot">
      ${existing ? `<button class="btn btn-danger" type="button" data-act="delete" style="margin-right:auto">刪除</button>

      <button class="btn" type="button" data-act="cancel">取消</button>
      <button class="btn btn-primary" type="button" data-act="save">${existing ? '儲存' : '建立專案'}</button>
    </div>`, dlg => {
    let color = p.color, ic = p.icon;
    dlg.querySelector('#pColors').onclick = e => {
      const b = e.target.closest('[data-color]'); if (!b) return;
      color = b.dataset.color;
      dlg.querySelectorAll('#pColors .swatch').forEach(s => s.setAttribute('aria-pressed', s.dataset.color === color));
    };
    dlg.querySelector('#pIcons').onclick = e => {
      const b = e.target.closest('[data-icon]'); if (!b) return;
      ic = b.dataset.icon;
      dlg.querySelectorAll('#pIcons button').forEach(s => s.setAttribute('aria-pressed', s.dataset.icon === ic));
    };
    dlg.querySelector('[data-act="cancel"]').onclick = closeDialog;
    dlg.querySelector('[data-act="save"]').onclick = async () => {
      const name = dlg.querySelector('#pName').value.trim();
      if (!name) { dlg.querySelector('#pName').focus(); return; }
      await saveProject({...p, name, description:dlg.querySelector('#pDesc').value.trim(), color, icon:ic});
      closeDialog(); render();
      toast(existing ? '已儲存專案' : '已建立專案');
    };
    if (existing) {
      dlg.querySelector('[data-act="archive"]').onclick = async () => {
        await saveProject({...p, archived:!p.archived});
        closeDialog(); S.openProject = null; render();
        toast(p.archived ? '已取消封存' : '已封存專案');
      };
      dlg.querySelector('[data-act="delete"]').onclick = async () => {
        closeDialog();
        if (await confirmDialog('刪除專案？', `「${p.name}」底下的任務會保留並移到未分類。`)) removeProject(p.id);
      };
    }
  });
}

/* ---------------- backup ---------------- */
async function exportJSON(){
  const payload = {
    app:'workspace', version:APP_VERSION, exportedAt:new Date().toISOString(),
    projects:S.projects, tasks:S.tasks, settings:S.settings,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workspace-backup-${todayISO()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  await dbPut('settings', {key:'lastBackup', value:new Date().toISOString()});
  S.settings.lastBackup = new Date().toISOString();
  toast('備份已下載');
}
async function importJSON(file){
  let data;
  try { data = JSON.parse(await file.text()); }
  catch { toast('讀不到這個檔案，格式不是有效的 JSON'); return; }
  if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.projects)) { toast('這不是 Workspace 的備份檔'); return; }
  if (!await confirmDialog('匯入備份？', `會用備份中的 ${data.projects.length} 個專案與 ${data.tasks.length} 項任務取代現有資料。`, '匯入')) return;
  await dbClear('projects'); await dbClear('tasks');
  for (const p of data.projects) await dbPut('projects', {...p, color:safeColor(p.color)});
  for (const t of data.tasks) await dbPut('tasks', {...newTask(), ...t});
  await loadAll();
  S.selectedTask = null; S.openProject = null;
  render();
  toast(`已匯入 ${data.tasks.length} 項任務`);
}

/* ---------------- event binding ---------------- */
function bindView(){
  const host = $('#view-' + S.route);

  const qa = host.querySelector('#quickAdd, #projQuickAdd');
  if (qa) qa.onkeydown = async e => {
    if (e.key !== 'Enter') return;
    const pid = qa.id === 'projQuickAdd' ? S.openProject : null;
    const t = await quickAddTask(qa.value, pid);
    if (t) { qa.value = ''; render(); const f = $('#' + qa.id); f && f.focus(); }
  };

  const sel = host.querySelector('#taskProject');
  if (sel) sel.onchange = () => { S.taskProject = sel.value; render(); };

  if (S.route === 'tasks' && S.taskView === 'list') bindDetail(host);
  if (S.route === 'tasks' && S.taskView === 'board') bindBoard(host);
  if (S.route === 'calendar') bindCalendar(host);
  if (S.route === 'stats') buildCharts();
  if (S.route === 'projects' && S.openProject && S.projectTab === 'timeline') bindCalendar(host);

  const notes = host.querySelector('#projNotes');
  if (notes) notes.onblur = async () => {
    const p = projectById(S.openProject);
    if (p && p.notes !== notes.value) { await saveProject({...p, notes:notes.value}); toast('筆記已儲存'); }
  };

  const t2 = host.querySelector('#themeBtn2'); if (t2) t2.onclick = cycleTheme;
  const ex = host.querySelector('#exportBtn'); if (ex) ex.onclick = exportJSON;
  const im = host.querySelector('#importBtn'); if (im) im.onclick = () => $('#importFile').click();
  const cl = host.querySelector('#clearBtn');
  if (cl) cl.onclick = async () => {
    if (!await confirmDialog('清除所有資料？', '所有專案與任務都會消失，無法復原。建議先匯出一份備份。', '全部清除')) return;
    await dbClear('projects'); await dbClear('tasks');
    S.projects = []; S.tasks = []; S.selectedTask = null; S.openProject = null;
    render(); toast('資料已清除');
  };
}
function bindDetail(host){
  const t = S.tasks.find(x => x.id === S.selectedTask);
  if (!t) return;
  const upd = async patch => { Object.assign(t, patch); try { await saveTask(t); } catch { return; } render(); };
  const g = id => host.querySelector('#' + id);

  const title = g('dTitle');
  if (title) title.onblur = () => { if (title.value.trim() && title.value.trim() !== t.title) upd({title:title.value.trim()}); };
  if (title) title.onkeydown = e => { if (e.key === 'Enter') title.blur(); };
  g('dStatus').onchange = e => upd({status:e.target.value, completedAt: e.target.value === 'done' ? new Date().toISOString() : null});
  g('dPriority').onchange = e => upd({priority:e.target.value});
  g('dDue').onchange = e => upd({dueDate:e.target.value || null});
  g('dStart').onchange = e => upd({startDate:e.target.value || null});
  g('dProject').onchange = e => upd({projectId:e.target.value || null});
  g('dEstimate').onchange = e => upd({estimate: e.target.value === '' ? null : Number(e.target.value)});
  g('dActual').onchange = e => upd({actual: e.target.value === '' ? null : Number(e.target.value)});
  const notesEl = g('dNotes');
  if (notesEl) notesEl.onblur = e => { if (e.target.value !== t.notes) upd({notes:e.target.value}); };
  g('dChkNew').onkeydown = e => {
    if (e.key !== 'Enter' || !e.target.value.trim()) return;
    upd({checklist:[...t.checklist, {text:e.target.value.trim(), done:false}]});
  };
  g('dTagNew').onkeydown = e => {
    const v = e.target.value.trim();
    if (e.key !== 'Enter' || !v || t.tags.includes(v)) return;
    upd({tags:[...t.tags, v]});
  };
  host.querySelector('.detail').onclick = e => {
    const chk = e.target.closest('[data-chk]');
    if (chk) { const i = +chk.dataset.chk; t.checklist[i].done = !t.checklist[i].done; return upd({}); }
    const cd = e.target.closest('[data-chkdel]');
    if (cd) { t.checklist.splice(+cd.dataset.chkdel, 1); return upd({}); }
    const td = e.target.closest('[data-tagdel]');
    if (td) { t.tags.splice(+td.dataset.tagdel, 1); return upd({}); }
    if (e.target.closest('[data-closedetail]')) { S.selectedTask = null; render(); }
  };
}
function bindBoard(host){
  let dragId = null;
  host.querySelectorAll('.kcard').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragId = card.dataset.task; card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      // Chrome 在 dragstart 沒有 setData 時會直接取消整個拖曳
      e.dataTransfer.setData('text/plain', dragId);
    });
    card.addEventListener('dragend', () => { dragId = null; card.classList.remove('dragging'); });
  });
  host.querySelectorAll('.kcol').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('dragover');
      const id = dragId || e.dataTransfer.getData('text/plain');
      if (!id) return;
      const t = S.tasks.find(x => x.id === id);
      const status = col.dataset.kcol;
      if (!t || t.status === status) return;
      t.status = status;
      t.completedAt = status === 'done' ? new Date().toISOString() : null;
      await saveTask(t); render();
    });
  });
}

/* global delegated clicks */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-route]');
  if (nav) return go(nav.dataset.route);

  if (e.target.closest('[data-open-palette]')) return openPalette();

  const nm = e.target.closest('[data-notesmode]');
  if (nm) { S.notesMode = nm.dataset.notesmode; return render(); }
  if (e.target.closest('[data-notespeek]')) { S.notesPeek = !S.notesPeek; return render(); }

  const pinBtn = e.target.closest('[data-pin]');
  if (pinBtn) { e.stopPropagation(); return togglePin(pinBtn.dataset.pin); }

  const toggle = e.target.closest('[data-toggle]');
  if (toggle) { e.stopPropagation(); return toggleTask(toggle.dataset.toggle); }

  if (e.target.closest('[data-new-task]')) return taskDialog();
  if (e.target.closest('[data-new-project]')) return projectDialog();

  const editP = e.target.closest('[data-editproject]');
  if (editP) return projectDialog(projectById(editP.dataset.editproject));

  const unarch = e.target.closest('[data-unarchive]');
  if (unarch) { const p = projectById(unarch.dataset.unarchive); saveProject({...p, archived:false}).then(render); return; }

  const delT = e.target.closest('[data-deltask]');
  if (delT) return removeTask(delT.dataset.deltask);

  if (e.target.closest('[data-back]')) { S.openProject = null; return render(); }

  const ptab = e.target.closest('[data-ptab]');
  if (ptab) { S.projectTab = ptab.dataset.ptab; return render(); }

  const proj = e.target.closest('[data-project]');
  if (proj) { S.openProject = proj.dataset.project; S.projectTab = 'tasks'; S.route = 'projects'; render(); $('#scroller').scrollTop = 0; return; }

  const cn = e.target.closest('[data-calnav]');
  if (cn) {
    const n = +cn.dataset.calnav;
    S.calMonth = n === 0 ? ymOf(todayISO()) : shiftMonth(S.calMonth, n);
    return render();
  }
  const cm = e.target.closest('[data-calmore]');
  if (cm) { S.calSelectedDay = cm.dataset.calmore; return render(); }
  if (e.target.closest('[data-calday-clear]')) { S.calSelectedDay = null; return render(); }
  const cd = e.target.closest('[data-calday]');
  if (cd && !e.target.closest('[data-calchip]')) { S.calSelectedDay = cd.dataset.calday; return render(); }

  const ts = e.target.closest('[data-tlspan]');
  if (ts) { S.tlSpan = ts.dataset.tlspan; return render(); }
  const tn = e.target.closest('[data-tlnav]');
  if (tn) {
    const n = +tn.dataset.tlnav;
    if (n === 0) S.tlAnchor = todayISO();
    else if (S.tlSpan === 'week') S.tlAnchor = addDays(S.tlAnchor || todayISO(), n * 14);
    else S.tlAnchor = shiftMonth(ymOf(S.tlAnchor || todayISO()), n) + '-01';
    return render();
  }

  const tv = e.target.closest('[data-taskview]');
  if (tv) { S.taskView = tv.dataset.taskview; return render(); }

  const f = e.target.closest('[data-filter]');
  if (f) { S.taskFilter = f.dataset.filter; return render(); }

  const chip = e.target.closest('[data-calchip]');
  if (chip) { S.selectedTask = chip.dataset.calchip; S.route = 'tasks'; S.taskView = 'list';
    S.taskFilter = 'all'; S.taskProject = 'all'; return render(); }

  const row = e.target.closest('[data-task]');
  if (row && !row.classList.contains('kcard')) {
    S.selectedTask = row.dataset.task;
    if (S.route !== 'tasks') { S.route = 'tasks'; S.taskView = 'list'; S.taskFilter = 'all'; S.taskProject = 'all'; }
    return render();
  }
  if (row && row.classList.contains('kcard')) {
    S.selectedTask = row.dataset.task; S.taskView = 'list'; return render();
  }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    return $('#palette').open ? closePalette() : openPalette();
  }
  const row = e.target.closest('.row[data-task]');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); row.click(); }
  if (e.key === 'n' && !e.metaKey && !e.ctrlKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && !$('#dlg').open) {
    e.preventDefault(); taskDialog();
  }
});
$('#themeBtn').onclick = cycleTheme;
$('#importFile').onchange = e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; };

/* ---------------- service worker ---------------- */
function registerSW(){
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', () => {
        if (sw.state === 'installed' && navigator.serviceWorker.controller) $('#updateBar').classList.add('show');
      });
    });
  }).catch(() => {});
  $('#updateBtn').onclick = () => {
    navigator.serviceWorker.getRegistration().then(r => r && r.waiting && r.waiting.postMessage('skipWaiting'));
    setTimeout(() => location.reload(), 200);
  };
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}

/* ---------------- boot ---------------- */
async function loadAll(){
  S.projects = await dbAll('projects');
  S.tasks = (await dbAll('tasks')).map(t => ({...newTask(), ...t}));
  const st = await dbAll('settings');
  S.settings = Object.fromEntries(st.map(s => [s.key, s.value]));
}
async function seedIfEmpty(){
  if (S.projects.length || S.tasks.length || S.settings.seeded) return;
  const p1 = {id:uid(), name:'網站改版', color:'#2563eb', icon:'layout', description:'首頁與產品頁重新設計', notes:'', archived:false, createdAt:new Date().toISOString()};
  const p2 = {id:uid(), name:'個人學習', color:'#15803d', icon:'book', description:'', notes:'', archived:false, createdAt:new Date().toISOString()};
  await saveProject(p1); await saveProject(p2);
  const seed = [
    newTask({title:'完成首頁設計稿', projectId:p1.id, priority:'high', dueDate:todayISO(), status:'doing',
      checklist:[{text:'桌機版', done:true},{text:'手機版', done:false}], tags:['設計']}),
    newTask({title:'整理這週的進度紀錄', dueDate:todayISO(), priority:'mid'}),
    newTask({title:'確認網站架構', projectId:p1.id, status:'done', dueDate:addDays(todayISO(), -2), completedAt:new Date().toISOString()}),
    newTask({title:'讀完 IndexedDB 那篇文件', projectId:p2.id, priority:'low', dueDate:addDays(todayISO(), 3)}),
    newTask({title:'跟客戶確認上線時間', projectId:p1.id, priority:'high', dueDate:addDays(todayISO(), -1), status:'waiting'}),
  ];
  for (const t of seed) await saveTask(t);
  await dbPut('settings', {key:'seeded', value:true});
  S.settings.seeded = true;
}
async function boot(){
  try {
    await openDB();
    await loadAll();
    await seedIfEmpty();
  } catch (err) {
    $('#view-dashboard').innerHTML = `<div class="panel"><div class="empty"><p class="empty-title">無法開啟本機資料庫</p><p class="empty-text">瀏覽器可能停用了 IndexedDB，或正在無痕模式。換一般視窗再試一次。</p></div></div>`;
    return;
  }
  applyTheme();
  render();
  initPalette();
  registerSW();
  const last = S.settings.lastBackup;
  if (S.tasks.length > 8 && (!last || (Date.now() - new Date(last)) > 14 * 86400000)) {
    setTimeout(() => toast('好一陣子沒備份了', '去匯出', () => go('settings')), 1500);
  }
}
boot();

</script>
